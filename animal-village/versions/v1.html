<head>

<style>
html,body{margin:0;height:100%;background:#2b3a2a;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}

<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VW=960,VH=600,T=32,MW=48,MH=36;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(a,b){let h=(a*374761393+b*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295;}
const SEASONS=['春','夏','秋','冬'];
/* ---------- fit canvas ---------- */
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=VW*s+'px';cv.style.height=VH*s+'px';}
addEventListener('resize',fit);fit();
/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.12,type='sine',v=.06,delay=0,slide=0){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
const sfx={
 step(){tone(120+rnd(30),.05,'triangle',.015)},
 pop(){tone(520,.08,'sine',.07,0,300)},
 bell(){tone(988,.25,'sine',.06);tone(1318,.3,'sine',.05,.08)},
 splash(){tone(300,.25,'sawtooth',.02,0,-200)},
 bite(){tone(880,.1,'square',.05);tone(1180,.15,'square',.05,.1)},
 catch(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.07,i*.09))},
 fail(){tone(300,.3,'sine',.06,0,-150)},
 ok(){tone(660,.1,'triangle',.06);tone(880,.15,'triangle',.06,.08)},
 swing(){tone(700,.12,'sawtooth',.02,0,-400)},
 talk(p=1){tone(300*p+rnd(80),.05,'square',.02)},
 shake(){tone(200,.15,'triangle',.04,0,60)},
};
const SCALE=[0,2,4,7,9];
let musicT=0,musicI=0;
function music(dt,hour){musicT-=dt;if(musicT>0||muted)return;musicT=.55+.15*(hour<6||hour>21?1:0);musicI++;
 const base=[261.6,293.7,246.9,220][Math.floor(musicI/8)%4];
 if(musicI%2===0||Math.random()<.4){const n=pick(SCALE)+(Math.random()<.3?12:0);const f=base*Math.pow(2,n/12);tone(f,.7,'sine',.022);}
 if(musicI%8===0)tone(base/2,1.4,'triangle',.03);}
/* ---------- time/season/weather ---------- */
let timeShift=0,seasonShift=0;
function clock(){const d=new Date(Date.now()+timeShift*3600e3);const hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
 const m=d.getMonth();const season=(Math.floor(((m+10)%12)/3)+seasonShift)%4;
 return {d,hour,season,key:d.getFullYear()*400+d.getMonth()*32+d.getDate()};}
function weatherOf(c){const r=hash(c.key,7);if(c.season===3)return r<.4?'snow':'clear';if(c.season===1)return r<.2?'rain':'clear';return r<.3?'rain':'clear';}
/* ---------- items ---------- */
const FISH=[
 {id:'aji',name:'アジ',loc:'sea',price:80,seasons:[0,1,2,3],hours:[0,24],col:'#7fb8d8',rare:1},
 {id:'saba',name:'サバ',loc:'sea',price:120,seasons:[2,3],hours:[0,24],col:'#4f86a8',rare:2},
 {id:'tai',name:'マダイ',loc:'sea',price:400,seasons:[0,3],hours:[5,18],col:'#f07a7a',rare:3},
 {id:'hirame',name:'ヒラメ',loc:'sea',price:500,seasons:[3],hours:[16,9],col:'#c9b48a',rare:3},
 {id:'funa',name:'フナ',loc:'pond',price:60,seasons:[0,1,2,3],hours:[0,24],col:'#a6a27a',rare:1},
 {id:'medaka',name:'メダカ',loc:'pond',price:40,seasons:[0,1],hours:[6,19],col:'#bcd6e6',rare:1},
 {id:'namazu',name:'ナマズ',loc:'pond',price:300,seasons:[1,2],hours:[18,4],col:'#5d5a52',rare:2},
 {id:'koi',name:'ニシキゴイ',loc:'pond',price:900,seasons:[0,1,2],hours:[4,21],col:'#ff8a3c',rare:4},
].map(f=>({...f,cat:'fish'}));
const BUGS=[
 {id:'monshiro',name:'モンシロチョウ',price:60,seasons:[0],hours:[6,18],col:'#ffffff',fly:1},
 {id:'tento',name:'テントウムシ',price:100,seasons:[0,1],hours:[6,18],col:'#e23a2c',fly:0},
 {id:'ageha',name:'アゲハチョウ',price:160,seasons:[1],hours:[7,18],col:'#ffd23c',fly:1},
 {id:'hotaru',name:'ホタル',price:300,seasons:[1],hours:[19,4],col:'#d8ff5c',fly:1},
 {id:'kabuto',name:'カブトムシ',price:500,seasons:[1],hours:[20,8],col:'#5a3b24',fly:0,tree:1},
 {id:'akane',name:'アキアカネ',price:120,seasons:[2],hours:[6,18],col:'#e8552c',fly:1},
 {id:'kamakiri',name:'カマキリ',price:180,seasons:[2],hours:[6,18],col:'#6cbf4a',fly:0},
 {id:'suzumushi',name:'スズムシ',price:200,seasons:[2],hours:[18,6],col:'#8a6a3a',fly:0},
 {id:'yukimushi',name:'ユキムシ',price:150,seasons:[3],hours:[6,20],col:'#e8f2ff',fly:1},
].map(b=>({...b,cat:'bug'}));
const FRUITS=[
 {id:'fruit0',name:'さくらんぼ',price:100,col:'#d82a52',cat:'fruit'},
 {id:'fruit1',name:'もも',price:150,col:'#ffb09a',cat:'fruit'},
 {id:'fruit2',name:'りんご',price:120,col:'#d8242c',cat:'fruit'},
 {id:'fruit3',name:'みかん',price:110,col:'#ff9a1c',cat:'fruit'},
];
const ITEMS={};[...FISH,...BUGS,...FRUITS].forEach(i=>ITEMS[i.id]=i);
const inHours=(h,[a,b])=>a<=b?(h>=a&&h<b):(h>=a||h<b);
const avail=(i,c)=>(!i.seasons||i.seasons.includes(c.season))&&(!i.hours||inHours(c.hour,i.hours));
/* ---------- furniture ---------- */
const FURN=[
 {id:'bench',name:'ベンチ',price:300},{id:'lamp',name:'街灯',price:400},{id:'bed',name:'花壇',price:250},
 {id:'swing',name:'ブランコ',price:800},{id:'fountain',name:'噴水',price:1500},{id:'statue',name:'うさぎの像',price:2000},
];
const SLOTS=[[16,14],[19,15],[25,15],[28,14],[17,17],[27,17]].map(([x,y])=>({x:x*T+16,y:y*T+16}));
/* ---------- state ---------- */
const S={bells:500,inv:{},seen:{},friend:{},quest:{},furn:[null,null,null,null,null,null],px:22*T,py:19*T,rewards:{}};
function save(){try{localStorage.setItem('dobutsu1',JSON.stringify({...S,px:P.x,py:P.y}));toast('セーブしました');}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem('dobutsu1'));if(j){Object.assign(S,j);return true}}catch(e){}return false;}
/* ---------- map ---------- */
const tiles=new Uint8Array(MW*MH); // 0 grass 1 sea 2 sand 3 path 4 pond
const tileAt=(x,y)=>x<0||y<0||x>=MW||y>=MH?1:tiles[y*MW+x];
const isWater=t=>t===1||t===4;
function genMap(){
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  let t=0;const sea=5+Math.round(1.6*Math.sin(y*.55)+.8*Math.sin(y*1.3));
  if(x<sea)t=1;else if(x<sea+2)t=2;
  const dx=(x-36)/5.4,dy=(y-25)/3.8,r=dx*dx+dy*dy;
  if(r<1)t=4;else if(r<1.5&&t===0)t=2;
  tiles[y*MW+x]=t;}
 const path=(x,y)=>{if(x>=0&&y>=0&&x<MW&&y<MH&&!isWater(tiles[y*MW+x]))tiles[y*MW+x]=3;};
 for(let x=8;x<=44;x++){path(x,11);path(x,12);}
 for(let y=12;y<=31;y++){path(22,y);path(23,y);}
 for(let x=18;x<=27;x++)for(let y=18;y<=20;y++)path(x,y);
}
genMap();
const BUILD=[
 {id:'shop',x:9,y:7,w:4,h:3,roof:'#5aa6d8',wall:'#fff1c9',name:'もぐらの店'},
 {id:'kuma',x:15,y:7,w:3,h:3,roof:'#b9794a',wall:'#fff1c9',npc:'kuma'},
 {id:'home',x:20,y:7,w:4,h:3,roof:'#6cbf6c',wall:'#fff6dc',name:'じぶんの家'},
 {id:'mike',x:27,y:7,w:3,h:3,roof:'#f09a4a',wall:'#fff1c9',npc:'mike'},
 {id:'pyon',x:33,y:7,w:3,h:3,roof:'#f08ab0',wall:'#fff1c9',npc:'pyon'},
 {id:'gako',x:39,y:7,w:3,h:3,roof:'#f2d34a',wall:'#fff1c9',npc:'gako'},
];
BUILD.forEach(b=>{b.door={x:(b.x+Math.floor(b.w/2))*T+T/2,y:(b.y+b.h)*T+T/2};});
/* objects: trees, rocks, flowers */
const OBJ=[];const FLOW=[];
function freeSpot(tx,ty){if(tileAt(tx,ty)!==0)return false;for(const b of BUILD){if(tx>=b.x-1&&tx<=b.x+b.w&&ty>=b.y-1&&ty<=b.y+b.h+1)return false;}
 for(const o of OBJ)if(Math.abs(o.tx-tx)<3&&Math.abs(o.ty-ty)<3&&o.k==='tree')return false;
 if(tx>=15&&tx<=30&&ty>=13&&ty<=21)return false;return true;}
(function(){let n=0,tries=0;while(n<48&&tries<4000){tries++;const tx=8+Math.floor(Math.random()*38),ty=3+Math.floor(Math.random()*31);if(ty>=6&&ty<=13&&tx>=8&&tx<=44)continue;if(!freeSpot(tx,ty))continue;OBJ.push({k:'tree',tx,ty,x:tx*T+16,y:ty*T+28,fruit:2,sh:0,fr:Math.random()<.6});n++;}
 tries=0;let r=0;while(r<8&&tries<800){tries++;const tx=8+Math.floor(Math.random()*38),ty=14+Math.floor(Math.random()*20);if(tileAt(tx,ty)!==0||!freeSpot(tx,ty))continue;OBJ.push({k:'rock',tx,ty,x:tx*T+16,y:ty*T+24});r++;}
 tries=0;let f=0;while(f<140&&tries<2000){tries++;const tx=8+Math.floor(Math.random()*38),ty=2+Math.floor(Math.random()*33);if(tileAt(tx,ty)!==0)continue;FLOW.push({x:tx*T+rnd(4,28),y:ty*T+rnd(8,30),c:Math.floor(rnd(4))});f++;}
})();
OBJ.forEach(o=>{if(o.k==='tree'&&!o.fr)o.fruit=0;});
function respawnFruit(){OBJ.forEach(o=>{if(o.k==='tree'&&o.fr)o.fruit=2;});}
/* ---------- player ---------- */
const P={x:S.px,y:S.py,dir:2,moving:false,anim:0,lock:0,sprint:false};
const DIRV=[[0,-1],[1,0],[0,1],[-1,0]];
function solidAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(isWater(tileAt(tx,ty)))return true;
 for(const b of BUILD){if(x>b.x*T+2&&x<(b.x+b.w)*T-2&&y>b.y*T+22&&y<(b.y+b.h)*T)return true;}
 for(const o of OBJ){if(o.k==='tree'&&Math.abs(x-o.x)<9&&Math.abs(y-o.y)<7)return true;if(o.k==='rock'&&Math.abs(x-o.x)<12&&Math.abs(y-o.y)<8)return true;}
 if(x<8||y<8||x>MW*T-8||y>MH*T-8)return true;return false;}
function blocked(x,y){return solidAt(x-8,y)||solidAt(x+8,y)||solidAt(x-8,y-6)||solidAt(x+8,y-6);}
/* ---------- NPCs ---------- */
const NPCS=[
 {id:'mike',name:'ミケ',sp:'cat',col:'#f2a04a',home:BUILD[3],fav:'fish',pitch:1.25,tail:'にゃ',
  say:{morning:['おはようだにゃ！いい朝だにゃ〜','朝ごはんは魚に限るにゃ！'],day:['なんだか走りたい気分だにゃ！','ひなたぼっこ最高だにゃ〜'],evening:['夕焼けがきれいだにゃ…','そろそろ帰る時間だにゃ'],night:['夜は目がさえるにゃ！','星がきれいだにゃ〜'],rain:['雨は苦手だにゃ…','ぬれるのはイヤだにゃ〜'],snow:['ゆきだにゃ！こたつに入りたいにゃ'],
   s:['春のお花はいい匂いだにゃ','夏はプールで泳ぎたいにゃ','秋は食欲の秋だにゃ！','冬はこたつでまるくなるにゃ']}},
 {id:'kuma',name:'クマゴロウ',sp:'bear',col:'#a9703c',home:BUILD[1],fav:'fruit',pitch:.6,tail:'なあ',
  say:{morning:['ふあぁ…まだ眠いなあ','朝か…はちみつ食べたいなあ'],day:['ゆっくりするのが一番だなあ','昼寝日和だなあ'],evening:['夕方はおなかがすくなあ'],night:['そろそろ寝るかなあ…'],rain:['雨の音は眠くなるなあ'],snow:['冬ごもりしたいなあ…'],
   s:['春はぽかぽかでいいなあ','夏は暑くてだるいなあ','秋は木の実がおいしいなあ','冬は眠くて眠くてなあ']}},
 {id:'pyon',name:'ぴょん太',sp:'rabbit',col:'#fafafa',home:BUILD[4],fav:'bug',pitch:1.6,tail:'ッス',
  say:{morning:['朝ランいくッス！！','おはようッス！体力全開ッス！'],day:['今日もいい汗かいてるッス！','ジャンプ力を鍛えてるッス！'],evening:['夕方ダッシュするッス！'],night:['夜のストレッチが大事ッス！'],rain:['雨でも走るッス！…ぬれるッス'],snow:['雪の上はトレーニングになるッス！'],
   s:['春は走りやすいッス！','夏は汗の量がハンパないッス','秋はスポーツの秋ッス！','冬は寒くて縮こまるッス']}},
 {id:'gako',name:'ガーコ',sp:'duck',col:'#ffd84a',home:BUILD[5],fav:'fish',pitch:1.0,tail:'ですわ',
  say:{morning:['ごきげんよう、いい朝ですわ','朝の紅茶は欠かせませんわ'],day:['午後のお茶会はいかがですわ？','優雅な一日ですわね'],evening:['夕暮れは詩的ですわね'],night:['夜更かしは美容の敵ですわ'],rain:['雨の日は読書ですわ'],snow:['雪景色は絵画のようですわ'],
   s:['春のお花見は格別ですわ','夏の水辺は私の舞台ですわ','秋の読書は至福ですわ','冬の暖炉もよろしいですわ']}},
];
NPCS.forEach((n,i)=>{n.x=n.home.door.x+rnd(-20,20);n.y=n.home.door.y+30+rnd(0,40);n.tx=n.x;n.ty=n.y;n.wait=rnd(1,4);n.dir=2;n.anim=0;n.hidden=false;S.friend[n.id]=S.friend[n.id]||0;});
function updNPC(n,dt,c){
 const sleeping=c.hour>=23||c.hour<6;n.hidden=sleeping;if(sleeping)return;
 n.wait-=dt;
 if(n.wait<=0){const hx=n.home.door.x,hy=n.home.door.y;let tx=hx+rnd(-200,200),ty=hy+rnd(40,260);
  if(c.hour>=17&&c.hour<22){tx=22*T+rnd(-120,120);ty=19*T+rnd(-50,50);}
  if(!blocked(tx,ty)&&tx>60&&tx<MW*T-60){n.tx=tx;n.ty=ty;}n.wait=rnd(2,7);}
 const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);n.mv=d>3;
 if(n.mv){const sp=38*dt;const nx=n.x+dx/d*sp,ny=n.y+dy/d*sp;if(!blocked(nx,ny)){n.x=nx;n.y=ny;}else n.wait=0;n.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);n.anim+=dt*8;}
}
/* ---------- bugs ---------- */
const bugs=[];
function updBugs(dt,c){
 const cand=BUGS.filter(b=>avail(b,c));
 for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(!avail(b.def,c)){bugs.splice(i,1);continue;}
  b.t-=dt;if(b.t<=0){b.ang=rnd(6.28);b.t=rnd(.6,2.2);b.sp=b.def.fly?rnd(25,55):rnd(6,18);}
  const pd=Math.hypot(P.x-b.x,P.y-b.y);if(pd<64&&P.sprint&&P.moving){b.ang=Math.atan2(b.y-P.y,b.x-P.x);b.sp=70;b.t=.6;}
  const nx=b.x+Math.cos(b.ang)*b.sp*dt,ny=b.y+Math.sin(b.ang)*b.sp*dt;
  if(tileAt(Math.floor(nx/T),Math.floor(ny/T))===0||b.def.fly&&!solidAt(nx,ny)){b.x=nx;b.y=ny;}else b.t=0;
  b.ph+=dt*(b.def.fly?14:4);}
 if(cand.length&&bugs.length<12&&Math.random()<dt*.8){const def=pick(cand);let x,y;
  if(def.tree){const t=OBJ.filter(o=>o.k==='tree');const o=pick(t);x=o.x+rnd(-10,10);y=o.y-rnd(0,8);}
  else{x=P.x+rnd(-420,420);y=P.y+rnd(-300,300);}
  if(x>40&&y>40&&x<MW*T-40&&y<MH*T-40&&tileAt(Math.floor(x/T),Math.floor(y/T))===0&&!solidAt(x,y))bugs.push({def,x,y,ang:0,t:0,sp:10,ph:rnd(6)});}
}
/* ---------- particles / toasts ---------- */
const parts=[];const floats=[];
function burst(x,y,col,n=8,sp=60){for(let i=0;i<n;i++){const a=rnd(6.28),s=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:rnd(.4,.9),m:.9,col,sz:rnd(2,4)});}}
function floatText(x,y,txt,col='#fff'){floats.push({x,y,txt,col,l:1.4});}
let toastMsg='',toastT=0;
function toast(m){toastMsg=m;toastT=2.2;}
/* ---------- game modes ---------- */
let mode='play'; // play talk menu fish card
let dlg=null,menu=null,card=null,fish=null,swingT=0;
const keys={};let pressed={};
function inv(id){return S.inv[id]||0;}
function addItem(id,n=1){S.inv[id]=inv(id)+n;const isNew=!S.seen[id];S.seen[id]=1;return isNew;}
function say(who,lines,after){dlg={who,lines:[...lines],i:0,pos:0,after,done:false};mode='talk';}
function openMenu(title,items,opt={}){menu={title,items,sel:0,opt,rects:[]};mode='menu';sfx.pop();}
function closeMenu(){menu=null;if(mode==='menu')mode='play';}
/* NPC interaction */
function hearts(id){return '♥'.repeat(S.friend[id])+'♡'.repeat(5-S.friend[id]);}
function talkNPC(n){
 const c=clock(),w=weatherOf(c);let pool;
 if(w==='rain')pool=n.say.rain;else if(w==='snow')pool=n.say.snow;
 else pool=c.hour<10?n.say.morning:c.hour<17?n.say.day:c.hour<21?n.say.evening:n.say.night;
 const lines=[pick(pool)];if(Math.random()<.5)lines.push(n.say.s[c.season]);
 if(S.friend[n.id]>=3&&Math.random()<.5)lines.push('あなたと話すと楽しいよ！これからもよろしくね！');
 say(n,lines,()=>npcMenu(n));
}
function npcMenu(n){
 const q=S.quest[n.id];
 const items=[{label:'おしゃべり',fn:()=>{closeMenu();talkNPC(n)}},
  {label:'プレゼントをあげる',fn:()=>giftMenu(n)},
  {label:q?'おつかいの品をわたす':'おねがいごとを聞く',fn:()=>questAct(n)},
  {label:'さようなら',fn:()=>closeMenu()}];
 openMenu(n.name+'　'+hearts(n.id),items);
}
function giftMenu(n){
 const ids=Object.keys(S.inv).filter(i=>S.inv[i]>0);
 if(!ids.length){closeMenu();say(n,['あげられるものがないみたいだよ。']);return;}

  if(t===0&&h<.3){g.strokeStyle=season===3?'#cfdde0':'#6fb864';g.lineWidth=2;const a=h*100%28+2,b=(h*977)%28+2;g.beginPath();g.moveTo(x*T+a,y*T+b);g.lineTo(x*T+a-2,y*T+b-6);g.moveTo(x*T+a,y*T+b);g.lineTo(x*T+a+3,y*T+b-5);g.stroke();}
  if(t===3&&h<.4){g.fillStyle='#d1ad7a';g.beginPath();g.arc(x*T+h*70%26+3,y*T+h*300%26+3,2.5,0,6.3);g.fill();}}
 // shore foam
 g.strokeStyle='#ffffffcc';g.lineWidth=3;
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(!isWater(tiles[y*MW+x]))continue;
  if(!isWater(tileAt(x+1,y))){g.beginPath();g.moveTo(x*T+T-1,y*T);g.lineTo(x*T+T-1,y*T+T);g.stroke();}
  if(!isWater(tileAt(x,y-1))){g.beginPath();g.moveTo(x*T,y*T+1);g.lineTo(x*T+T,y*T+1);g.stroke();}
  if(!isWater(tileAt(x,y+1))){g.beginPath();g.moveTo(x*T,y*T+T-1);g.lineTo(x*T+T,y*T+T-1);g.stroke();}

 baseSeason=season;
}

  if(S.seen[it.id]){drawItemIcon(it.id,x+44,y+48,1.3);ctx.textAlign='left';ctx.fillStyle='#6b4a2b';ctx.font='bold 16px sans-serif';ctx.fillText(it.name,x+84,y+38);ctx.font='13px sans-serif';
   const ss=it.seasons?it.seasons.map(s=>SEASONS[s]).join('・'):'通年';ctx.fillText(ss+(it.hours?'　'+it.hours[0]+'〜'+it.hours[1]+'時':''),x+84,y+60);ctx.fillText(it.price+'ベル',x+84,y+80);}
  else{ctx.fillStyle='#b99a6a';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText('？',x+120,y+58);}});
 ctx.fillStyle='#8a6a3a';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('← →：タブ切替　Enter／Esc：とじる',VW/2,VH-56);
}
function updBook(){if(isPressed('arrowright','d'))book.tab=(book.tab+1)%3;if(isPressed('arrowleft','a'))book.tab=(book.tab+2)%3;if(isPressed('enter','escape','tab',' ')){book=null;mode='play';}}
/* ---------- loop ---------- */
let last=performance.now(),dayKey=0;
function frame(nt){const dt=Math.min(.05,(nt-last)/1000);last=nt;
 const c=clock();if(c.key!==dayKey){dayKey=c.key;respawnFruit();}
 if(mode==='play')updPlay(dt);else if(mode==='fish'){updFish(dt);}else if(mode==='talk')updDialog();else if(mode==='menu')updMenu();else if(mode==='card')updCard();else if(mode==='book')updBook();
 NPCS.forEach(n=>updNPC(n,dt,c));updBugs(dt,c);OBJ.forEach(o=>{if(o.sh>0)o.sh-=dt;});
 music(dt,c.hour);
 render(dt);pressed={};requestAnimationFrame(frame);}
if(load()){P.x=S.px;P.y=S.py;}
requestAnimationFrame(frame);
setTimeout(()=>{if(mode==='play')say(NPCS[0],['ようこそ、どうぶつの村へだにゃ！','ここでは釣りや虫とり、おしゃべりをしてのんびり暮らせるにゃ。','まずは Enter で「あそびかた」…じゃなくて、Tab でメニューを開いてみるにゃ！']);},300);
window.__game={S,P,NPCS,OBJ,bugs,get mode(){return mode},clock,setShift:(t,s)=>{timeShift=t;seasonShift=s}};
</script>
