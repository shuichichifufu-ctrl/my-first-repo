  say(n,lines,()=>npcMenu(n));return;}
 const extra=[];
 extra.push(()=>{let l;do{l=pick(n.chat)}while(l===n.last&&n.chat.length>1);n.last=l;return l;});
 extra.push(()=>pick(n.say.s[c.season]));
 if(fr>0)extra.push(()=>pick(n.lv[fr]));
 const placed=S.placed.map(f=>f.id);
 if(placed.length)extra.push(()=>`お庭の${FURN.find(f=>f.id===pick(placed)).name}、いいね${n.tail}。`);
 if(fr>=2&&!S.wishDone[n.id]&&!S.placed.some(f=>f.id===n.wish))extra.push(()=>`${FURN.find(f=>f.id===n.wish).name}が欲しいなあって思ってるんだ${n.tail}。`);
 const k=fr>=3?3:2;const used=new Set();
 while(lines.length<k+1&&used.size<extra.length){const i=Math.floor(Math.random()*extra.length);if(used.has(i))continue;used.add(i);lines.push(extra[i]());}
 say(n,lines,()=>npcMenu(n));

 for(let i=0;i<1100;i++){const tx=Math.floor(hash(i,1)*MW),ty=Math.floor(hash(i,2)*MH);if(tileAt(tx,ty)!==0||tileAt(tx-1,ty)!==0||tileAt(tx+1,ty)!==0||tileAt(tx,ty-1)!==0||tileAt(tx,ty+1)!==0)continue;const px=(tx+hash(i,3))*T,py=(ty+hash(i,4))*T,r=22+hash(i,5)*34;const gr=g.createRadialGradient(px,py,0,px,py,r);const light=hash(i,6)<.5;gr.addColorStop(0,light?(season===3?'rgba(255,255,255,.35)':'rgba(255,255,200,.16)'):(season===3?'rgba(150,180,200,.18)':'rgba(40,120,60,.13)'));gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(px-r,py-r,r*2,r*2);}
 g.strokeStyle='#c59a62';g.lineWidth=2;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(tiles[y*MW+x]!==3)continue;[[1,0],[0,1],[-1,0],[0,-1]].forEach(([dx,dy])=>{const n=tileAt(x+dx,y+dy);if(n===3||isWater(n))return;g.beginPath();if(dx){g.moveTo(x*T+(dx>0?T-1:1),y*T);g.lineTo(x*T+(dx>0?T-1:1),y*T+T);}else{g.moveTo(x*T,y*T+(dy>0?T-1:1));g.lineTo(x*T+T,y*T+(dy>0?T-1:1));}g.stroke();});}

function hintOf(it){const a=[];a.push(it.seasons&&it.seasons.length<4?it.seasons.map(q=>SEASONS[q]).join('・'):'通年');
 if(it.hours&&!(it.hours[0]===0&&it.hours[1]===24)){const dayish=it.hours[0]>=4&&it.hours[0]<=9&&it.hours[1]>=16&&it.hours[1]<=21;a.push(dayish?'昼':'夜が多い');}
 a.push(it.loc==='sea'?'海':it.loc==='pond'?'池':it.tree?'木の近く':it.cat==='fruit'?'木をゆらす':it.cat==='treasure'?'地面をほる':'くさむら');return a.join('・');}
function drawBook(){
 ctx.fillStyle='#0008';ctx.fillRect(0,0,VW,VH);panel(60,30,VW-120,VH-60,24);
 const tabs=[['魚',FISH],['虫',BUGS],['果物',FRUITS],['たから',TREAS]];
 ctx.font='bold 18px sans-serif';ctx.textAlign='center';
 tabs.forEach(([nm,l],i)=>{const x=90+i*120;ctx.fillStyle=book.tab===i?'#ffd76a':'#f3e3b8';rr(x,44,108,34,14);ctx.fill();ctx.fillStyle='#6b4a2b';ctx.fillText(nm,x+54,67);});
 const all=tabs[book.tab][1];const per=15,pages=Math.ceil(all.length/per);if(book.page>=pages)book.page=0;const list=all.slice(book.page*per,book.page*per+per);const got=all.filter(i=>S.seen[i.id]).length;
 ctx.textAlign='right';ctx.fillText(`${got} / ${all.length}　ぜんぶで ${regCount()} 種`,VW-90,68);
 list.forEach((it,i)=>{const col=i%3,row=Math.floor(i/3);const x=90+col*264,y=88+row*70;
  ctx.fillStyle=S.seen[it.id]?'#fff':'#ead9b0';rr(x,y,248,64,14);ctx.fill();
  if(S.seen[it.id]){drawItemIcon(it.id,x+40,y+32,1.0);ctx.textAlign='left';ctx.fillStyle='#6b4a2b';ctx.font='bold 15px sans-serif';ctx.fillText(it.name,x+76,y+20);ctx.font='12px sans-serif';
   let ss=it.seasons?(it.seasons.length===4?'通年':it.seasons.map(s=>SEASONS[s]).join('・')):'通年';if(it.hours)ss+=(it.hours[0]===0&&it.hours[1]===24)?'　1日中':'　'+it.hours[0]+'〜'+it.hours[1]+'時';
   if(it.loc)ss+='　'+(it.loc==='sea'?'海':'池');
   ctx.fillText(ss,x+76,y+37);ctx.fillText(it.price+'ベル',x+76,y+53);}
  else{drawSilh(it.id,x+40,y+32,1.0);ctx.textAlign='left';ctx.fillStyle='#8a6a3a';ctx.font='bold 15px sans-serif';ctx.fillText('？？？？',x+76,y+20);ctx.font='12px sans-serif';ctx.fillText(hintOf(it),x+76,y+37);ctx.fillText('まだ出会っていない',x+76,y+53);}});
 ctx.fillStyle='#8a6a3a';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('つぎのごほうび：'+(nextGoal()||'ぜんぶ達成！'),VW/2,VH-62);
 ctx.font='13px sans-serif';ctx.fillText('← →：タブ切替'+(pages>1?'　↑ ↓：ページ '+(book.page+1)+'/'+pages:'')+'　Enter／Esc：とじる',VW/2,VH-42);
}
function updBook(){if(isPressed('arrowright','d')){book.tab=(book.tab+1)%4;book.page=0;}if(isPressed('arrowleft','a')){book.tab=(book.tab+3)%4;book.page=0;}if(isPressed('arrowdown','s'))book.page++;if(isPressed('arrowup','w'))book.page=Math.max(0,book.page-1);if(isPressed('enter','escape','tab',' ')){book=null;mode='play';}}
/* ---------- loop ---------- */
let last=performance.now(),dayKey=0,saveT=0;
function frame(nt){const dt=Math.min(.05,(nt-last)/1000);last=nt;
 const c=clock();if(c.key!==dayKey){dayKey=c.key;respawnFruit();genSpots(c.key);ensureDaily(c);}
 if(mode==='title'){if(isPressed('enter',' ','e'))startGame();}else if(mode==='play')updPlay(dt);else if(mode==='fish'){updFish(dt);}else if(mode==='talk')updDialog();else if(mode==='menu')updMenu();else if(mode==='card')updCard();else if(mode==='book')updBook();
 NPCS.forEach(n=>{updNPC(n,dt,c);npcSocial(n,dt,c);});updBugs(dt,c);OBJ.forEach(o=>{if(o.sh>0)o.sh-=dt;});
 actCool=Math.max(0,actCool-dt);music(dt,c.hour);fwT-=dt;if(fwT<=0){fwT=rnd(7,14);if(!inRoom&&vLevel()>=5&&inHours(c.hour,[19.5,23.5]))fireworks();}saveT+=dt;if(saveT>12&&mode==='play'){save(true);saveT=0;}if(mode==='play'&&pend.length&&!P.lock)flushPend();
 render(dt);pressed={};requestAnimationFrame(frame);}
const hadSave=load();if(hadSave){P.x=S.px;P.y=S.py;}applyVillage(false);addEventListener('beforeunload',()=>save(true));
requestAnimationFrame(frame);
function startGame(){ac();mode='play';if(!hadSave){const g=NPCS.find(n=>n.id===(inHours(clock().hour,[20,6])?'hoo':'mike'));say(g,['ようこそ、どうぶつの村へ！','ここでは釣り・虫とり・宝さがし・花そだて・おしゃべりをして、のんびり暮らせるよ。','まずは左上の「目標」を見てね。Qキーで「今日のおねがい」が開くよ。']);}}
window.__game={S,P,NPCS,OBJ,bugs,get mode(){return mode},clock,setShift:(t,s)=>{timeShift=t;seasonShift=s},setWeather:w=>{weatherForce=w},get spots(){return spots},openBook:()=>{showBook()},enterRoom:()=>enterRoom(),applyVillage:()=>applyVillage(true),vLevel,get inRoom(){return inRoom},get PROPS(){return PROPS}};
</script>
