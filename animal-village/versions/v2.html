  ctx.fillStyle=S.seen[it.id]?'#fff':'#ead9b0';rr(x,y,248,88,14);ctx.fill();
  if(S.seen[it.id]){drawItemIcon(it.id,x+40,y+44,1.2);ctx.textAlign='left';ctx.fillStyle='#6b4a2b';ctx.font='bold 15px sans-serif';ctx.fillText(it.name,x+76,y+28);ctx.font='12px sans-serif';
   let ss=it.seasons?(it.seasons.length===4?'通年':it.seasons.map(s=>SEASONS[s]).join('・')):'通年';if(it.hours)ss+=(it.hours[0]===0&&it.hours[1]===24)?'　1日中':'　'+it.hours[0]+'〜'+it.hours[1]+'時';
   if(it.loc)ss+='　'+(it.loc==='sea'?'海':'池');
   ctx.fillText(ss,x+76,y+50);ctx.fillText(it.price+'ベル',x+76,y+70);}
  else{ctx.fillStyle='#b99a6a';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText('？',x+124,y+54);}});
 ctx.fillStyle='#8a6a3a';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('つぎのごほうび：'+(nextGoal()||'ぜんぶ達成！'),VW/2,VH-62);
 ctx.font='13px sans-serif';ctx.fillText('← →：タブ切替　Enter／Esc：とじる',VW/2,VH-42);
}
function updBook(){if(isPressed('arrowright','d'))book.tab=(book.tab+1)%4;if(isPressed('arrowleft','a'))book.tab=(book.tab+3)%4;if(isPressed('enter','escape','tab',' ')){book=null;mode='play';}}
/* ---------- loop ---------- */
let last=performance.now(),dayKey=0,saveT=0;
function frame(nt){const dt=Math.min(.05,(nt-last)/1000);last=nt;
 const c=clock();if(c.key!==dayKey){dayKey=c.key;respawnFruit();genSpots(c.key);}
 if(mode==='play')updPlay(dt);else if(mode==='fish'){updFish(dt);}else if(mode==='talk')updDialog();else if(mode==='menu')updMenu();else if(mode==='card')updCard();else if(mode==='book')updBook();
 NPCS.forEach(n=>updNPC(n,dt,c));updBugs(dt,c);OBJ.forEach(o=>{if(o.sh>0)o.sh-=dt;});
 music(dt,c.hour);saveT+=dt;if(saveT>12&&mode==='play'){save(true);saveT=0;}if(mode==='play'&&pend.length&&!P.lock)flushPend();
 render(dt);pressed={};requestAnimationFrame(frame);}
const hadSave=load();if(hadSave){P.x=S.px;P.y=S.py;}addEventListener('beforeunload',()=>save(true));
requestAnimationFrame(frame);
setTimeout(()=>{if(mode==='play'&&!hadSave)say(NPCS[0],['ようこそ、どうぶつの村へだにゃ！','ここでは釣りや虫とり、宝さがし、おしゃべりをしてのんびり暮らせるにゃ。','Enterで話したり釣ったり、Tabでメニューが開けるにゃ。まずは村を歩いてみるにゃ！']);},300);
window.__game={S,P,NPCS,OBJ,bugs,get mode(){return mode},clock,setShift:(t,s)=>{timeShift=t;seasonShift=s},setWeather:w=>{weatherForce=w},get spots(){return spots},openBook:()=>{showBook()}};
</script>
