<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ぽんたの ぼうさいむら</title>
<style>
:root{
  --sky:#bfe8ff; --grass:#b8e08a; --cream:#fff7e0; --brown:#8a5a3c; --pink:#ff9eb5;
  --ink:#4a3526; --leaf:#5fae4e; --sun:#ffd54a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f3ead2;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--ink);font-size:20px}
#stage{position:relative;width:100%;max-width:960px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--sky)}
#app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.layer{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:12px 14px 16px;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{min-height:56px;min-width:56px;padding:10px 22px;border-radius:30px;background:var(--sun);color:var(--ink);font-weight:bold;font-size:22px;box-shadow:0 5px 0 #c9a227;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9a227}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #d06a86}
.btn.pink:active{box-shadow:0 1px 0 #d06a86}
.btn.gray{background:#e6dcc4;box-shadow:0 5px 0 #b9ab88}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{background:rgba(255,255,255,.88);border-radius:24px;padding:8px 16px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#mute{position:absolute;right:10px;top:10px;z-index:50;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.panel{background:rgba(255,250,235,.95);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:96px;min-height:56px;border-radius:20px 20px 0 0;background:#f2e6c0;font-weight:bold;font-size:20px;padding:8px}
.tab.on{background:#fffaeb;box-shadow:0 -4px 0 var(--leaf) inset}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;background:#fffaeb;border-radius:0 0 22px 22px;padding:12px}
.card{background:#fff;border-radius:18px;padding:8px 6px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #e2d4ad;font-weight:bold;font-size:18px}
.card svg{width:56px;height:56px}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #e2d4ad}
.card.pop{animation:pop .35s}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1/1;min-height:52px;border-radius:14px;background:rgba(255,255,255,.7);border:3px dashed #cdbb8c;display:flex;align-items:center;justify-content:center;padding:2px}
.slot svg{width:100%;height:100%}
.slot.full{background:#fff;border:3px solid var(--leaf);animation:pop .35s}
.slot.today{border-color:var(--pink)}
.slot.used{outline:4px solid var(--sun);animation:pulse .6s 2}
.talk{display:flex;gap:10px;align-items:flex-end}
.talk .who{width:110px;flex:none}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-size:20px;line-height:1.55;box-shadow:0 4px 0 rgba(0,0,0,.1);flex:1}
.bubble:before{content:"";position:absolute;left:-12px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble b{color:#c2185b}
.name{font-size:15px;color:#7a6a55;font-weight:bold}
.title-card{text-align:center;margin-top:8vh}
.title-card h1{font-size:40px;line-height:1.25;margin:0;color:#fff;text-shadow:0 4px 0 #d06a86,0 0 10px #d06a86;-webkit-text-stroke:2px #d06a86;paint-order:stroke fill}
.chap{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chap span{background:rgba(255,255,255,.85);border-radius:18px;padding:8px 14px;font-weight:bold;font-size:17px}
.chap span.lock{opacity:.6}
.stars{font-size:38px;letter-spacing:4px;color:#f5a800;text-shadow:0 2px 0 #b57b00}
.stars .off{color:#d8ccb0;text-shadow:none}
.res{background:#fff;border-radius:16px;padding:8px 12px;margin:6px 0;font-size:18px;line-height:1.5}
.res.ok{border-left:8px solid #4caf50}
.res.half{border-left:8px solid #ffb300}
.res.ng{border-left:8px solid #ef6c6c}
.grow{animation:bob 2.6s ease-in-out infinite}
.bobber{animation:bob 2.6s ease-in-out infinite}
.wob{animation:wob 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes wob{50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,6px)}}
.shaking{animation:shake .18s linear 10}
/* ジョジョ風の演出 */
#jojo{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden}
#jojo .rays{position:absolute;inset:-50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#jojo.quake .rays{background:repeating-conic-gradient(#3b0a58 0 9deg,#c2185b 9deg 18deg)}
#jojo.win .rays{background:repeating-conic-gradient(#ffd54a 0 9deg,#ff7aa8 9deg 18deg)}
#jojo .go{position:absolute;font-weight:900;font-size:46px;line-height:1;color:#fff;-webkit-text-stroke:3px #1a0630;paint-order:stroke fill;text-shadow:5px 5px 0 #1a0630;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;animation:shake .13s linear infinite}
#jojo.win .go{color:#fff8c0;-webkit-text-stroke:3px #7a1a4a;text-shadow:5px 5px 0 #7a1a4a}
#jojo .hero{position:relative;width:min(58vw,300px);transform:rotate(-9deg);animation:heroin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes heroin{0%{transform:rotate(-9deg) scale(.2)}100%{transform:rotate(-9deg) scale(1)}}
#jojo .say{position:absolute;bottom:9%;left:50%;transform:translateX(-50%) rotate(-3deg);background:#fff;color:#1a0630;border:5px solid #1a0630;border-radius:8px;padding:10px 22px;font-weight:900;font-size:34px;white-space:nowrap;box-shadow:7px 7px 0 #1a0630}
#jojo .tapmsg{position:absolute;top:10px;width:100%;text-align:center;color:#fff;font-weight:bold;font-size:16px;text-shadow:0 2px 0 #000}
@media (max-width:520px){
  body{font-size:18px}
  .title-card h1{font-size:32px}
  #jojo .go{font-size:36px}
  #jojo .say{font-size:26px}
  .talk .who{width:84px}
  .btn{font-size:20px}
}
</style>
</head>

try{ S.best = parseInt(localStorage.getItem("ponta_best")||"0",10)||0; }catch(e){}

/* ============ おと (外部ファイルを使わない) ============ */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,type,vol,when,slideTo){
  if(S.muted) return; var a=ac(); if(!a) return;
  try{
    var t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}

/* ============ え (SVG) ============ */
function eyes(x1,x2,y,mood){
  var s="";
  [x1,x2].forEach(function(x,i){
    if(mood==="happy"){ s+='<path d="M'+(x-6)+' '+(y+2)+' Q'+x+' '+(y-8)+' '+(x+6)+' '+(y+2)+'" stroke="#2a1a10" stroke-width="3" fill="none" stroke-linecap="round"/>'; }
    else if(mood==="shock"){ s+='<circle cx="'+x+'" cy="'+y+'" r="7" fill="#fff" stroke="#2a1a10" stroke-width="2"/><circle cx="'+x+'" cy="'+y+'" r="2.6" fill="#2a1a10"/>'; }
    else if(mood==="sad"){ s+='<circle cx="'+x+'" cy="'+y+'" r="4.2" fill="#2a1a10"/><circle cx="'+(x+1.4)+'" cy="'+(y-1.4)+'" r="1.4" fill="#fff"/><path d="M'+(x-7)+' '+(y-8+(i?-3:3))+' L'+(x+7)+' '+(y-8+(i?3:-3))+'" stroke="#2a1a10" stroke-width="2.4" stroke-linecap="round"/>'; }
    else { s+='<circle cx="'+x+'" cy="'+y+'" r="4.2" fill="#2a1a10"/><circle cx="'+(x+1.4)+'" cy="'+(y-1.4)+'" r="1.4" fill="#fff"/>'; }
  });
  if(mood==="sad"){ s+='<path d="M'+(x1-3)+' '+(y+8)+' q-2 6 0 8 q3 -2 0 -8z" fill="#7cc8ff"/>'; }
  return s;
}
function mouth(cx,y,mood){
  if(mood==="happy") return '<path d="M'+(cx-9)+' '+y+' Q'+cx+' '+(y+16)+' '+(cx+9)+' '+y+' Z" fill="#7a2a20" stroke="#2a1a10" stroke-width="2" stroke-linejoin="round"/>';
  if(mood==="shock") return '<ellipse cx="'+cx+'" cy="'+(y+5)+'" rx="5" ry="6.5" fill="#7a2a20" stroke="#2a1a10" stroke-width="2"/>';
  if(mood==="sad")   return '<path d="M'+(cx-7)+' '+(y+7)+' Q'+cx+' '+(y-2)+' '+(cx+7)+' '+(y+7)+'" stroke="#2a1a10" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  return '<path d="M'+(cx-6)+' '+y+' Q'+cx+' '+(y+7)+' '+(cx+6)+' '+y+'" stroke="#2a1a10" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
}
/* kind: ponta / rabbit / squirrel / bear ; lvl: ぽんたの そだち (0〜2) */
function chara(kind,mood,lvl){

  if(kind==="ponta"){
    if(lvl>=2) s+='<path d="M34 72 Q8 100 14 126 L60 112 L106 126 Q112 100 86 72 Z" fill="#e53935"/>';

    s+='<ellipse cx="60" cy="96" rx="34" ry="30" fill="#c98b5a"/><ellipse cx="60" cy="102" rx="21" ry="19" fill="#ffe8c8"/>';
    s+='<circle cx="32" cy="24" r="12" fill="#c98b5a"/><circle cx="32" cy="24" r="6" fill="#8a5a3c"/><circle cx="88" cy="24" r="12" fill="#c98b5a"/><circle cx="88" cy="24" r="6" fill="#8a5a3c"/>';
    s+='<circle cx="60" cy="54" r="35" fill="#c98b5a"/><ellipse cx="45" cy="52" rx="10" ry="9" fill="#6b4630"/><ellipse cx="75" cy="52" rx="10" ry="9" fill="#6b4630"/><ellipse cx="60" cy="68" rx="17" ry="12" fill="#ffe8c8"/>';
    s+=eyes(45,75,52,mood)+'<ellipse cx="60" cy="63" rx="5.5" ry="4" fill="#3a2214"/>'+mouth(60,68,mood);
    s+='<circle cx="34" cy="66" r="5" fill="#ff9eb5" opacity=".7"/><circle cx="86" cy="66" r="5" fill="#ff9eb5" opacity=".7"/>';
    if(lvl>=1) s+='<path d="M36 82 L84 82 L60 104 Z" fill="#ef5350"/><circle cx="60" cy="90" r="3" fill="#fff"/>';
    if(lvl>=2) s+='<path d="M30 16 L60 4 L90 16 L60 24 Z" fill="#ffd54a" stroke="#c9a227" stroke-width="2"/>';
  } else if(kind==="rabbit"){
    s+='<ellipse cx="44" cy="20" rx="9" ry="26" fill="#fff"/><ellipse cx="44" cy="22" rx="4.5" ry="19" fill="#ffb3c6"/><ellipse cx="78" cy="20" rx="9" ry="26" fill="#fff" transform="rotate(8 78 20)"/><ellipse cx="78" cy="22" rx="4.5" ry="19" fill="#ffb3c6" transform="rotate(8 78 22)"/>';
    s+='<ellipse cx="60" cy="102" rx="32" ry="26" fill="#fff"/><path d="M34 92 Q60 118 86 92 L82 84 Q60 98 38 84 Z" fill="#b39ddb"/>';
    s+='<circle cx="60" cy="62" r="33" fill="#fff" stroke="#eadfe6" stroke-width="2"/><circle cx="36" cy="72" r="6" fill="#ffb3c6" opacity=".8"/><circle cx="84" cy="72" r="6" fill="#ffb3c6" opacity=".8"/>';
    s+=eyes(46,74,60,mood)+'<ellipse cx="60" cy="70" rx="4" ry="3" fill="#e57399"/>'+mouth(60,74,mood);

function $(sel,root){ return (root||document).querySelector(sel); }

function count(cat){ var n=0; S.bag.forEach(function(k){ if(ITEMS[k].cat===cat) n++; }); return n; }

function starRow(n,max){ var h='<span class="stars">'; for(var i=1;i<=max;i++){ h+= n>=i?'★':(n>=i-0.5?'<span style="opacity:.6">★</span>':'<span class="off">★</span>'); } return h+'</span>'; }

/* ============ ジョジョ風の演出 ============ */
function jojo(kind,who,mood,say,after){
  var old=$("#jojo"); if(old) old.remove();
  var d=document.createElement("div"); d.id="jojo"; d.className=kind;
  var gos="", txt = kind==="quake"?"ゴ":"ド", n = kind==="quake"?16:12;
  for(var i=0;i<n;i++){
    var x=Math.round(Math.random()*90), y=Math.round(Math.random()*88), sz=32+Math.round(Math.random()*28), rot=Math.round(Math.random()*40-20);
    gos+='<span class="go" style="left:'+x+'%;top:'+y+'%;font-size:'+sz+'px;transform:rotate('+rot+'deg)">'+txt+'</span>';
  }
  d.innerHTML='<div class="rays"></div>'+gos+'<div class="hero">'+chara(who,mood,0)+'</div><div class="say">'+esc(say)+'</div><div class="tapmsg">タップで つぎへ</div>';
  document.body.appendChild(d);
  var done=false;
  function close(){ if(done) return; done=true; d.remove(); if(after) after(); }
  d.addEventListener("click",close);
  setTimeout(close, kind==="quake"?2300:1900);
  if(kind==="quake"){ SND.rumble(); var st=$("#stage"); st.classList.add("shaking"); setTimeout(function(){ st.classList.remove("shaking"); },1900); }
  else SND.win();
}

/* ============ そうさ ============ */
function start(){
  S.day=1; S.bag=[]; S.today=[]; S.spot="shop"; S.said=null; S.results=[]; S.sceneIdx=0; S.fillerN=0;
  go("collect");
}
function take(k){
  if(S.today.length>=PER_DAY || S.bag.length>=BAG_MAX) return;
  S.bag.push(k); S.today.push(k); SND.pop();
  var it=ITEMS[k];
  S.said={who:it.who, text:it.tip};
  render();
  var s=$('.slot.full:nth-child('+S.bag.length+')'); if(s) s.classList.add("full");
}
function undo(i){
  var from = S.bag.length - S.today.length;
  if(i<from || i>=S.bag.length) return;
  S.bag.splice(i,1); S.today.pop(); SND.undo(); S.said=null; render();
}
function nextDay(){
  if(S.today.length<PER_DAY && S.bag.length<BAG_MAX) return;
  if(S.day<3){ S.day++; S.today=[]; S.said={who:["fuku","don","kuma"][S.day%3], text:FILLER[["fuku","don","kuma"][S.day%3]][S.day%3]+" "+S.day+"にちめの あさが きたよ。"}; SND.day(); S.spot="shop"; go("collect"); }
  else { S.sceneIdx=0; S.results=[]; night(); }
}
function night(){
  S.screen="scene"; render();
  jojo("quake","ponta","shock","ゴゴゴゴゴ… じしんだ！",function(){ render(); });
}
function choose(i){
  var sc=SCENES[S.sceneIdx], c=sc.choices[i], ok=c.ok;
  S.results[S.sceneIdx]={score:ok?1:0, text: ok?sc.good:sc.bad, hint: ok?null:"ゆれている ときは、あたまを まもって つくえの したで じっと しよう。"};
  render();
  if(ok) jojo("win",sc.who==="don"?"squirrel":"ponta","happy",sc.win); else SND.sad();
}
function check(){
  var sc=SCENES[S.sceneIdx], n=count(sc.cat), score, text;
  if(n>=sc.need){ score=1; text=sc.okText; }
  else if(n>0 && sc.halfText){ score=0.5; text=sc.halfText; }
  else if(n>0){ score=1; text=sc.okText; }
  else { score=0; text=sc.ngText; }
  var hint = score<1 ? ({light:"かいちゅうでんとうを もっていこう。",water:"みずは ひとり 1にち 3リットル。3にちぶん もっていこう。",food:"ながく もつ たべものを 2こ いじょう もっていこう。",toilet:"けいたいトイレを もっていこう。",firstaid:"きゅうきゅうセットを もっていこう。",warm:"アルミブランケットを もっていこう。",radio:"ラジオで じょうほうを あつめよう。"})[sc.id] : null;
  S.results[S.sceneIdx]={score:score, text:text, hint:hint};
  render();
  if(score>=1) jojo("win",WHO[sc.who].kind==="squirrel"?"squirrel":WHO[sc.who].kind,"happy",sc.win); else SND.sad();
}
function nextScene(){
  if(S.sceneIdx<SCENES.length-1){ S.sceneIdx++; render(); var a=$("#app"); if(a) a.scrollTop=0; }
  else{
    var t=totalStars(); if(t>S.best){ S.best=t; try{ localStorage.setItem("ponta_best",String(Math.floor(t))); }catch(e){} }
    go("result");
  }
}

/* ============ イベント ============ */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  ac(); if(AC&&AC.state==="suspended"){ try{AC.resume();}catch(x){} }
  var act=el.getAttribute("data-act"), k=el.getAttribute("data-k"), i=parseInt(el.getAttribute("data-i"),10);
  if(act==="start"||act==="again"){ SND.tap(); start(); }
  else if(act==="home"){ SND.tap(); go("title"); }
  else if(act==="spot"){ SND.tap(); S.spot=k; render(); }
  else if(act==="take") take(k);
  else if(act==="undo") undo(i);
  else if(act==="nextday") nextDay();
  else if(act==="choose"){ if(!S.results[S.sceneIdx]) choose(i); }
  else if(act==="check"){ if(!S.results[S.sceneIdx]) check(); }
  else if(act==="nextscene"){ SND.tap(); nextScene(); }
});
$("#mute").addEventListener("click",function(){ S.muted=!S.muted; setMuteIcon(); if(!S.muted){ ac(); SND.tap(); } });
setMuteIcon(); render();
</script>
