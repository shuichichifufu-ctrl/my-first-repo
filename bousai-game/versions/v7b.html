<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ぽんたの ぼうさいむら</title>
<style>
:root{
  --sky:#bfe8ff; --grass:#b8e08a; --cream:#fff7e0; --brown:#8a5a3c; --pink:#ff9eb5;
  --ink:#4a3526; --leaf:#5fae4e; --sun:#ffd54a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f3ead2;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--ink);font-size:20px}
#stage{position:relative;width:100%;max-width:960px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--sky)}
#app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.layer{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:12px 14px 16px;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{min-height:56px;min-width:56px;padding:10px 22px;border-radius:30px;background:var(--sun);color:var(--ink);font-weight:bold;font-size:22px;box-shadow:0 5px 0 #c9a227;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9a227}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #d06a86}
.btn.pink:active{box-shadow:0 1px 0 #d06a86}
.btn.gray{background:#e6dcc4;box-shadow:0 5px 0 #b9ab88}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{background:rgba(255,255,255,.88);border-radius:24px;padding:8px 16px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#mute{position:absolute;right:10px;top:10px;z-index:150;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.panel{background:rgba(255,250,235,.95);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:96px;min-height:56px;border-radius:20px 20px 0 0;background:#f2e6c0;font-weight:bold;font-size:20px;padding:8px}
.tab.on{background:#fffaeb;box-shadow:0 -4px 0 var(--leaf) inset}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;background:#fffaeb;border-radius:0 0 22px 22px;padding:12px}
.card{background:#fff;border-radius:18px;padding:8px 6px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #e2d4ad;font-weight:bold;font-size:18px}
.card svg{width:56px;height:56px}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #e2d4ad}
.card.pop{animation:pop .35s}
.card{word-break:keep-all;text-align:center;line-height:1.2}
.slot.newin{animation:pop .45s}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1/1;min-height:52px;border-radius:14px;background:rgba(255,255,255,.7);border:3px dashed #cdbb8c;display:flex;align-items:center;justify-content:center;padding:2px}
.slot svg{width:100%;height:100%}
.slot.full{background:#fff;border:3px solid var(--leaf)}
.slot.today{border-color:var(--pink)}
.slot.used{outline:4px solid var(--sun);animation:pulse .6s 2}
.talk{display:flex;gap:10px;align-items:flex-end}
.talk .who{width:110px;flex:none}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-size:20px;line-height:1.55;box-shadow:0 4px 0 rgba(0,0,0,.1);flex:1}
.bubble:before{content:"";position:absolute;left:-12px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble b{color:#c2185b}
.bubble .line{display:block;margin-top:6px;color:#6a4a8a}
.note{display:flex;gap:8px;align-items:center}
.note .pon{width:64px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:flex;align-items:center;gap:4px;background:#fff;border:3px solid #e2d4ad;border-radius:16px;padding:2px 8px 2px 4px;font-size:16px;font-weight:bold;min-height:36px;opacity:.55}
.chip svg{width:26px;height:26px}
.chip.ok{opacity:1;border-color:#4caf50;background:#eaf8e6}
.chip.some{opacity:1;border-color:#ffb300;background:#fff6dc}
.dots{letter-spacing:1px;font-size:13px}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px}
.talk .who{cursor:pointer}
.flyer{position:fixed;z-index:60;pointer-events:none;width:56px;height:56px}
.name{font-size:15px;color:#7a6a55;font-weight:bold}
.title-card{text-align:center;margin-top:8vh}
.title-card h1{font-size:40px;line-height:1.25;margin:0;color:#fff;text-shadow:0 4px 0 #d06a86,0 0 10px #d06a86;-webkit-text-stroke:2px #d06a86;paint-order:stroke fill}
.chap{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chap span{background:rgba(255,255,255,.85);border-radius:18px;padding:8px 14px;font-weight:bold;font-size:17px}
.chap span.lock{opacity:.6}
.stars{font-size:38px;letter-spacing:4px;color:#f5a800;text-shadow:0 2px 0 #b57b00}
.stars .off{color:#d8ccb0;text-shadow:none}
.res{background:#fff;border-radius:16px;padding:8px 12px;margin:6px 0;font-size:18px;line-height:1.5}
.res.ok{border-left:8px solid #4caf50}
.res.half{border-left:8px solid #ffb300}
.res.ng{border-left:8px solid #ef6c6c}
.grow{animation:bob 2.6s ease-in-out infinite}
.bobber{animation:bob 2.6s ease-in-out infinite}
.wob{animation:wob 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes wob{50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,6px)}}
.shaking{animation:shake .18s linear 10}
/* ジョジョ風の演出 */
#jojo{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden}
#jojo .rays{position:absolute;inset:-50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#jojo.quake .rays{background:repeating-conic-gradient(#3b0a58 0 9deg,#c2185b 9deg 18deg)}
#jojo.win .rays{background:repeating-conic-gradient(var(--c1,#ffd54a) 0 9deg,var(--c2,#ff7aa8) 9deg 18deg)}
#jojo .spot{position:absolute;width:min(90vw,520px);height:min(90vw,520px);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.6) 35%,rgba(255,255,255,0) 70%)}
#jojo .sub{position:absolute;top:14%;left:50%;transform:translateX(-50%) rotate(4deg);font-weight:900;font-size:40px;color:#fff;-webkit-text-stroke:2px #1a0630;paint-order:stroke fill;text-shadow:4px 4px 0 #1a0630;letter-spacing:4px;white-space:nowrap}
#jojo .go{position:absolute;font-weight:900;font-size:46px;line-height:1;color:#fff;-webkit-text-stroke:3px #1a0630;paint-order:stroke fill;text-shadow:5px 5px 0 #1a0630;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;animation:shake .13s linear infinite}
#jojo.win .go{color:#fff8c0;-webkit-text-stroke:3px #7a1a4a;text-shadow:5px 5px 0 #7a1a4a}
#jojo .hero{position:relative;width:min(62vw,340px);transform:rotate(-9deg);animation:heroin .5s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(8px 8px 0 #1a0630)}
@keyframes heroin{0%{transform:rotate(-9deg) scale(.2)}100%{transform:rotate(-9deg) scale(1)}}
#jojo .hero.flip{transform:rotate(9deg) scaleX(-1);animation:heroin2 .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes heroin2{0%{transform:rotate(9deg) scaleX(-1) scale(.2)}100%{transform:rotate(9deg) scaleX(-1) scale(1)}}
#jojo .say{position:absolute;bottom:9%;left:50%;transform:translateX(-50%) rotate(-3deg);background:#fff;color:#1a0630;border:5px solid #1a0630;border-radius:8px;padding:10px 22px;font-weight:900;font-size:34px;white-space:normal;max-width:92vw;text-align:center;box-shadow:7px 7px 0 #1a0630}
#jojo .tapmsg{position:absolute;bottom:10px;width:100%;text-align:center;color:#fff;font-weight:bold;font-size:20px;text-shadow:0 2px 0 #000}
#mini{position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;background:#fff;border:4px solid #1a0630;border-radius:22px;padding:6px 18px 6px 10px;box-shadow:6px 6px 0 #1a0630;pointer-events:none;animation:pop .4s}
#mini svg{width:78px;height:78px}
#mini span{font-weight:900;font-size:32px;color:#c2185b;white-space:nowrap}
@media (max-width:520px){
  body{font-size:18px}
  .title-card h1{font-size:32px}
  #jojo .go{font-size:36px}
  #jojo .say{font-size:26px}
  .talk .who{width:84px}
  .btn{font-size:20px}
}

/* ===== v4: むら・おみせ・ミニゲーム ===== */
.layer.fill{height:100%;overflow:hidden}
.worldwrap{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.14);background:linear-gradient(#bfe8ff 0,#eaf8ff 42%,#b8e08a 42%,#b8e08a 100%)}
.pill:empty{display:none}
.world{position:absolute;left:50%;top:50%;width:480px;height:520px;transform:translate(-50%,-50%);touch-action:manipulation}
.wbg{position:absolute;inset:0;width:480px;height:520px;overflow:visible}
.npc{position:absolute;width:64px;height:70px;transform:translate(-50%,-100%);background:none;padding:0;transition:left 1.6s ease-in-out,top 1.6s ease-in-out;z-index:5}
.npc .nm{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fff;border-radius:10px;padding:0 7px;font-size:16px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.deco{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:1}
.deco svg{width:54px;height:54px;display:block}
.wbubble{position:absolute;left:8px;right:8px;top:6px;z-index:6;display:flex;gap:8px;align-items:flex-end;pointer-events:none}
.wbubble .face{width:62px;height:62px;flex:none;background:none;padding:0;pointer-events:auto}
.wbubble .bubble{min-height:0;padding:6px 12px;font-size:17px;line-height:1.4}
.wbubble .name{font-size:14px;line-height:1.2}
.bld{position:absolute;width:130px;background:none;padding:0;text-align:center}
.bld svg{position:relative;z-index:2}
.bld svg{width:130px;height:110px;display:block}
.bld span{position:relative;z-index:600;white-space:nowrap;display:inline-block;margin-left:-40px;margin-right:-40px;background:#fff;border-radius:14px;padding:2px 10px;font-weight:bold;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.18);margin-top:2px}
.ponta{position:absolute;width:64px;height:70px;transform:translate(-50%,-100%);z-index:3;pointer-events:none}
.ponta>div{width:100%;height:100%}
.ponta.walking>div{animation:hop .28s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-9px)}}
.acorn{position:absolute;width:64px;height:64px;padding:8px;box-sizing:border-box;transform:translate(-50%,-100%);background:none;padding:0;z-index:2;animation:spark 1.6s ease-in-out infinite}
.acorn.big{width:76px;height:76px}
@keyframes spark{50%{transform:translate(-50%,-100%) scale(1.14)}}
.fl{position:absolute;z-index:8;font-weight:900;font-size:28px;color:#c2185b;-webkit-text-stroke:2px #fff;paint-order:stroke fill;pointer-events:none;animation:floatup .9s forwards}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-50px);opacity:0}}
.bar{display:flex;gap:10px;align-items:center;background:rgba(255,250,235,.96);border-radius:20px;padding:8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bagmini{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.bagmini .slot{min-height:44px}
.bar .btn{flex:none;padding:8px 16px;font-size:19px;line-height:1.2}
.coin{display:inline-flex;align-items:center;gap:6px}
.coin svg{width:26px;height:26px}
.sheet{position:absolute;inset:0;z-index:40;background:rgba(40,25,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet.center{align-items:center}
.sheetbox{width:100%;max-width:960px;max-height:96%;overflow:hidden;display:flex;flex-direction:column;background:#fffaeb;border-radius:26px 26px 0 0;padding:12px 14px 14px}
.sheetbox>.topbar{padding-right:58px}
.sheetlist{overflow-y:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px}
.sheet.center .sheetbox{overflow-y:auto;display:block}
.sheet.center .sheetbox{width:calc(100% - 28px);border-radius:26px;max-width:520px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:6px 10px;margin:8px 0;min-height:76px;box-shadow:0 3px 0 #e2d4ad}
.row .ic{width:56px;height:56px;flex:none}
.row .nm{flex:1;font-weight:bold;font-size:19px;line-height:1.25;word-break:keep-all}
.row .nm small{display:block;font-weight:normal;font-size:16px;color:#7a6a55}
.row .btn{min-height:56px;padding:6px 14px;font-size:19px}
.price{display:inline-flex;align-items:center;gap:3px}
.price svg{width:20px;height:20px}
.ico{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.sheetbag{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.sheetbag .slot{min-height:44px}
.slot.newin{animation:pop .45s}
/* ミニゲーム */
.game{position:relative;padding:10px;min-height:300px}
.picks{display:flex;gap:10px;margin-top:8px}
.pickbtn{flex:1;min-height:150px;background:#fff;border-radius:18px;box-shadow:0 4px 0 #e2d4ad;font-weight:bold;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pickbtn svg{width:80px;height:80px}
.pickbtn:active{transform:translateY(3px)}
.q{font-weight:bold;text-align:center;font-size:21px;margin:2px 0 6px}
.meter{height:20px;background:#eadfc4;border-radius:10px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;width:0;background:var(--leaf);transition:width .05s linear}
.holdbtn{word-break:keep-all;width:100%;min-height:92px;border-radius:26px;background:var(--pink);font-weight:900;font-size:26px;box-shadow:0 6px 0 #d06a86;touch-action:none;user-select:none;-webkit-user-select:none}
.holdbtn.on{transform:translateY(5px);box-shadow:0 1px 0 #d06a86;background:#ff7aa8}
.tablebox{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.tablebox svg{height:150px}
.dark{position:relative;height:320px;background:#1b1530;border-radius:16px;overflow:hidden;touch-action:none}
.dark .furn{position:absolute;inset:0}
.dark .furn svg{width:100%;height:100%}
.dark .mask{position:absolute;inset:0;pointer-events:none}
.dark .fr{position:absolute;width:64px;height:70px;transform:translate(-50%,-50%);background:none;padding:0;opacity:0;pointer-events:none}
.dark .fr.lit,.dark .fr.found{opacity:1}
.dark .fr.found{animation:pop .4s}
.dcap{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff;font-weight:bold;font-size:17px;text-shadow:0 2px 0 #000;pointer-events:none}
.dragarea{position:relative;height:300px;touch-action:none;background:linear-gradient(#ffeeda,#ffe0c2);border-radius:16px;overflow:hidden}
.dtarget{position:absolute;transform:translate(-50%,-50%);width:150px;height:170px}
.dtarget svg{width:100%;height:100%}
.dring{position:absolute;border:5px dashed #e53935;border-radius:50%;width:66px;height:66px;transform:translate(-50%,-50%);animation:pulse 1s infinite}
.ditem{position:absolute;width:84px;height:84px;transform:translate(-50%,-50%);z-index:5;touch-action:none;cursor:grab;background:none;padding:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.dhint{position:absolute;left:8px;right:8px;bottom:6px;text-align:center;font-weight:bold;font-size:17px;color:#7a4a2a}
.radio{padding:6px}
.rdis{background:#263238;color:#9fe870;border-radius:14px;padding:16px;text-align:center;font-family:monospace;font-weight:bold;font-size:24px;min-height:70px;display:flex;align-items:center;justify-content:center}
.radio input[type=range]{width:100%;height:16px;margin:26px 0;-webkit-appearance:none;appearance:none;background:#d8ccb0;border-radius:10px}
.radio input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;background:#ff9eb5;border:5px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.radio input[type=range]::-moz-range-thumb{width:44px;height:44px;border-radius:50%;background:#ff9eb5;border:5px solid #fff}
.cups{display:flex;gap:10px;justify-content:center;margin:6px 0 8px}
.cup{position:relative;width:62px;height:112px;border:4px solid #3b7dd8;border-top:0;border-radius:0 0 18px 18px;background:#fff;overflow:hidden}
.cup.now{box-shadow:0 0 0 4px var(--sun)}
.cfill{position:absolute;left:0;right:0;bottom:0;height:0;background:#5aaef0}
.band{position:absolute;left:0;right:0;bottom:65%;height:25%;background:rgba(76,175,80,.3);border-top:3px dashed #2e7d32;border-bottom:3px dashed #2e7d32}
.cup .tag{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:30px}
.stock{text-align:center;font-weight:bold;margin:2px 0}
.friends{display:flex;gap:6px;justify-content:center}
.friends>div{flex:1;text-align:center;font-size:15px;font-weight:bold}
.friends svg{width:100%;max-width:84px}
.tray{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.foodbtn{min-width:104px;min-height:104px;background:#fff;border-radius:18px;box-shadow:0 4px 0 #e2d4ad;font-weight:bold;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.foodbtn svg,.foodbtn img{width:56px;height:56px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.stepbtn{min-height:92px;background:#fff;border-radius:18px;box-shadow:0 4px 0 #e2d4ad;font-weight:bold;font-size:19px;padding:8px;line-height:1.35}
.stepbtn.done{background:#dff3d8;box-shadow:0 4px 0 #9ccc8b}
.stepbtn.ng{animation:shake .2s linear 2}
.hugbtn{display:block;margin:6px auto;width:170px;height:170px;background:none;padding:0;touch-action:manipulation}
.hugbtn svg,.hugbtn img{width:100%;height:100%}
.hugbtn:active{transform:scale(.92)}
.hearts{text-align:center;font-size:32px;min-height:40px;color:#e53935}
.noitem{text-align:center;padding:10px}
.noitem .pon{width:110px;margin:0 auto}
.shaky{animation:shake .18s linear infinite}
#mini{left:0;right:0;top:36%;margin:0 auto;width:fit-content;transform:none}
@keyframes pop2{0%{opacity:0;scale:.6}60%{scale:1.1}100%{opacity:1;scale:1}}
#mini{animation:pop2 .4s}
#jojo.gentle .rays,#jojo.gentle .go{animation:none}
@media (prefers-reduced-motion:reduce){#jojo .rays,#jojo .go,.shaking,.shaky,.bobber,.wob,.acorn{animation:none!important}}
.small{font-size:16px;color:#7a6a55}
.bubble.sb{min-height:104px}
@media (max-width:520px){.bubble.sb{min-height:138px}}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.badge{background:#fff;border-radius:18px;padding:6px 14px;font-weight:bold;font-size:18px;box-shadow:0 3px 0 #e2d4ad}
.chipok,.chipng{display:inline-block;border-radius:14px;padding:3px 10px;margin:3px 4px 3px 0;font-weight:bold;font-size:17px}
.chipok{background:#dff3d8;border:2px solid #4caf50}.chipng{background:#fff0d0;border:2px solid #ffb300}
details.all{margin-top:8px}details.all summary{min-height:44px;font-weight:bold;cursor:pointer;display:flex;align-items:center}
@media (min-width:700px){
  .bagmini{grid-template-columns:repeat(14,1fr)}
  .sheetbag{grid-template-columns:repeat(14,1fr)}
}
@media (max-width:520px){
  .wbubble .line{display:none}
  .bar{flex-direction:column;align-items:stretch}
  .bar .btn{width:100%}
  .row .nm{font-size:18px}
  .pickbtn{font-size:19px}
}
</style>
</head>
<body>
<div id="stage"><div id="app"></div><button id="mute" aria-label="おと">🔊</button></div>
<script>
"use strict";
/* ============ おと (外部ファイルを使わない) ============ */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }

  var unseenH = unseen.length ? '<div class="panel" style="margin-top:8px"><b>きょうは おきなかった こと</b>：'+unseen.join('、')+'<br>でも ほんとうは、なにが いつ おきるか わからないよ。ぜんぶ たいせつな そなえだよ。</div>' : '';
  var note = '<div class="panel" style="margin-top:8px"><b>おぼえておこう</b><br>おうちの そなえは、3にちぶんが さいてい。できれば 1しゅうかんぶん。<br>にげる ときの もちだしぶくろは、かるい 1にちぶんで、おうちの そなえとは べつだよ。<br><span class="small">ゲームの りょうは かんたんに した きまり。ほんとうの りょうは、おうちの ひとと たしかめてね。</span></div>';
  var other = '<div class="panel" style="margin-top:8px"><b>ゲームに ない そなえも あるよ</b><br>でんち・モバイルバッテリー／げんきん（10えんだま）／くすり・マスク／たなの こてい／くつ／かぞくとの れんらく・ひなんじょの かくにん／ふだん たべる ものを すこし おおく かって、たべたら かいたす（ローリングストック）</div>';
  var talkCard = '<div class="panel" style="margin-top:8px;background:#fff0f4"><b>おうちの ひとと はなそう</b><br>おうちに いちばん ほしい そなえは なにかな？ ひとつ えらんで、はなしてみよう。</div>';
  return bgVillage("day")+'<div class="layer">'+
    '<div style="text-align:center;margin-top:6px"><div class="bobber" style="width:150px;margin:0 auto">'+chara("ponta","happy",lv)+'</div>'+
    '<div class="pill" style="display:inline-block;margin:6px 0">'+title+' の ぽんた</div><br>'+starRow(t,max)+'</div>'+
    '<div class="bubble" style="margin-left:12px">'+comment+'</div>'+badges+good+more+unseenH+note+other+talkCard+
    '<details class="all panel"><summary>ぜんぶの けっかを みる</summary><div class="resgrid">'+rows+'</div></details>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button class="btn pink" data-act="replay">おなじ そなえで もういちど</button><button class="btn" data-act="again">はじめから</button><button class="btn gray" data-act="home">さいしょへ</button></div>'+
    '<div style="text-align:center;font-size:16px;color:#5b4a38;font-weight:bold;margin-top:6px">つぎは たいふう・おおあめ の ひも つくる よてい だよ</div></div>';
}

/* ============ イベント ============ */
function talk(w){
  var missing=NEED.filter(function(x){ return count(x.cat)<NEEDN[x.cat]; });
  var who=w||["fuku","don","kuma"][Math.floor(Math.random()*3)]; SND.tap();
  if(missing.length && (!w || Math.random()<.65)){ var x=missing[Math.floor(Math.random()*missing.length)]; S.said={who:who,text:HINTQ[x.cat][who],line:""}; }
  else if(missing.length) S.said={who:who,text:voice(who),line:""};
  else S.said={who:who,text:"もう ぜんぶ そろっているね！ すごいわ。のこりの どんぐりは とっておこうね。",line:voice(who)};
  if(S.sheet) renderSheet(); else render();
}
document.addEventListener("click",function(e){
  if(e.target.id==="sheet"){ SND.tap(); closeSheet(); S.said=null; render(); return; }
  var el=e.target.closest("[data-act]");
  if(!el){ if(S.screen==="map" && !S.sheet && e.target.closest("#ww") && !document.getElementById("modal")) groundTap(e); return; }
  if(el.disabled) return;
  ac(); if(AC&&AC.state==="suspended"){ try{AC.resume();}catch(x){} }
  var act=el.getAttribute("data-act"), k=el.getAttribute("data-k"), i=parseInt(el.getAttribute("data-i"),10);
  if(act==="start"||act==="again"){ SND.tap(); start(); }
  else if(act==="home"){ SND.tap(); go("title"); }
  else if(act==="shop"){ var d=SHOPS[k].door; SND.tap(); walkTo(d.x,d.y,function(){ openShop(k); }); }
  else if(act==="acorn"){ var a=S.acorns[i]; if(!a) return; SND.tap(); walkTo(a.x,a.y,function(){ var j=S.acorns.indexOf(a); if(j>=0) collect(j); }); }
  else if(act==="buy") buy(k);
  else if(act==="closeshop"){ SND.tap(); closeSheet(); S.said=null; render(); }
  else if(act==="bagslot") returnItem(i);
  else if(act==="talk") talk();
  else if(act==="replay"){ SND.tap(); S.results=[]; quakeCard(); }
  else if(act==="clearrec"){ modal("このたんまつの きろく（ベストと むらの そだち、おとの せってい）を ぜんぶ けすよ。<br>いいかな？",[{t:"けす",cls:"pink",cb:function(){ S.best=0; S.grow=0; S.muted=false; S.gentle=false; try{ localStorage.removeItem("ponta_best"); localStorage.removeItem("ponta_grow"); localStorage.removeItem("ponta_muted"); localStorage.removeItem("ponta_gentle"); if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) S.gentle=true; }catch(e){} setMuteIcon(); go("title"); }},{t:"やめる",cls:"gray"}]); }
  else if(act==="npc"){ var n=S.npc[k]; SND.tap(); walkTo(Math.max(30,Math.min(450,n.x+(S.px<n.x?-46:46))),Math.min(500,n.y+6),function(){ talk(k); }); }
  else if(act==="sleep"){ SND.tap(); sleep(); }
  else if(act==="back"){ modal("ここまで あつめた ものが きえるよ。<br>もどっても いい？",[{t:"もどる",cls:"pink",cb:function(){ SND.tap(); go("title"); }},{t:"やめる",cls:"gray"}]); }
  else if(act==="nextscene"){ SND.tap(); nextScene(); }
});
$("#mute").addEventListener("click",function(){ S.muted=!S.muted; saveSet("ponta_muted",S.muted?"1":"0"); setMuteIcon(); if(!S.muted){ ac(); SND.tap(); } });
setMuteIcon(); render(); preloadImages();

</script>
