<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>見つめて見つけてほシーカー（SEE-CAR）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* 見つめて見つけてほシーカー style.css  寸法は #stage（16:9）を基準に cqmin で指定 */
*{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:100vh;height:100dvh;width:100%;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP","IPAGothic",system-ui,sans-serif;font-weight:800;color:#12327a}
#app{position:fixed;inset:0;height:100vh;height:100dvh;background:#000}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;outline:none}
svg{display:block}

#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.7778vh);height:min(100vh,56.25vw);
  width:min(100vw,177.7778dvh);height:min(100dvh,56.25vw);
  container-type:size;overflow:hidden;background:#bfe6ff}

/* ---------- 背景（クレヨンと紙） ---------- */
#bg{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 30% 40% at 8% 88%,rgba(255,120,150,.40),transparent 70%),
    radial-gradient(ellipse 28% 36% at 95% 85%,rgba(255,200,60,.45),transparent 70%),
    radial-gradient(ellipse 26% 30% at 70% 98%,rgba(120,210,140,.40),transparent 70%),
    radial-gradient(ellipse 24% 30% at 4% 12%,rgba(190,150,255,.35),transparent 70%),
    repeating-linear-gradient(112deg,rgba(255,255,255,0) 0 .9cqmin,rgba(255,255,255,.22) .9cqmin 1.1cqmin),
    linear-gradient(#8fd3ff 0%,#c9ecff 45%,#fffaf0 78%,#fff3d6 100%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .45 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.blk{position:absolute;display:block;border:.6cqmin solid rgba(40,40,60,.55);border-radius:.8cqmin;box-shadow:.8cqmin 1cqmin 0 rgba(40,40,60,.18)}
.b1{left:-4cqmin;bottom:-4cqmin;width:34cqmin;height:20cqmin;transform:rotate(-8deg);
  background:repeating-linear-gradient(60deg,#ff6b6b 0 1.2cqmin,#ff8f8f 1.2cqmin 2.2cqmin)}
.b2{right:-5cqmin;bottom:-3cqmin;width:38cqmin;height:22cqmin;transform:rotate(6deg);
  background:repeating-linear-gradient(-55deg,#4d9bff 0 1.2cqmin,#7fb8ff 1.2cqmin 2.2cqmin)}
.b3{left:58cqmin;bottom:-9cqmin;width:30cqmin;height:16cqmin;transform:rotate(-3deg);
  background:repeating-linear-gradient(80deg,#ffd23f 0 1.2cqmin,#ffe58a 1.2cqmin 2.2cqmin)}
.tw{position:absolute;display:block;width:4cqmin;height:4cqmin;background:#ffd23f;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle 2.4s ease-in-out infinite}
.t1{left:6cqmin;top:10cqmin}.t2{right:8cqmin;top:8cqmin;width:3cqmin;height:3cqmin;animation-delay:.5s;background:#ff8fb8}
.t3{left:24cqmin;top:58cqmin;width:3cqmin;height:3cqmin;animation-delay:1s;background:#8ee0a5}
.t4{right:20cqmin;top:52cqmin;animation-delay:1.4s}.t5{left:70cqmin;top:6cqmin;width:2.4cqmin;height:2.4cqmin;animation-delay:.9s;background:#b79cff}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(18deg)}}
body[data-state=play] #bg{display:none}

#worldbox{position:absolute;inset:0;background:#6fc2ff;visibility:hidden}
#worldbox canvas{display:block;width:100%;height:100%}
body[data-state=play] #worldbox{visibility:visible}

/* ---------- 画面の切り替え ---------- */
.screen{position:absolute;inset:0;display:none}
body[data-state=boot] #boot,body[data-state=title] #title,body[data-state=setting] #setting,
body[data-state=play] #play,body[data-state=ending] #ending,body[data-state=quit] #quit{display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}

/* ---------- ロゴ ---------- */
.logo{--k:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*.6cqmin);
  filter:drop-shadow(0 calc(var(--k)*1cqmin) 0 rgba(20,40,100,.28))}
.outl{color:#1f5fd9;text-shadow:
  -.5em 0 0 #fff,.5em 0 0 #fff,0 -.5em 0 #fff,0 .5em 0 #fff,
  -.36em -.36em 0 #fff,.36em -.36em 0 #fff,-.36em .36em 0 #fff,.36em .36em 0 #fff,
  -.5em -.2em 0 #fff,.5em -.2em 0 #fff,-.5em .2em 0 #fff,.5em .2em 0 #fff,
  -.2em -.5em 0 #fff,.2em -.5em 0 #fff,-.2em .5em 0 #fff,.2em .5em 0 #fff}
.logo-top{font-size:calc(var(--k)*6.6cqmin);letter-spacing:.04em;line-height:1.1;--e:calc(var(--k)*.28cqmin);color:#1f5fd9;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff,
  calc(var(--e)*2) 0 #fff,calc(var(--e)*-2) 0 #fff,0 calc(var(--e)*2) #fff,0 calc(var(--e)*-2) #fff}
.logo-main{display:flex;align-items:center;gap:calc(var(--k)*1cqmin)}
.logo-name{font-size:calc(var(--k)*17cqmin);line-height:1;letter-spacing:.02em;font-weight:900;--e:calc(var(--k)*.55cqmin);color:#1f66e8;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff,
  calc(var(--e)*2) 0 #fff,calc(var(--e)*-2) 0 #fff,0 calc(var(--e)*2) #fff,0 calc(var(--e)*-2) #fff,calc(var(--e)*2) calc(var(--e)*2) #fff,calc(var(--e)*-2) calc(var(--e)*2) #fff,calc(var(--e)*2) calc(var(--e)*-2) #fff,calc(var(--e)*-2) calc(var(--e)*-2) #fff,
  0 calc(var(--e)*3.4) 0 #0e2f7a}
.logo-en{font-size:calc(var(--k)*5.6cqmin);letter-spacing:.14em;line-height:1;padding:calc(var(--k)*.8cqmin) calc(var(--k)*5cqmin);border-radius:calc(var(--k)*5cqmin);
  background:linear-gradient(#2a5fd0,#143c9c);color:#ffe45e;border:calc(var(--k)*.6cqmin) solid #fff}
.star{position:relative;width:calc(var(--k)*29cqmin);height:calc(var(--k)*29cqmin);flex:none;animation:bob 2.6s ease-in-out infinite}
.star i{position:absolute;inset:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star .s1{background:#fff}
.star .s2{transform:scale(.93);background:conic-gradient(#ff5d8f,#ffb703,#8ecae6,#7bd389,#b388ff,#ff5d8f)}
.star .s3{transform:scale(.8);background:radial-gradient(circle at 40% 30%,#fff6a8,#ffd23f 55%,#ffae00)}
.star b{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);text-align:center;font-size:calc(var(--k)*14cqmin);line-height:1;font-weight:900;color:#1f5fd9;--e:calc(var(--k)*.4cqmin);
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-1.4cqmin) rotate(3deg)}}
.titlelogo{position:absolute;left:0;right:0;top:9cqmin;display:flex;justify-content:center}

/* ---------- Boot / Quit ---------- */
.touchme{position:relative;font-size:7.4cqmin;color:#12327a;background:rgba(255,255,255,.9);padding:2cqmin 7cqmin;border-radius:9cqmin;border:.7cqmin solid #fff;box-shadow:0 1cqmin 0 rgba(20,40,100,.25);animation:blink 1.4s ease-in-out infinite}
.touchme .ring{position:absolute;right:-5cqmin;bottom:-6cqmin;width:11cqmin;height:11cqmin;border-radius:50%;background:rgba(255,93,143,.85);border:.8cqmin solid #fff;animation:pulse 1.4s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.bye{font-size:12cqmin;font-weight:900;color:#1f5fd9;background:rgba(255,255,255,.92);padding:2cqmin 8cqmin;border-radius:10cqmin;border:.8cqmin solid #fff;box-shadow:0 1.2cqmin 0 rgba(20,40,100,.25)}
body[data-state=quit] #quit .center{padding-bottom:14cqmin}

/* ---------- 進行ボタン #nav（全画面で同じ大きさ・同じホップ） ---------- */
#nav{position:absolute;left:0;right:0;bottom:4cqmin;display:flex;justify-content:center;align-items:flex-end;gap:5cqmin;z-index:50;pointer-events:none}
.nbtn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:2cqmin;width:64cqmin;height:16cqmin;border-radius:8cqmin;
  font-size:6.4cqmin;line-height:1;white-space:nowrap;border:.8cqmin solid #fff;box-shadow:0 1.3cqmin 0 rgba(20,40,100,.3);animation:hop 1.15s ease-in-out infinite}
.nbtn i{display:block;width:8cqmin;height:8cqmin;flex:none}
.nbtn i svg{width:100%;height:100%;fill:currentColor}
.nbtn.primary{background:linear-gradient(#ffe86b,#ffb703);color:#3d2800}
.nbtn.secondary{background:linear-gradient(#8fd0ff,#3b8df0);color:#fff;text-shadow:0 .3cqmin 0 rgba(0,40,120,.5);animation:none} /* 跳ねるのは次に押す1つ（primary）だけ */
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2cqmin)}60%{transform:translateY(0)}}
.nbtn.down,.ctl.down,.card.down,.bigcard.down,.key.down,.backbtn.down,#home.down,#cam.down{animation:none;transform:translateY(.7cqmin) scale(.95);filter:brightness(.92)}

/* ---------- ホーム（最前面） ---------- */
#home{position:absolute;z-index:100;top:max(2cqmin,env(safe-area-inset-top));right:max(2.4cqmin,env(safe-area-inset-right));
  width:12cqmin;height:12cqmin;border-radius:50%;background:#fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.3);border:.5cqmin solid #d7e3f7;display:none;align-items:center;justify-content:center}
#home svg{width:7.4cqmin;height:7.4cqmin;fill:#1f5fd9}
body:not([data-state=boot]) #home{display:flex}

/* ---------- モーダル ---------- */
#modal{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,30,70,.6)}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:5cqmin;padding:6cqmin 6cqmin 7cqmin;display:flex;flex-direction:column;align-items:center;gap:6cqmin;border:.9cqmin solid #ffd23f;box-shadow:0 2cqmin 0 rgba(0,0,0,.25)}
.mtitle{font-size:9cqmin;color:#12327a;font-weight:900}
.mbtns{display:flex;gap:5cqmin}
.mbtns .nbtn{width:44cqmin}
#m-no{background:linear-gradient(#9af0a8,#2fbf5a);color:#07431c}
#m-yes{animation:none;background:linear-gradient(#c9d6ea,#8fa4c8);color:#fff}

/* ---------- 縦持ち警告 ---------- */
#portrait{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8vmin;background:#12327a;color:#fff}
.phone{width:18vmin;height:30vmin;border:1.6vmin solid #fff;border-radius:3vmin;background:#ffd23f;animation:rot 2.4s ease-in-out infinite}
.ptext{font-size:7.6vmin;font-weight:900;text-align:center;line-height:1.4;padding:0 6vmin}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media screen and (orientation: portrait){#portrait{display:flex}}

/* ---------- Setting ---------- */
.head{position:absolute;top:3cqmin;left:50%;transform:translateX(-50%);font-size:6.4cqmin;white-space:nowrap;background:rgba(255,255,255,.92);color:#12327a;
  padding:1.4cqmin 6cqmin;border-radius:8cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.2)}
.backbtn{position:absolute;left:3cqmin;top:3cqmin;height:12cqmin;min-width:25cqmin;padding:0 3cqmin;display:flex;align-items:center;justify-content:center;gap:1.4cqmin;
  background:#fff;border-radius:6cqmin;font-size:4.8cqmin;color:#1f5fd9;border:.5cqmin solid #d7e3f7;box-shadow:0 .8cqmin 0 rgba(20,40,100,.25)}
.backbtn i{width:0;height:0;border-top:2.4cqmin solid transparent;border-bottom:2.4cqmin solid transparent;border-right:3.6cqmin solid #1f5fd9}
.pane{position:absolute;left:6cqmin;right:6cqmin;top:19cqmin;bottom:23cqmin;display:none}
#setting[data-sub=choice] .sub-choice,#setting[data-sub=code] .sub-code,#setting[data-sub=pick] .sub-pick,
#setting[data-sub=keypad] .sub-keypad,#setting[data-sub=msg] .sub-msg,#setting[data-sub=error] .sub-msg{display:flex}
.sub-choice{align-items:center;justify-content:center;gap:9cqmin}
.bigcard{width:62cqmin;height:50cqmin;border-radius:5cqmin;background:#fff;border:.9cqmin solid #fff;box-shadow:0 1.4cqmin 0 rgba(20,40,100,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqmin;font-size:7.4cqmin;color:#1f5fd9}
.bigcard svg{width:24cqmin;height:24cqmin}
#c-host{background:linear-gradient(#fff,#fff3b8)}#c-join{background:linear-gradient(#fff,#d6ecff)}

.sub-code{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.digits{display:flex;gap:3cqmin;justify-content:center}
.digits b{width:23cqmin;height:30cqmin;border-radius:3cqmin;background:#fff;border:.8cqmin solid #ffb703;box-shadow:0 1cqmin 0 rgba(20,40,100,.25);display:flex;align-items:center;justify-content:center;font-size:21cqmin;line-height:1;color:#1f5fd9}
.digits.grid2{display:grid;grid-template-columns:repeat(2,23cqmin);gap:3cqmin;align-content:center}
.digits.grid2 b{height:23cqmin;font-size:17cqmin}
.waiting{font-size:6.4cqmin;background:rgba(255,255,255,.92);padding:1.4cqmin 6cqmin;border-radius:8cqmin}
.dots i{font-style:normal;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}

.sub-pick{gap:4cqmin;align-items:stretch}
.pickgrid{flex:1.25;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);grid-auto-rows:1fr;gap:3cqmin;min-width:0}
.card{position:relative;border-radius:4cqmin;background:#fff;border:.8cqmin solid #fff;box-shadow:0 1.1cqmin 0 rgba(20,40,100,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqmin;overflow:hidden;color:#1f5fd9}
.card .kan{font-size:8.4cqmin;line-height:1.1;font-weight:900;letter-spacing:.04em;color:#12327a}
.card .yomi{font-size:3.5cqmin;color:#4a6aa8}
.pickgrid.c3 .kan{font-size:6cqmin}.pickgrid.c3 .yomi{font-size:2.8cqmin}
.card.on{background:linear-gradient(#fff9c4,#ffe45e);border-color:#ff9f1c;box-shadow:0 1.1cqmin 0 rgba(255,140,0,.5)}
.card.file{background:linear-gradient(#fff,#e3f3ff)}
.card.file svg{width:11cqmin;height:11cqmin}
.card{text-align:center}
.card.file{padding:0 1cqmin}
.card.file .kan{font-size:4.2cqmin;white-space:nowrap;text-align:center;width:100%;letter-spacing:0}
.card input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.preview{flex:1;border-radius:4cqmin;background:rgba(255,255,255,.88);border:.8cqmin dashed #8fb4e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqmin;padding:2cqmin;min-width:0;overflow:hidden}
.preview img{max-width:100%;max-height:38cqmin;object-fit:contain;border-radius:1.6cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.25);background:#fff}
.preview .pt{font-size:7cqmin;line-height:1.1;color:#12327a;font-weight:900}
.preview .py{font-size:3.6cqmin;color:#4a6aa8}
.preview .hint{font-size:6cqmin;color:#4a6aa8;text-align:center;line-height:1.4}
.spin{width:10cqmin;height:10cqmin;border-radius:50%;border:1.4cqmin solid #cfe0f7;border-top-color:#ff9f1c;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sub-keypad{gap:8cqmin;align-items:center;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(3,18cqmin);grid-auto-rows:13.4cqmin;gap:1.4cqmin}
.key{border-radius:3cqmin;background:#fff;border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.28);font-size:8cqmin;color:#1f5fd9;font-weight:900;display:flex;align-items:center;justify-content:center}
.key.del{background:linear-gradient(#ffd0d8,#ff8fa6);color:#7a1230;font-size:4.8cqmin}
.key.nul{visibility:hidden}

.sub-msg{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.msgtext{font-size:6.6cqmin;line-height:1.5;text-align:center;background:rgba(255,255,255,.92);padding:2.4cqmin 7cqmin;border-radius:6cqmin;max-width:150cqmin}
.msgface svg{width:20cqmin;height:20cqmin}

/* ---------- Play ---------- */
#play{pointer-events:none}
#play>*{pointer-events:auto}
#maptag{position:absolute;top:2cqmin;left:max(2cqmin,env(safe-area-inset-left));display:flex;align-items:baseline;gap:1.4cqmin;background:rgba(255,255,255,.88);border-radius:4cqmin;padding:.5cqmin 3cqmin;border:.4cqmin solid #fff;box-shadow:0 .5cqmin 0 rgba(20,40,100,.25);white-space:nowrap;pointer-events:none;transition:opacity .4s}
#maptag b{font-size:4.4cqmin;color:#12327a;font-weight:900}#maptag small{font-size:2.4cqmin;color:#4a6aa8}
body.camtop #maptag{opacity:0} /* 真上のときは地図の上はしと戦車をかくさない */
#notice{position:absolute;top:10.5cqmin;left:max(2cqmin,env(safe-area-inset-left));display:none;font-size:3.6cqmin;background:#fff5d6;color:#7a3b00;border:.5cqmin solid #ffb703;border-radius:4cqmin;padding:.7cqmin 3cqmin;white-space:nowrap;pointer-events:none}
#notice.on{display:block;animation:pop2 .35s ease-out}
.ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqmin;color:#12327a}
#dpad{position:absolute;left:max(3cqmin,env(safe-area-inset-left));bottom:3cqmin;display:grid;grid-template-columns:repeat(3,15cqmin);grid-template-rows:repeat(3,15cqmin);gap:1cqmin;pointer-events:none}
#dpad .ctl{pointer-events:auto;border-radius:3.4cqmin;background:rgba(255,255,255,.86);border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.35)}
#dpad .ctl svg{width:6.6cqmin;height:6.6cqmin;fill:#1f5fd9}
#dpad .ctl span{font-size:3.2cqmin;line-height:1}
#dpad [data-act=fwd]{grid-column:2;grid-row:1}#dpad [data-act=left]{grid-column:1;grid-row:2}
#dpad [data-act=right]{grid-column:3;grid-row:2}#dpad [data-act=back]{grid-column:2;grid-row:3}
#dpad .ctl.down{background:#ffe45e}

<script>
// ===== sfx.js =====
// sfx.js : WebAudio の合成効果音（window.Sfx だけ公開）。音声ファイルは使わない。
(function () {
  'use strict';
  var ctx = null, master = null, noiseBuf = null, lastMove = 0;
  var api = { muted: false };

  function unlock() {
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.7;
        var comp = ctx.createDynamicsCompressor();
        master.connect(comp); comp.connect(ctx.destination);
        var len = Math.floor(ctx.sampleRate * 1.2);
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  }

  // 音の高さ f0 → f1、長さ dur、波形 type、音量 vol、開始の遅れ at
  function tone(type, f0, f1, dur, vol, at) {
    var t = ctx.currentTime + (at || 0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.015, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, vol, fType, f0, f1, at) {
    var t = ctx.currentTime + (at || 0);
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf;
    f.type = fType;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.2); s.stop(t + dur + 0.05);
  }

  var sounds = {
    move: function () {   // 小さくやわらかい「ぽ」
      var now = ctx.currentTime;
      if (now - lastMove < 0.12) return;   // 連続でも耳障りにならない
      lastMove = now;
      tone('sine', 220 + Math.random() * 20, 170, 0.09, 0.07);
    },
    turn: function () { tone('triangle', 420, 560, 0.12, 0.12); },
    tap: function () { tone('sine', 660, 880, 0.08, 0.2); tone('sine', 990, 990, 0.06, 0.08, 0.04); },
    bump: function () { tone('square', 140, 90, 0.12, 0.1); noise(0.08, 0.12, 'lowpass', 500); },
    fire: function () {   // ぽんっと打ち上げる
      tone('sine', 300, 90, 0.25, 0.35);
      tone('triangle', 700, 250, 0.15, 0.12);
      noise(0.12, 0.15, 'bandpass', 1500, 500);
    },
    boom: function () {   // 低い爆発音＋破片っぽいノイズ
      tone('sine', 140, 38, 0.7, 0.6);
      tone('sawtooth', 90, 40, 0.45, 0.2);
      noise(0.55, 0.45, 'lowpass', 1800, 120);
      for (var i = 0; i < 6; i++) {
        noise(0.05 + Math.random() * 0.06, 0.12, 'highpass', 2500 + Math.random() * 3000, null, 0.08 + i * 0.07 + Math.random() * 0.04);
      }
    },
    found: function () {  // キラキラ上昇のファンファーレ
      var n = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568];
      n.forEach(function (f, i) {
        tone('triangle', f, f, 0.28, 0.2, i * 0.09);
        tone('sine', f * 2, f * 2, 0.2, 0.06, i * 0.09 + 0.02);
      });
      var t0 = 0.6;
      [1046.5, 1318.5, 1568].forEach(function (f) { tone('triangle', f, f, 0.7, 0.18, t0); });
      tone('sine', 523.25, 523.25, 0.7, 0.15, t0);
      for (var i = 0; i < 8; i++) tone('sine', 2000 + Math.random() * 2500, null, 0.08, 0.04, 0.45 + i * 0.07);
    }
  };

  api.unlock = unlock;
  api.play = function (name) {
    try {
      if (api.muted || !ctx || !sounds[name]) return;
      if (ctx.state === 'suspended') { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); }
      sounds[name]();
    } catch (e) {}
  };
  window.Sfx = api;
})();

// ===== mapgen.js =====
/* mapgen.js : 画像 -> 地図データ（MapData）、宝の位置、既定地図。公開する名前は window.MapGen だけ。 */
(function () {
  'use strict';

  var MAX_LONG = 64;        // 縮小後の長い辺（画素）
  var BLOCK = 2;            // 画像1画素 = 2x2マス
  var PIC_LONG = 512;       // みつけた！画面用の元画像の長い辺
  var WALL_H = 10;          // 高さ10（真っ黒）だけが壁。濃い青や赤の塗りは壁にしない
  var MIN_PIXELS = 4;       // 4画素（=16マス）未満の領域は除外
  var DX = [0, 1, 0, -1], DZ = [-1, 0, 1, 0];
  var KID_ERROR = 'この え は つかえないよ';

  // ---------- 小さな道具 ----------
  function newCanvas(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, w); c.height = Math.max(1, h);
    return c;
  }
  function whiteCanvas(w, h) {
    var c = newCanvas(w, h), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingEnabled = true;
    try { g.imageSmoothingQuality = 'high'; } catch (e) { /* 古いブラウザ */ }
    return c;
  }
  // src（canvas か img）を、長い辺が maxLong 以下になるまで縮小。半分ずつ縮めて画質を保ち、大きな写真でも速い。
  // 透明部分は白になる。小さい画像は拡大しない。
  function shrink(src, sw, sh, maxLong) {
    var k = Math.min(1, maxLong / Math.max(sw, sh));
    var tw = Math.max(1, Math.round(sw * k)), th = Math.max(1, Math.round(sh * k));
    var cur = src, cw = sw, ch = sh;
    while (cw > tw * 2 || ch > th * 2) {
      var nw = Math.max(tw, Math.ceil(cw / 2)), nh = Math.max(th, Math.ceil(ch / 2));
      var c = whiteCanvas(nw, nh);
      c.getContext('2d').drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
      cur = c; cw = nw; ch = nh;
    }
    var out = whiteCanvas(tw, th);
    out.getContext('2d').drawImage(cur, 0, 0, cw, ch, 0, 0, tw, th);
    return out;
  }

  // ---------- 解析 ----------
  // 画素(pw x ph)のRGBA -> MapData（絵の部分）。picture/title/reading は呼び出し側で入れる。
  function analyze(rgba, pw, ph, darkL) {
    var w = pw * BLOCK, h = ph * BLOCK, n = w * h;
    var heights = new Uint8Array(n), colors = new Uint8Array(n * 3);
    var px, pz, i, j, dx, dz;
    for (pz = 0; pz < ph; pz++) {
      for (px = 0; px < pw; px++) {
        var p = (pz * pw + px) * 4;
        var a = rgba[p + 3] / 255;
        // 透明は白扱い
        var r = Math.round(rgba[p] * a + 255 * (1 - a));
        var g = Math.round(rgba[p + 1] * a + 255 * (1 - a));
        var b = Math.round(rgba[p + 2] * a + 255 * (1 - a));
        var L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        // 高さは「その画素が受け持つ範囲で一番濃い色」で決める（縮小で細い線が薄れて壁が途切れるのを防ぐ）
        if (darkL) L = Math.min(L, darkL[pz * pw + px]);
        var hh = Math.round((1 - L) * 10);
        if (hh < 0) hh = 0; if (hh > 10) hh = 10;
        for (dz = 0; dz < BLOCK; dz++) {
          for (dx = 0; dx < BLOCK; dx++) {
            i = (pz * BLOCK + dz) * w + (px * BLOCK + dx);
            heights[i] = hh;
            colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
          }
        }
      }
    }

    return analyzeCells(heights, colors, w, h);
  }
  function analyzeCells(heights, colors, w, h) {
    var n = w * h, label = new Int32Array(n).fill(-1), queue = new Int32Array(n), regions = [], i, j, x, z;
    for (i = 0; i < n; i++) {
      if (heights[i] >= WALL_H || label[i] !== -1) continue;
      var id = regions.length, qh = 0, qt = 0, reg = { id: id, size: 0, edge: false, sx: 0, sz: 0 };
      label[i] = id; queue[qt++] = i;
      while (qh < qt) {
        j = queue[qh++]; x = j % w; z = (j - x) / w;
        reg.size++; reg.sx += x; reg.sz += z;
        if (x === 0 || z === 0 || x === w - 1 || z === h - 1) reg.edge = true;
        if (x > 0 && label[j - 1] === -1 && heights[j - 1] < WALL_H) { label[j - 1] = id; queue[qt++] = j - 1; }
        if (x < w - 1 && label[j + 1] === -1 && heights[j + 1] < WALL_H) { label[j + 1] = id; queue[qt++] = j + 1; }
        if (z > 0 && label[j - w] === -1 && heights[j - w] < WALL_H) { label[j - w] = id; queue[qt++] = j - w; }
        if (z < h - 1 && label[j + w] === -1 && heights[j + w] < WALL_H) { label[j + w] = id; queue[qt++] = j + w; }
      }
      regions.push(reg);
    }
    // 外の領域（スタートを置く所）: 端に触れる最大の非壁領域。無ければ最大の領域。
    var main = null;
    for (i = 0; i < regions.length; i++) if (regions[i].edge && (!main || regions[i].size > main.size)) main = regions[i];
    if (!main) for (i = 0; i < regions.length; i++) if (!main || regions[i].size > main.size) main = regions[i];
    if (!main) { // 全面が壁：中央に小さな空き地を掘ってやり直す
      var cx = Math.floor(w / 2), cz = Math.floor(h / 2), ex, ez;
      for (ez = -1; ez <= 1; ez++) for (ex = -1; ex <= 1; ex++) {
        x = Math.min(w - 1, Math.max(0, cx + ex)); z = Math.min(h - 1, Math.max(0, cz + ez));
        heights[z * w + x] = 0;
      }
      return analyzeCells(heights, colors, w, h);
    }
    return finish(heights, colors, w, h, label, regions, main);
  }

  function finish(heights, colors, w, h, label, regions, main) {
    var n = w * h, i, x, z, k;

    // --- スタート2つ：外の領域の、高さ0（無ければ最も低い）のマスから、互いに離して選ぶ ---
    var minH = 255;
    for (i = 0; i < n; i++) if (label[i] === main.id && heights[i] < minH) minH = heights[i];

    s.lineTo(x0 + iw, y0 + ih - cr); s.quadraticCurveTo(x0 + iw, y0 + ih, x0 + iw - cr, y0 + ih);
    s.lineTo(x0 + cr, y0 + ih); s.quadraticCurveTo(x0, y0 + ih, x0, y0 + ih - cr);

        var p = fx.parts[i];
        p.life -= dt;
        if (p.life <= 0) { fx.debris.setMatrixAt(p.i, tmpM.makeScale(0, 0, 0)); fx.free.push(p.i); fx.parts.splice(i, 1); continue; }
        if (!p.rest) {
          p.v.y -= 22 * dt;
          p.p.addScaledVector(p.v, dt);
          p.r.addScaledVector(p.av, dt);
          var gy = groundTopAt(p.p.x, p.p.z) + p.s * 0.5;
          if (p.p.y < gy) {
            p.p.y = gy;
            if (p.v.y < -2) { p.v.y *= -0.38; p.v.x *= 0.6; p.v.z *= 0.6; p.av.multiplyScalar(0.5); }
            else { p.v.set(0, 0, 0); p.rest = true; }
          }
        }
        var sc = p.s * Math.min(1, p.life / 0.45);
        tmpQ.setFromEuler(tmpE.set(p.r.x, p.r.y, p.r.z));
        tmpM.compose(p.p, tmpQ, tmpS.set(sc, sc, sc));
        fx.debris.setMatrixAt(p.i, tmpM);
      }
      fx.debris.instanceMatrix.needsUpdate = true;
      if (!fx.parts.length) fx.debris.count = 0;
    }
    // 煙
    for (i = 0; i < fx.puffs.length; i++) {
      var q = fx.puffs[i]; if (q.life <= 0) continue;
      q.life -= dt;
      if (q.life <= 0) { q.sp.visible = false; continue; }
      var t = 1 - q.life / q.max;
      q.sp.position.addScaledVector(q.v, dt); q.v.multiplyScalar(Math.exp(-dt * 2.5));
      q.sp.scale.setScalar(q.s0 + (q.s1 - q.s0) * (1 - Math.pow(1 - t, 2)));
      q.sp.material.opacity = q.a0 * (1 - t);
    }
    // 閃光
    for (i = 0; i < fx.bursts.length; i++) {
      var b = fx.bursts[i]; if (b.life <= 0) continue;
      b.life -= dt;
      if (b.life <= 0) { b.sp.visible = b.fl.visible = b.ring.visible = false; continue; }
      var u = 1 - b.life / b.max;
      var k1 = clamp(u / 0.12, 0, 1);
      var s1 = (0.8 + 1.7 * (1 - Math.pow(1 - k1, 3))) * b.big;
      b.sp.position.set(b.pos.x, b.pos.y + 0.9 * b.big, b.pos.z);
      b.sp.scale.set(s1, s1, 1);
      b.sp.material.opacity = u < 0.3 ? 1 : Math.max(0, 1 - (u - 0.3) / 0.25);
      b.sp.material.rotation += dt * 0.6;
      b.fl.position.copy(b.sp.position);
      var fs = 5.5 * b.big * (0.4 + u);
      b.fl.scale.set(fs, fs, 1);
      b.fl.material.opacity = Math.max(0, 1 - u * 2.4);
      b.ring.position.set(b.pos.x, b.ground + 0.06, b.pos.z);
      var rs = (0.6 + u * 3.4) * b.big * 1.2;
      b.ring.scale.set(rs, rs, rs);
      b.ring.material.opacity = 0.85 * (1 - u);
    }
    if (S.boomLight.intensity > 0) S.boomLight.intensity = Math.max(0, S.boomLight.intensity - dt * 9);
  }

  // ---------- 地図 ----------
  function idx(x, z) { return z * S.w + x; }
  function inMap(x, z) { return x >= 0 && z >= 0 && x < S.w && z < S.h; }
  function hAt(x, z) { return inMap(x, z) ? S.heights[idx(x, z)] : 0; }
  function groundTopAt(wx, wz) { var x = Math.floor(wx), z = Math.floor(wz); return inMap(x, z) ? vis(S.heights[idx(x, z)]) : 0; }
  function cellColor(i, out) { return out.setRGB(S.colors[i * 3] / 255, S.colors[i * 3 + 1] / 255, S.colors[i * 3 + 2] / 255); }

  function clearLevel() {
    resetFx();
    var L = S.level; if (!L) return;
    L.objects.forEach(function (o) { if (o.parent) o.parent.remove(o); });
    L.dispose.forEach(function (d) { try { d.dispose(); } catch (e) { } });
    if (S.me) disposeTank(S.me.tank);
    for (var k in S.remotes) disposeTank(S.remotes[k].tank);
    S.level = null; S.me = null; S.remotes = {}; S.map = null; S.treasure = null;
    if (S.gemLight) S.gemLight.intensity = 0;
  }

  function load(map, opts) {
    if (!S.inited) { if (S.container) init(S.container); else throw new Error('World.init を先に呼んでください'); }
    clearLevel();
    opts = opts || {};
    S.map = map; S.w = map.w; S.h = map.h;
    S.heights = new Uint8Array(map.heights); // 自分用の写し（破壊で書きかえる）
    S.colors = map.colors;
    S.destroyed = new Uint8Array(S.w * S.h);
    S.myIndex = opts.myIndex || 0;
    S.players = opts.players || [{ color: '#e53935' }, { color: '#1e88e5' }];
    S.net = !!opts.net;
    S.found = false; S.held = {}; S.tapQ = {}; S.stateAcc = 0; S.shake = 0;
    var L = S.level = { objects: [], dispose: [] };
    function add(o) { S.scene.add(o); L.objects.push(o); return o; }

    buildTerrain(L, add);
    buildFloor(L, add);
    buildTreasure(L, add);

    // 自分の戦車
    var st = (map.starts && map.starts[S.myIndex]) || { x: 1, z: 1, dir: 0 };
    var tk = makeTank(S.players[S.myIndex] ? S.players[S.myIndex].color : '#e53935');
    add(tk.root);
    S.me = {
      tank: tk, cx: st.x, cz: st.z, dir: st.dir || 0,
      move: null, turn: null, bump: null, bumpCd: 0, fireCd: 0, fireAnim: 0
    };
    tk.x = st.x; tk.z = st.z; tk.y = vis(hAt(st.x, st.z)); tk.heading = dirToHeading(S.me.dir);
    // 相手の戦車（通信のときは最初からスタート位置に置く）
    if (S.net) {
      for (var p = 0; p < S.players.length; p++) {
        if (p === S.myIndex) continue;
        var s2 = (map.starts && map.starts[p]) || st;
        ensureRemote(p, { x: s2.x, z: s2.z, dir: s2.dir || 0, color: S.players[p] && S.players[p].color, anim: 'idle' }, true);
      }
    }
    // カメラ（いまのモードへすぐ合わせる）
    S.camBlendT = 1; S.chaseLift = 0;
    var far = overheadHeight() * 1.6 + 60;
    S.camera.far = far; S.camera.updateProjectionMatrix();
    // 開始演出：まず真上から地図全体と宝を見せる（updateCamera が、のち斜め後ろへ寄せる）
    S.camMode = 1; S.intro = { t: 0 }; S.topFlag = null; // 開始演出のあと斜め後ろ（1）へ
    var pose = poseFor(2);
    S.camera.position.copy(pose.p); S.camera.quaternion.copy(pose.q);
    if (!S.running) render();
  }

  function buildTerrain(L, add) {
    var w = S.w, h = S.h, n = 0, i;
    for (i = 0; i < w * h; i++) if (S.heights[i] > 1) n++; // 高さ0・1は紙の色（床に塗る）
    var geo = new THREE.BoxGeometry(1, 1, 1);
    geo.translate(0, 0.5, 0);
    // 側面を少し暗く（上の面=明るい、側面=やや暗い、底=暗い）
    var pos = geo.attributes.position, nor = geo.attributes.normal, cols = new Float32Array(pos.count * 3);
    for (i = 0; i < pos.count; i++) {
      var ny = nor.getY(i), nx = nor.getX(i), v;
      if (ny > 0.5) v = 1; else if (ny < -0.5) v = 0.5; else v = nx !== 0 ? 0.86 : 0.93;
      cols[i * 3] = cols[i * 3 + 1] = cols[i * 3 + 2] = v;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    var mat = new THREE.MeshLambertMaterial({ map: T.crayon, vertexColors: true });
    var mesh = new THREE.InstancedMesh(geo, mat, Math.max(1, n));
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    var cellToInst = new Int32Array(w * h).fill(-1);
    var m = new THREE.Matrix4(), c = new THREE.Color(), k = 0;
    for (var z = 0; z < h; z++) for (var x = 0; x < w; x++) {
      i = z * w + x; var hh = S.heights[i];
      if (hh <= 1) continue;
      m.makeScale(1, vis(hh), 1); m.setPosition(x + 0.5, 0, z + 0.5);
      mesh.setMatrixAt(k, m);
      cellColor(i, c);
      // 高い段（濃い色）ほど黒に近づける。壁（10）はほぼ真っ黒（上の面だけ少し明るく見える）
      var wl = clamp((hh - 5) / 4, 0, 1);
      c.r += (0.12 - c.r) * wl; c.g += (0.12 - c.g) * wl; c.b += (0.125 - c.b) * wl;
      mesh.setColorAt(k, c);
      cellToInst[i] = k++;
    }
    if (n === 0) { mesh.setMatrixAt(0, m.makeScale(0, 0, 0)); mesh.setColorAt(0, c.set(1, 1, 1)); }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    add(mesh);
    L.terrain = mesh; L.cellToInst = cellToInst;
    L.dispose.push(geo, mat);
  }

  // 床：地図の色から作ったCanvasTexture（影とクレヨンのざらざらも描きこむ）
  function buildFloor(L, add) {
    var w = S.w, h = S.h;
    var px = clamp(Math.floor(1024 / Math.max(w, h)), 4, 16);
    var small = makeCanvas(w, h), big = makeCanvas(w * px, h * px);
    L.floorSmall = small; L.floorBig = big; L.floorPx = px;
    L.floorPattern = big.getContext('2d').createPattern(T.crayonCanvas, 'repeat');
    var tex = new THREE.CanvasTexture(big);
    tex.anisotropy = 4;
    L.floorTex = tex;
    paintFloor();
    var fg = new THREE.PlaneGeometry(w, h); fg.rotateX(-Math.PI / 2);
    var fm = new THREE.MeshLambertMaterial({ map: tex });
    var floor = new THREE.Mesh(fg, fm); floor.position.set(w / 2, 0, h / 2);
    add(floor);
    // 紙のふち（少し影）と机
    var eg = new THREE.PlaneGeometry(w + 1.2, h + 1.2); eg.rotateX(-Math.PI / 2);
    var em = new THREE.MeshBasicMaterial({ color: 0x8a7458, transparent: true, opacity: 0.35, depthWrite: false });
    var edge = new THREE.Mesh(eg, em); edge.position.set(w / 2 + 0.25, -0.02, h / 2 + 0.25); add(edge);
    var size = Math.max(w, h) * 6 + 200;
    var dg = new THREE.PlaneGeometry(size, size); dg.rotateX(-Math.PI / 2);
    var dtex = T.desk.clone(); dtex.needsUpdate = true; dtex.repeat.set(size / 12, size / 12);
    var dm = new THREE.MeshLambertMaterial({ map: dtex });
    var desk = new THREE.Mesh(dg, dm); desk.position.set(w / 2, -0.05, h / 2); add(desk);
    L.dispose.push(tex, fg, fm, eg, em, dg, dm, dtex);
  }

  function paintFloor() {
    var L = S.level, w = S.w, h = S.h;
    var sctx = L.floorSmall.getContext('2d');
    var img = sctx.createImageData(w, h), d = img.data;
    for (var z = 0; z < h; z++) for (var x = 0; x < w; x++) {
      var i = z * w + x, hh = S.heights[i], r, g, b;
      if (S.destroyed[i]) { r = 236; g = 230; b = 218; }
      else if (hh > 1) { r = 40; g = 40; b = 42; } // 積み木の下：にじんで足元の影になる
      else { r = S.colors[i * 3]; g = S.colors[i * 3 + 1]; b = S.colors[i * 3 + 2]; }
      // 柔らかい影：左上（北西）の高い物が、右下へ影を落とす
      var sh = 1;
      for (var k = 1; k <= 4; k++) {
        var hx = vis(hAt(x - k, z - k)) - vis(hh);
        if (hx > k * 0.75) { sh = Math.min(sh, 0.7 + k * 0.04); break; }
      }
      // まわりが高いとほんのり暗く（すみっこの影）
      var ao = 0;
      if (hAt(x - 1, z) > hh) ao++; if (hAt(x + 1, z) > hh) ao++; if (hAt(x, z - 1) > hh) ao++; if (hAt(x, z + 1) > hh) ao++;
      sh *= 1 - ao * 0.05;
      d[i * 4] = r * sh; d[i * 4 + 1] = g * sh; d[i * 4 + 2] = b * sh; d[i * 4 + 3] = 255;
    }
    sctx.putImageData(img, 0, 0);
    var big = L.floorBig, g2 = big.getContext('2d');
    g2.globalCompositeOperation = 'source-over';
    g2.imageSmoothingEnabled = true;
    g2.drawImage(L.floorSmall, 0, 0, big.width, big.height);
    g2.globalCompositeOperation = 'multiply';
    g2.globalAlpha = 0.55;
    g2.fillStyle = L.floorPattern;
    g2.fillRect(0, 0, big.width, big.height);
    g2.globalAlpha = 1;
    g2.globalCompositeOperation = 'source-over';
    L.floorTex.needsUpdate = true;
  }

  function buildTreasure(L, add) {
    var t = S.map.treasure; if (!t) return;
    var g = new THREE.Group();
    g.position.set(t.x + 0.5, vis(hAt(t.x, t.z)), t.z + 0.5);
    var gemGeo = new THREE.OctahedronGeometry(GEM_R, 0);
    var gemMat = new THREE.MeshStandardMaterial({ color: 0xff4fb0, emissive: 0xb01070, emissiveIntensity: 0.95, roughness: 0.12, metalness: 0.25, flatShading: true });
    var gem = new THREE.Mesh(gemGeo, gemMat); gem.scale.set(1, 1.35, 1); gem.position.y = GEM_Y;
    g.add(gem);
    var glowMat = new THREE.SpriteMaterial({ map: T.soft, color: 0xff6cc4, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.8 });
    var glow = new THREE.Sprite(glowMat); glow.scale.set(4, 4, 1); glow.position.y = GEM_Y; g.add(glow);
    // 光の柱
    var bh = 90;
    var beamGeo = new THREE.CylinderGeometry(1.0, 1.0, bh, 24, 1, true); beamGeo.translate(0, bh / 2, 0);
    var beamMat = new THREE.MeshBasicMaterial({ map: T.beam, color: 0xff4fb0, opacity: 0.5, transparent: true, depthWrite: false, side: THREE.DoubleSide }); // 空が明るいので、足し算でなく ふつうの重ね（ピンクのまま見える）
    var beam = new THREE.Mesh(beamGeo, beamMat); g.add(beam);
    var beam2Geo = new THREE.CylinderGeometry(0.3, 0.3, bh, 14, 1, true); beam2Geo.translate(0, bh / 2, 0);
    var beam2Mat = new THREE.MeshBasicMaterial({ map: T.beam, color: 0xff8fd0, opacity: 0.7, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    var beam2 = new THREE.Mesh(beam2Geo, beam2Mat); g.add(beam2);
    // きらきら
    var sparks = [];
    var starMat = new THREE.SpriteMaterial({ map: T.star, color: 0xfff6a0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    for (var i = 0; i < 6; i++) { var s = new THREE.Sprite(starMat); s.scale.setScalar(0.4); g.add(s); sparks.push(s); }
    // 俯瞰のための大きな目じるし（光の輪）
    var far = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.star, color: 0xff3fa8, transparent: true, depthWrite: false, depthTest: false }));
    far.renderOrder = 9; far.visible = false; g.add(far);
    add(g);
    S.treasure = { group: g, gem: gem, glow: glow, sparks: sparks, far: far, beam: beam, x: t.x, z: t.z, celebrate: 0 };
    S.gemLight.position.set(t.x + 0.5, g.position.y + 1.4, t.z + 0.5);
    S.gemLight.intensity = 2.2;
    L.dispose.push(gemGeo, gemMat, glowMat, beamGeo, beamMat, beam2Geo, beam2Mat, starMat, far.material);
  }

  function updateTreasure(dt) {
    var tr = S.treasure; if (!tr) return;
    var t = S.time;
    tr.gem.rotation.y += dt * 1.6;
    var c = tr.celebrate; if (c > 0) tr.celebrate = Math.max(0, c - dt);
    tr.gem.position.y = GEM_Y + Math.sin(t * 2.4) * 0.14 + (c > 0 ? Math.sin((1.5 - c) * 6) * 0.5 + 0.4 : 0);
    var pulse = 3.6 + Math.sin(t * 4) * 0.45 + (c > 0 ? 2.5 : 0);
    tr.glow.position.y = tr.gem.position.y;
    tr.glow.scale.set(pulse, pulse, 1);
    S.gemLight.intensity = 1.6 + Math.sin(t * 4) * 0.4;
    for (var i = 0; i < tr.sparks.length; i++) {
      var a = t * 1.3 + i / tr.sparks.length * Math.PI * 2;
      var r = 1.0 + (c > 0 ? 0.8 : 0);
      tr.sparks[i].position.set(Math.cos(a) * r, GEM_Y + Math.sin(t * 3 + i) * 0.6, Math.sin(a) * r);
      var ss = 0.3 + 0.22 * Math.abs(Math.sin(t * 5 + i * 1.7));
      tr.sparks[i].scale.set(ss, ss, 1);
    }
    // 遠くからでも見える光（カメラが高いほど大きく）
    var camH = S.camera.position.y;
    tr.far.visible = camH > 7;
    if (tr.far.visible) { var fs = camH * 0.11 * (1 + 0.12 * Math.sin(t * 5)); tr.far.material.rotation = Math.sin(t * 2) * 0.3; tr.far.scale.set(fs, fs, 1); tr.far.position.y = 0.8; tr.far.material.opacity = clamp((camH - 7) / 6, 0, 1); }
  }

  // ---------- 破壊 ----------
  function destroyCells(cells, withFx) {
    var L = S.level; if (!L) return [];
    var done = [], zero = new THREE.Matrix4().makeScale(0, 0, 0), c = new THREE.Color(), changed = false;
    var cx = 0, cz = 0, cy = 0, cnt = 0;
    for (var k = 0; k < cells.length; k++) {
      var x = cells[k][0] | 0, z = cells[k][1] | 0;
      if (!inMap(x, z)) continue;
      var i = idx(x, z), hh = S.heights[i];
      done.push([x, z]);
      cx += x + 0.5; cz += z + 0.5; cy = Math.max(cy, vis(hh)); cnt++;
      if (withFx) {
        cellColor(i, c);
        if (hh > 0) {
          spawnDebris(x + 0.5, vis(hh) * 0.5, z + 0.5, c, Math.min(90, 26 + hh * 7), 1);
          for (var p = 0; p < 3; p++) spawnPuff(x + 0.5 + rand(-0.4, 0.4), vis(hh) * rand(0.2, 0.9) + 0.1, z + 0.5 + rand(-0.4, 0.4), { color: 0xdedad2, vx: rand(-1, 1), vy: rand(0.8, 2), vz: rand(-1, 1), s0: 0.6, s1: 2.4, life: 1.4, a: 0.85 });
        } else {
          spawnDebris(x + 0.5, 0.05, z + 0.5, c.lerp(new THREE.Color(0x9a9080), 0.5), 8, 0.6);
          spawnPuff(x + 0.5, 0.3, z + 0.5, { color: 0xe8e2d6, vy: 1, s0: 0.5, s1: 1.8, life: 1 });
        }
      }
      if (hh > 0) {
        S.heights[i] = 0; S.destroyed[i] = 1; changed = true;
        var inst = L.cellToInst[i];
        if (inst >= 0) L.terrain.setMatrixAt(inst, zero); // そのマスの行列だけ更新
      }
    }
    if (changed) { L.terrain.instanceMatrix.needsUpdate = true; paintFloor(); }
    if (withFx && cnt) {
      cx /= cnt; cz /= cnt;
      spawnBurst(cx, Math.max(0.3, cy * 0.5), cz, true);
      S.boomLight.position.set(cx, cy + 1.5, cz); S.boomLight.intensity = 4;
      // 画面ゆれ（近いほど強い）
      var me = S.me ? S.me.tank : null;
      var dist = me ? Math.hypot(me.x + 0.5 - cx, me.z + 0.5 - cz) : 4;
      S.shake = Math.max(S.shake, clamp(0.55 - dist * 0.03, 0.18, 0.55));
      sfx('boom');
    }
    return done;
  }

  // ---------- 自分の戦車の操作 ----------
  function press(action, isDown) {
    if (['fwd', 'back', 'left', 'right', 'fire'].indexOf(action) < 0) return;
    if (!isDown) { S.held[action] = false; return; }
    if (S.paused) return;
    S.held[action] = true;
    S.tapQ[action] = true;
  }
  function want(a) { return S.held[a] || S.tapQ[a]; }

  function updateMe(dt) {
    var me = S.me; if (!me) return;
    var tk = me.tank;
    me.fireCd = Math.max(0, me.fireCd - dt);
    me.fireAnim = Math.max(0, me.fireAnim - dt);
    me.bumpCd = Math.max(0, me.bumpCd - dt);

    // 大砲（いつでも撃てる。間隔0.8秒）
    if (want('fire')) {
      S.tapQ.fire = false;
      if (me.fireCd <= 0) fire();
    }

    // 進行中の動き
    if (me.move) {
      var mv = me.move; mv.t += dt;
      var u = clamp(mv.t / MOVE_DUR, 0, 1), e = ease(u);
      tk.x = mv.fx + (mv.tx - mv.fx) * u;
      tk.z = mv.fz + (mv.tz - mv.fz) * u;
      // 段差：前半は平らに進み、ふちで滑らかに上り下り
      var su = clamp((u - 0.25) / 0.5, 0, 1);
      tk.y = mv.fy + (mv.ty - mv.fy) * ease(su);
      if (u >= 1) {
        me.move = null; me.cx = mv.tx; me.cz = mv.tz; tk.x = mv.tx; tk.z = mv.tz; tk.y = mv.ty;
        checkFound();
      }
    } else if (me.turn) {
      var tn = me.turn; tn.t += dt;
      var v = clamp(tn.t / TURN_DUR, 0, 1);
      tk.heading = tn.from + (tn.to - tn.from) * ease(v);
      if (v >= 1) { me.turn = null; tk.heading = tn.to; }
    } else if (me.bump) {
      var bp = me.bump; bp.t += dt;
      var w = clamp(bp.t / BUMP_DUR, 0, 1);
      var off = Math.sin(w * Math.PI) * 0.16 * (w < 0.5 ? 1 : 0.6);
      tk.bump.position.set(0, 0, -off * bp.sign);
      if (w >= 1) { me.bump = null; tk.bump.position.set(0, 0, 0); me.bumpCd = 0.18; }
    }

    // つぎの動き
    if (!me.move && !me.turn && !me.bump) {
      var groundY = vis(hAt(me.cx, me.cz));

    netConnected = true; hostRetry = 0; sel = null; loading = false;
    call('Net', 'send', { t: 'hello', color: PLAYERS[0].color });
    renderCards(); renderPreview();
    setSub('pick', 'つながったよ！ ちずを えらんでね');
  }

  function startJoin() {
    closeNet();
    netRole = 'join'; code = '';
    updateKeypad(); setSub('keypad');
  }
  function updateKeypad() { showDigits(els.codein, code, 4); renderNav(); }
  function doJoin() {
    if (code.length !== 4) return;
    var tok = ++netTok; joined = false;
    infoNet('さがしているよ…');
    var p = call('Net', 'join', code);
    if (!p || !p.then) { failNet('つうしんが つかえないよ'); return; }
    p.then(function () {
      if (tok !== netTok) return;
      joined = true; netConnected = true;
      call('Net', 'send', { t: 'hello', color: PLAYERS[1].color });
      if (state === 'setting') infoNet('つながったよ！ ちずが くるのを まっているよ…', HAPPY);
    }, function (e) {
      if (tok !== netTok) return;
      failNet(errText(e));
    });
  }
  function retry() { if (netRole === 'host') startHost(); else startJoin(); }

  function buildKeypad() {
    var kp = els.keypad;
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'nul'].forEach(function (k) {
      var b = doc.createElement('button');
      b.type = 'button'; b.tabIndex = -1;
      if (k === 'nul') { b.className = 'key nul'; kp.appendChild(b); return; }
      b.className = 'key' + (k === 'del' ? ' del' : '');
      b.textContent = k === 'del' ? 'けす' : k;
      tap(b, function () { keyIn(k); });
      kp.appendChild(b);
    });
  }
  function keyIn(k) {
    if (sub !== 'keypad') return;
    if (k === 'del') code = code.slice(0, -1);
    else if (code.length < 4) code += k;
    updateKeypad();
  }

  // ---------------- Net の受け口（1回だけ登録） ----------------
  function onNetOpen() {
    if (state === 'setting' && netRole === 'host' && sub === 'code') hostConnected();
  }
  function onNetData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'map') {
      if (state === 'setting' && netRole === 'join') {
        var m = call('MapGen', 'decode', d.map);
        if (m) { netTok++; netOn = true; startGame(m, 1, true); }
        else failNet('ちずが うけとれなかったよ');
      }
      return;
    }
    if (state !== 'play') return;
    var other = 1 - myIndex;
    if (d.t === 'st') call('World', 'applyRemoteState', other, d.s);
    else if (d.t === 'boom') {
      // 発射のときに1回だけ届く。弾が山なりに飛んでから壊れる（「ドゴォーン！」は着弾のとき World の boom で出す）
      guard = true; try { call('World', 'applyRemoteBoom', d.cells, d.from); } finally { guard = false; }
    } else if (d.t === 'found') {
      guard = true; try { call('World', 'remoteFound', d.idx); } finally { guard = false; }
      go('ending', d.idx);
    }
  }
  function onNetClose() {
    netConnected = false;
    if (state === 'play' && netOn) {
      netOn = false;
      showNotice('あいてが いなくなったよ');
    } else if (state === 'setting' && mode === 'net') {
      failNet('あいてと つながらなくなったよ');
    }
    netOn = false;
  }
  // 'error' は Promise の reject と二重になるので、ここでは何も表示しない

  // ---------------- Play ----------------
  function startGame(m, idx, net) {
    map = m; myIndex = idx; netOn = !!net;
    hideNotice();
    call('World', 'load', m, { myIndex: idx, players: PLAYERS, net: netOn });
    els.ptTitle.textContent = m.title || '';
    els.ptYomi.textContent = m.reading || '';
    camMode = 1; updateCam();
    doc.body.classList.add('camtop'); // 開始演出は真上から
    go('play');
    call('World', 'setCamera', camMode);
    call('World', 'start');
    running = true;
    applyPortraitPause();
  }
  function stopGame() {
    if (running) { running = false; call('World', 'stop'); }
  }
  function updateCam() {
    var col = PLAYERS[myIndex] ? PLAYERS[myIndex].color : PLAYERS[0].color, nx = (camMode + 1) % 3;
    els.camIco.innerHTML = camIcon(camMode, col);
    els.camNext.innerHTML = camIcon(nx, col);
    els.camLabel.textContent = CAM_LABEL[camMode];
    els.cam.setAttribute('aria-label', CAM_LABEL[camMode] + '。おすと ' + CAM_LABEL[nx]);
  }
  function cycleCam() {
    var m = call('World', 'cycleCamera');
    camMode = (typeof m === 'number') ? m : (camMode + 1) % 3;
    updateCam();
  }
  function showBoom() {
    var b = els.boom;
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(boomTimer);
    boomTimer = setTimeout(function () { b.classList.remove('on'); }, 800);
  }
  function showNotice(t) {
    els.notice.textContent = t; els.notice.classList.add('on'); // プレイが終わるまで出しつづける（小さく）
  }
  function hideNotice() { clearTimeout(noticeTimer); els.notice.classList.remove('on'); }

  function onFound(idx) {
    if (state !== 'play' || guard) return;
    if (netOn) call('Net', 'send', { t: 'found', idx: idx });
    go('ending', idx);
  }
  function onBoom(cells, remote) {
    showBoom(); // 着弾（自分の弾も、相手の弾も）。通信へは送らない
  }
  function onFire(info) {
    if (guard || !netOn || state !== 'play' || !info) return;
    call('Net', 'send', { t: 'boom', cells: info.cells, from: info.from }); // 発射時の1回だけ
  }
  function onState(s) {
    if (guard || !netOn || state !== 'play') return;
    call('Net', 'send', { t: 'st', s: s });
  }

  // ---------------- Ending ----------------
  function fillEnding(idx) {
    idx = (idx === 1) ? 1 : 0;
    var m = map || {};
    els.endDisc.style.background = PLAYERS[idx].color;
    els.endWho.textContent = (mode === 'net' && idx !== myIndex) ? 'あいてが みつけたよ！' : 'きみが みつけたよ！';
    els.endTitle.textContent = m.title || '';
    els.endTitle.style.display = m.title ? '' : 'none';
    els.endYomi.textContent = m.reading || '';
    if (m.picture) { els.endPic.src = m.picture; els.endPic.style.display = ''; } else els.endPic.style.display = 'none';
    var c = els.confetti; c.innerHTML = '';
    var cols = ['#ff5d8f', '#ffd23f', '#4d9bff', '#59d27c', '#b388ff', '#ff9f1c'];
    for (var i = 0; i < 26; i++) {
      var s = doc.createElement('i');
      s.style.left = (i * 3.9 + Math.random() * 3) + '%';
      s.style.background = cols[i % cols.length];
      s.style.animationDuration = (3 + Math.random() * 3) + 's';
      s.style.animationDelay = (-Math.random() * 5) + 's';
      c.appendChild(s);
    }
  }

  // ---------------- ホームとモーダル ----------------
  function openModal() {
    if (modalOpen || state === 'boot') return;
    modalOpen = true; els.modal.classList.add('on');
    releaseAll();
    if (state === 'play') call('World', 'setPaused', true);
  }
  function closeModal() {
    if (!modalOpen) return;
    modalOpen = false; els.modal.classList.remove('on');
    if (state === 'play') applyPortraitPause();
  }
  function quitYes() {
    modalOpen = false; els.modal.classList.remove('on');
    stopGame(); closeNet();
    go('quit');
  }
  function applyPortraitPause() {
    if (state !== 'play') return;
    var portrait = !!(window.matchMedia && window.matchMedia('(orientation: portrait)').matches);
    call('World', 'setPaused', modalOpen || portrait);
  }

  // ---------------- キーボード（確認用） ----------------
  var KEYS = { ArrowUp: 'fwd', w: 'fwd', W: 'fwd', ArrowDown: 'back', s: 'back', S: 'back',
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'fire' };
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (state === 'boot') { e.preventDefault(); if (!e.repeat) leaveBoot(); return; }
    if (modalOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
      return;
    }
    if (state === 'play') {
      var act = KEYS[e.key];
      if (act) { e.preventDefault(); if (!e.repeat) press(act, true); return; }
      if (e.key === 'c' || e.key === 'C') { e.preventDefault(); if (!e.repeat) cycleCam(); return; }
      if (e.key === 'Escape') { e.preventDefault(); openModal(); }
      return;
    }
    if (state === 'setting' && sub === 'keypad') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keyIn(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); keyIn('del'); return; }
    }
    if (e.key === 'Enter') {
      var b = els.nav.querySelector('.nbtn');
      if (b) { e.preventDefault(); sfx('tap'); var it = navItems()[0]; if (it) it.fn(); }
    }
  }
  function onKeyUp(e) {
    var act = KEYS[e.key];
    if (act && state === 'play') { e.preventDefault(); press(act, false); }
  }

  function leaveBoot() {
    if (state !== 'boot') return;
    unlock(); sfx('tap');
    go('title');
  }

  // ---------------- 初期化 ----------------
  function init() {
    ['stage', 'nav', 'home', 'modal', 'setting', 'sethead', 'cards', 'preview', 'keypad', 'codein', 'codeshow', 'msgface', 'msgtext',
      'cam', 'notice', 'boom', 'confetti'].forEach(function (id) { els[id] = $(id); });
    els.ptTitle = $('pt-title'); els.ptYomi = $('pt-yomi');
    els.camIco = $('cam-ico'); els.camNext = $('cam-next'); els.camLabel = $('cam-label');
    els.endDisc = $('end-disc'); els.endWho = $('end-who'); els.endTitle = $('end-title'); els.endYomi = $('end-yomi'); els.endPic = $('end-pic');

    doc.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(function (n) { doc.addEventListener(n, function (e) { e.preventDefault(); }); });
    doc.addEventListener('keydown', onKeyDown);
    doc.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', releaseAll);
    if (window.matchMedia) {
      var mq = window.matchMedia('(orientation: portrait)');
      var h = function () { applyPortraitPause(); };
      if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
    }

    buildLogos();
    buildKeypad();
    renderCards(); renderPreview();
    updateCam();

    // Boot：画面のどこでも
    tap($('boot'), leaveBoot);
    tap(els.home, openModal);
    tap($('m-no'), closeModal);
    tap($('m-yes'), quitYes);
    els.modal.addEventListener('pointerdown', stopEv);
    els.modal.addEventListener('pointerup', stopEv);
    els.modal.addEventListener('click', stopEv);
    tap($('back'), backFromSetting);
    tap($('c-host'), startHost);
    tap($('c-join'), startJoin);
    tap(els.cam, cycleCam);
    var ctls = doc.querySelectorAll('.ctl[data-act]');
    for (var i = 0; i < ctls.length; i++) hold(ctls[i], ctls[i].getAttribute('data-act'));

    call('World', 'init', $('worldbox'));
    call('World', 'on', 'found', onFound);
    call('World', 'on', 'boom', onBoom);
    call('World', 'on', 'fire', onFire);
    call('World', 'on', 'cam', function (top) { doc.body.classList.toggle('camtop', !!top); });
    call('World', 'on', 'state', onState);
    call('Net', 'on', 'open', onNetOpen);
    call('Net', 'on', 'data', onNetData);
    call('Net', 'on', 'close', onNetClose);

    state = 'boot'; doc.body.setAttribute('data-state', 'boot');
    renderNav();
  }

  window.App = {
    go: function (name) { if (['boot', 'title', 'setting', 'play', 'ending', 'quit'].indexOf(name) >= 0) go(name); },
    get state() { return state; }
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
