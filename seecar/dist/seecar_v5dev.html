<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>見つめて見つけてほシーカー（SEE-CAR）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* 見つめて見つけてほシーカー style.css  寸法は #stage（16:9）を基準に cqmin で指定 */
*{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:100vh;height:100dvh;width:100%;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP","IPAGothic",system-ui,sans-serif;font-weight:800;color:#12327a}
#app{position:fixed;inset:0;height:100vh;height:100dvh;background:#000}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;outline:none}
svg{display:block}

#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.7778vh);height:min(100vh,56.25vw);
  width:min(100vw,177.7778dvh);height:min(100dvh,56.25vw);
  container-type:size;overflow:hidden;background:#bfe6ff}

/* ---------- 背景（クレヨンと紙） ---------- */
#bg{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 30% 40% at 8% 88%,rgba(255,120,150,.40),transparent 70%),
    radial-gradient(ellipse 28% 36% at 95% 85%,rgba(255,200,60,.45),transparent 70%),
    radial-gradient(ellipse 26% 30% at 70% 98%,rgba(120,210,140,.40),transparent 70%),
    radial-gradient(ellipse 24% 30% at 4% 12%,rgba(190,150,255,.35),transparent 70%),
    repeating-linear-gradient(112deg,rgba(255,255,255,0) 0 .9cqmin,rgba(255,255,255,.22) .9cqmin 1.1cqmin),
    linear-gradient(#8fd3ff 0%,#c9ecff 45%,#fffaf0 78%,#fff3d6 100%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .45 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.blk{position:absolute;display:block;border:.6cqmin solid rgba(40,40,60,.55);border-radius:.8cqmin;box-shadow:.8cqmin 1cqmin 0 rgba(40,40,60,.18)}
.b1{left:-4cqmin;bottom:-4cqmin;width:34cqmin;height:20cqmin;transform:rotate(-8deg);
  background:repeating-linear-gradient(60deg,#ff6b6b 0 1.2cqmin,#ff8f8f 1.2cqmin 2.2cqmin)}
.b2{right:-5cqmin;bottom:-3cqmin;width:38cqmin;height:22cqmin;transform:rotate(6deg);
  background:repeating-linear-gradient(-55deg,#4d9bff 0 1.2cqmin,#7fb8ff 1.2cqmin 2.2cqmin)}
.b3{left:58cqmin;bottom:-9cqmin;width:30cqmin;height:16cqmin;transform:rotate(-3deg);
  background:repeating-linear-gradient(80deg,#ffd23f 0 1.2cqmin,#ffe58a 1.2cqmin 2.2cqmin)}
.tw{position:absolute;display:block;width:4cqmin;height:4cqmin;background:#ffd23f;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle 2.4s ease-in-out infinite}
.t1{left:6cqmin;top:10cqmin}.t2{right:8cqmin;top:8cqmin;width:3cqmin;height:3cqmin;animation-delay:.5s;background:#ff8fb8}
.t3{left:24cqmin;top:58cqmin;width:3cqmin;height:3cqmin;animation-delay:1s;background:#8ee0a5}
.t4{right:20cqmin;top:52cqmin;animation-delay:1.4s}.t5{left:70cqmin;top:6cqmin;width:2.4cqmin;height:2.4cqmin;animation-delay:.9s;background:#b79cff}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(18deg)}}
body[data-state=play] #bg{display:none}

#worldbox{position:absolute;inset:0;background:#6fc2ff;visibility:hidden}
#worldbox canvas{display:block;width:100%;height:100%}
body[data-state=play] #worldbox{visibility:visible}

/* ---------- 画面の切り替え ---------- */
.screen{position:absolute;inset:0;display:none}
body[data-state=boot] #boot,body[data-state=title] #title,body[data-state=setting] #setting,
body[data-state=play] #play,body[data-state=ending] #ending,body[data-state=quit] #quit{display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}

/* ---------- ロゴ ---------- */
.logo{--k:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*.6cqmin);
  filter:drop-shadow(0 calc(var(--k)*1cqmin) 0 rgba(20,40,100,.28))}
.outl{color:#1f5fd9;text-shadow:
  -.5em 0 0 #fff,.5em 0 0 #fff,0 -.5em 0 #fff,0 .5em 0 #fff,
  -.36em -.36em 0 #fff,.36em -.36em 0 #fff,-.36em .36em 0 #fff,.36em .36em 0 #fff,
  -.5em -.2em 0 #fff,.5em -.2em 0 #fff,-.5em .2em 0 #fff,.5em .2em 0 #fff,
  -.2em -.5em 0 #fff,.2em -.5em 0 #fff,-.2em .5em 0 #fff,.2em .5em 0 #fff}
.logo-top{font-size:calc(var(--k)*6.6cqmin);letter-spacing:.04em;line-height:1.1;--e:calc(var(--k)*.28cqmin);color:#1f5fd9;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff,
  calc(var(--e)*2) 0 #fff,calc(var(--e)*-2) 0 #fff,0 calc(var(--e)*2) #fff,0 calc(var(--e)*-2) #fff}
.logo-main{display:flex;align-items:center;gap:calc(var(--k)*1cqmin)}
.logo-name{font-size:calc(var(--k)*17cqmin);line-height:1;letter-spacing:.02em;font-weight:900;--e:calc(var(--k)*.55cqmin);color:#1f66e8;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff,
  calc(var(--e)*2) 0 #fff,calc(var(--e)*-2) 0 #fff,0 calc(var(--e)*2) #fff,0 calc(var(--e)*-2) #fff,calc(var(--e)*2) calc(var(--e)*2) #fff,calc(var(--e)*-2) calc(var(--e)*2) #fff,calc(var(--e)*2) calc(var(--e)*-2) #fff,calc(var(--e)*-2) calc(var(--e)*-2) #fff,
  0 calc(var(--e)*3.4) 0 #0e2f7a}
.logo-en{font-size:calc(var(--k)*5.6cqmin);letter-spacing:.14em;line-height:1;padding:calc(var(--k)*.8cqmin) calc(var(--k)*5cqmin);border-radius:calc(var(--k)*5cqmin);
  background:linear-gradient(#2a5fd0,#143c9c);color:#ffe45e;border:calc(var(--k)*.6cqmin) solid #fff}
.star{position:relative;width:calc(var(--k)*29cqmin);height:calc(var(--k)*29cqmin);flex:none;animation:bob 2.6s ease-in-out infinite}
.star i{position:absolute;inset:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star .s1{background:#fff}
.star .s2{transform:scale(.93);background:conic-gradient(#ff5d8f,#ffb703,#8ecae6,#7bd389,#b388ff,#ff5d8f)}
.star .s3{transform:scale(.8);background:radial-gradient(circle at 40% 30%,#fff6a8,#ffd23f 55%,#ffae00)}
.star b{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);text-align:center;font-size:calc(var(--k)*14cqmin);line-height:1;font-weight:900;color:#1f5fd9;--e:calc(var(--k)*.4cqmin);
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-1.4cqmin) rotate(3deg)}}
.titlelogo{position:absolute;left:0;right:0;top:9cqmin;display:flex;justify-content:center}

/* ---------- Boot / Quit ---------- */
.touchme{position:relative;font-size:7.4cqmin;color:#12327a;background:rgba(255,255,255,.9);padding:2cqmin 7cqmin;border-radius:9cqmin;border:.7cqmin solid #fff;box-shadow:0 1cqmin 0 rgba(20,40,100,.25);animation:blink 1.4s ease-in-out infinite}
.touchme .ring{position:absolute;right:-5cqmin;bottom:-6cqmin;width:11cqmin;height:11cqmin;border-radius:50%;background:rgba(255,93,143,.85);border:.8cqmin solid #fff;animation:pulse 1.4s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.bye{font-size:12cqmin;font-weight:900;color:#1f5fd9;background:rgba(255,255,255,.92);padding:2cqmin 8cqmin;border-radius:10cqmin;border:.8cqmin solid #fff;box-shadow:0 1.2cqmin 0 rgba(20,40,100,.25)}
body[data-state=quit] #quit .center{padding-bottom:14cqmin}

/* ---------- 進行ボタン #nav（全画面で同じ大きさ・同じホップ） ---------- */
#nav{position:absolute;left:0;right:0;bottom:4cqmin;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:5cqmin;z-index:50;pointer-events:none}
.brk{flex-basis:100%;height:0}
.nbtn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:2cqmin;width:64cqmin;height:16cqmin;border-radius:8cqmin;
  font-size:6.4cqmin;line-height:1;white-space:nowrap;border:.8cqmin solid #fff;box-shadow:0 1.3cqmin 0 rgba(20,40,100,.3);animation:hop 1.15s ease-in-out infinite}
.nbtn i{display:block;width:8cqmin;height:8cqmin;flex:none}
.nbtn i svg{width:100%;height:100%;fill:currentColor}
.nbtn.primary{background:linear-gradient(#ffe86b,#ffb703);color:#3d2800}
.nbtn.secondary{background:linear-gradient(#8fd0ff,#3b8df0);color:#fff;text-shadow:0 .3cqmin 0 rgba(0,40,120,.5);animation:none} /* 跳ねるのは次に押す1つ（primary）だけ */
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2cqmin)}60%{transform:translateY(0)}}
.nbtn.down,.ctl.down,.card.down,.bigcard.down,.key.down,.backbtn.down,#home.down,#cam.down{animation:none;transform:translateY(.7cqmin) scale(.95);filter:brightness(.92)}

/* ---------- ホーム（最前面） ---------- */
#home{position:absolute;z-index:100;top:max(2cqmin,env(safe-area-inset-top));right:max(2.4cqmin,env(safe-area-inset-right));
  width:12cqmin;height:12cqmin;border-radius:50%;background:#fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.3);border:.5cqmin solid #d7e3f7;display:none;align-items:center;justify-content:center}
#home svg{width:7.4cqmin;height:7.4cqmin;fill:#1f5fd9}
#home{display:flex}

/* ---------- モーダル ---------- */
#modal{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,30,70,.6)}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:5cqmin;padding:6cqmin 6cqmin 7cqmin;display:flex;flex-direction:column;align-items:center;gap:6cqmin;border:.9cqmin solid #ffd23f;box-shadow:0 2cqmin 0 rgba(0,0,0,.25)}
.mtitle{font-size:9cqmin;color:#12327a;font-weight:900}
.mbtns{display:flex;gap:5cqmin}
.mbtns .nbtn{width:44cqmin}
#m-no{background:linear-gradient(#9af0a8,#2fbf5a);color:#07431c}
#m-yes{animation:none;background:linear-gradient(#c9d6ea,#8fa4c8);color:#fff}

/* ---------- 縦持ち警告 ---------- */
#portrait{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8vmin;background:#12327a;color:#fff}
.phone{width:18vmin;height:30vmin;border:1.6vmin solid #fff;border-radius:3vmin;background:#ffd23f;animation:rot 2.4s ease-in-out infinite}
.ptext{font-size:7.6vmin;font-weight:900;text-align:center;line-height:1.4;padding:0 6vmin}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media screen and (orientation: portrait){#portrait{display:flex}}

/* ---------- Setting ---------- */
.head{position:absolute;top:3cqmin;left:50%;transform:translateX(-50%);font-size:6.4cqmin;white-space:nowrap;background:rgba(255,255,255,.92);color:#12327a;
  padding:1.4cqmin 6cqmin;border-radius:8cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.2)}
.backbtn{position:absolute;left:3cqmin;top:3cqmin;height:12cqmin;min-width:25cqmin;padding:0 3cqmin;display:flex;align-items:center;justify-content:center;gap:1.4cqmin;
  background:#fff;border-radius:6cqmin;font-size:4.8cqmin;color:#1f5fd9;border:.5cqmin solid #d7e3f7;box-shadow:0 .8cqmin 0 rgba(20,40,100,.25)}
.backbtn i{width:0;height:0;border-top:2.4cqmin solid transparent;border-bottom:2.4cqmin solid transparent;border-right:3.6cqmin solid #1f5fd9}
.pane{position:absolute;left:6cqmin;right:6cqmin;top:19cqmin;bottom:23cqmin;display:none}
#setting[data-sub=choice] .sub-choice,#setting[data-sub=code] .sub-code,#setting[data-sub=pick] .sub-pick,
#setting[data-sub=keypad] .sub-keypad,#setting[data-sub=msg] .sub-msg,#setting[data-sub=error] .sub-msg{display:flex}
.sub-choice{align-items:center;justify-content:center;gap:9cqmin}
.bigcard{width:62cqmin;height:50cqmin;border-radius:5cqmin;background:#fff;border:.9cqmin solid #fff;box-shadow:0 1.4cqmin 0 rgba(20,40,100,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqmin;font-size:7.4cqmin;color:#1f5fd9}
.bigcard svg{width:24cqmin;height:24cqmin}
#c-host{background:linear-gradient(#fff,#fff3b8)}#c-join{background:linear-gradient(#fff,#d6ecff)}

.sub-code{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.digits{display:flex;gap:3cqmin;justify-content:center}
.digits b{width:23cqmin;height:30cqmin;border-radius:3cqmin;background:#fff;border:.8cqmin solid #ffb703;box-shadow:0 1cqmin 0 rgba(20,40,100,.25);display:flex;align-items:center;justify-content:center;font-size:21cqmin;line-height:1;color:#1f5fd9}
.digits.grid2{display:grid;grid-template-columns:repeat(2,23cqmin);gap:3cqmin;align-content:center}
.digits.grid2 b{height:23cqmin;font-size:17cqmin}
.waiting{font-size:6.4cqmin;background:rgba(255,255,255,.92);padding:1.4cqmin 6cqmin;border-radius:8cqmin}
.dots i{font-style:normal;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}

.sub-pick{gap:4cqmin;align-items:stretch}
.card{position:relative;border-radius:4cqmin;background:#fff;border:.8cqmin solid #fff;box-shadow:0 1.1cqmin 0 rgba(20,40,100,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqmin;overflow:hidden;color:#1f5fd9}
.card .kan{font-size:8.4cqmin;line-height:1.1;font-weight:900;letter-spacing:.04em;color:#12327a}
.card .yomi{font-size:3.5cqmin;color:#4a6aa8}
.card.on{background:linear-gradient(#fff9c4,#ffe45e);border-color:#ff9f1c;box-shadow:0 1.1cqmin 0 rgba(255,140,0,.5)}
.card.file{background:linear-gradient(#fff,#e3f3ff)}
.card.file svg{width:11cqmin;height:11cqmin}
.card{text-align:center}
.card.file{padding:0 1cqmin}
.card.file .kan{font-size:4.2cqmin;white-space:nowrap;text-align:center;width:100%;letter-spacing:0}
.card input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.preview{flex:1;border-radius:4cqmin;background:rgba(255,255,255,.88);border:.8cqmin dashed #8fb4e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqmin;padding:2cqmin;min-width:0;overflow:hidden}
.preview img{max-width:100%;max-height:38cqmin;object-fit:contain;border-radius:1.6cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.25);background:#fff}
.preview .pt{font-size:7cqmin;line-height:1.1;color:#12327a;font-weight:900}
.preview .py{font-size:3.6cqmin;color:#4a6aa8}
.preview .hint{font-size:6cqmin;color:#4a6aa8;text-align:center;line-height:1.4}
.spin{width:10cqmin;height:10cqmin;border-radius:50%;border:1.4cqmin solid #cfe0f7;border-top-color:#ff9f1c;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sub-keypad{gap:8cqmin;align-items:center;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(3,18cqmin);grid-auto-rows:13.4cqmin;gap:1.4cqmin}
.key{border-radius:3cqmin;background:#fff;border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.28);font-size:8cqmin;color:#1f5fd9;font-weight:900;display:flex;align-items:center;justify-content:center}
.key.del{background:linear-gradient(#ffd0d8,#ff8fa6);color:#7a1230;font-size:4.8cqmin}
.key.nul{visibility:hidden}

.sub-msg{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.msgtext{font-size:6.6cqmin;line-height:1.5;text-align:center;background:rgba(255,255,255,.92);padding:2.4cqmin 7cqmin;border-radius:6cqmin;max-width:150cqmin}
.msgface svg{width:20cqmin;height:20cqmin}

/* ---------- Play ---------- */
#play{pointer-events:none}
#play>*{pointer-events:auto}
#maptag{position:absolute;top:2cqmin;left:max(2cqmin,env(safe-area-inset-left));display:flex;align-items:baseline;gap:1.4cqmin;background:rgba(255,255,255,.88);border-radius:4cqmin;padding:.5cqmin 3cqmin;border:.4cqmin solid #fff;box-shadow:0 .5cqmin 0 rgba(20,40,100,.25);white-space:nowrap;pointer-events:none;transition:opacity .4s}
#maptag b{font-size:4.4cqmin;color:#12327a;font-weight:900}#maptag small{font-size:2.4cqmin;color:#4a6aa8}
body.camtop #maptag{opacity:0} /* 真上のときは地図の上はしと戦車をかくさない */
#notice{position:absolute;top:10.5cqmin;left:max(2cqmin,env(safe-area-inset-left));display:none;font-size:3.6cqmin;background:#fff5d6;color:#7a3b00;border:.5cqmin solid #ffb703;border-radius:4cqmin;padding:.7cqmin 3cqmin;white-space:nowrap;pointer-events:none;transition:all .5s}
/* 大きく出して次にすることを伝え、数秒あとに小さくして出しつづける */
#notice.big{top:34cqmin;left:50%;transform:translateX(-50%);font-size:6.4cqmin;font-weight:900;padding:2cqmin 5cqmin;border-width:.8cqmin;border-radius:6cqmin;box-shadow:0 1cqmin 0 rgba(122,59,0,.25);text-align:center;line-height:1.35;white-space:normal;width:max-content;max-width:84cqmin}
#notice.big.on{animation:pop2 .35s ease-out}
#notice.on{display:block;animation:pop2 .35s ease-out}
.ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqmin;color:#12327a}
#dpad{position:absolute;left:max(3cqmin,env(safe-area-inset-left));bottom:3cqmin;display:grid;grid-template-columns:repeat(3,15cqmin);grid-template-rows:repeat(3,15cqmin);gap:1cqmin;pointer-events:none}
#dpad .ctl{pointer-events:auto;border-radius:3.4cqmin;background:rgba(255,255,255,.86);border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.35)}
#dpad .ctl svg{width:6.6cqmin;height:6.6cqmin;fill:#1f5fd9}
#dpad .ctl span{font-size:3.2cqmin;line-height:1}
#dpad [data-act=fwd]{grid-column:2;grid-row:1}#dpad [data-act=left]{grid-column:1;grid-row:2}
#dpad [data-act=right]{grid-column:3;grid-row:2}#dpad [data-act=back]{grid-column:2;grid-row:3}
#dpad .ctl.down{background:#ffe45e}
#fire{position:absolute;right:max(3cqmin,env(safe-area-inset-right));bottom:3cqmin;width:31cqmin;height:31cqmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a6b,#f0451c 70%);border:.9cqmin solid #fff;box-shadow:0 1.4cqmin 0 rgba(120,20,0,.45);color:#fff}
#fire svg{width:16cqmin;height:16cqmin}
#fire span{font-size:5.6cqmin;line-height:1;text-shadow:0 .3cqmin 0 rgba(100,20,0,.6)}
#fire.down{background:radial-gradient(circle at 35% 30%,#ffc09a,#ff6b3d 70%)}
#cam{position:absolute;right:max(3cqmin,env(safe-area-inset-right));top:23cqmin;width:30cqmin;height:20cqmin;border-radius:4cqmin;background:rgba(255,255,255,.92);border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqmin;color:#12327a}

#cam i.next{width:8cqmin;height:8cqmin;opacity:.8;border:.45cqmin dashed #8fb4e8;border-radius:2cqmin;padding:.3cqmin}
#cam .arr{display:block;width:0;height:0;border-top:2cqmin solid transparent;border-bottom:2cqmin solid transparent;border-left:3cqmin solid #ff9f1c;flex:none}
#cam span#cam-label{font-size:4.4cqmin;line-height:1;font-weight:900}
#boom{position:absolute;left:50%;top:30%;z-index:60;pointer-events:none;display:none;font-size:20cqmin;font-weight:900;color:#ffd23f;white-space:nowrap;--e:.5cqmin;
  text-shadow:calc(var(--e)*-1) 0 #7a1c00,var(--e) 0 #7a1c00,0 calc(var(--e)*-1) #7a1c00,0 var(--e) #7a1c00,calc(var(--e)*2) calc(var(--e)*2) #7a1c00,calc(var(--e)*-2) calc(var(--e)*-2) #7a1c00,calc(var(--e)*-2) calc(var(--e)*2) #7a1c00,calc(var(--e)*2) calc(var(--e)*-2) #7a1c00,0 1.6cqmin 0 #7a1c00,0 0 3cqmin #ff6a00}
#boom.on{display:block;animation:boom .75s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3) rotate(-14deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.25) rotate(-6deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-60%) scale(1.05) rotate(-6deg);opacity:0}}
@keyframes pop2{0%{transform:scale(.6);transform-origin:left top}100%{transform:scale(1);transform-origin:left top}}
@keyframes pop{0%{transform:translateX(-50%) scale(.6)}100%{transform:translateX(-50%) scale(1)}}

/* ---------- Ending ---------- */
.endleft{position:absolute;left:7cqmin;top:9cqmin;width:70cqmin;display:flex;flex-direction:column;align-items:center;gap:2.6cqmin}
.found{font-size:17cqmin;font-weight:900;line-height:1.05;color:#ff6a00;white-space:nowrap;--e:.55cqmin;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*2) calc(var(--e)*2) #fff,calc(var(--e)*-2) calc(var(--e)*-2) #fff,calc(var(--e)*-2) calc(var(--e)*2) #fff,calc(var(--e)*2) calc(var(--e)*-2) #fff,0 1.4cqmin 0 #a63d00;animation:bob 2s ease-in-out infinite}
.who{display:flex;align-items:center;gap:2.4cqmin;background:rgba(255,255,255,.92);padding:1.2cqmin 5cqmin 1.2cqmin 2.4cqmin;border-radius:7cqmin;font-size:5.4cqmin}
.who i{width:8cqmin;height:8cqmin;border-radius:50%;border:.7cqmin solid #fff;box-shadow:0 0 0 .5cqmin #12327a}
.endtitle{font-size:11cqmin;font-weight:900;color:#12327a;line-height:1.1;margin-top:2cqmin;background:rgba(255,255,255,.9);padding:1cqmin 4cqmin;border-radius:4cqmin}
.endyomi{font-size:4.6cqmin;color:#4a6aa8}
.endpic{position:absolute;left:82cqmin;right:6cqmin;top:7cqmin;bottom:25cqmin;display:flex;align-items:center;justify-content:center}
.endpic img{max-width:100%;max-height:100%;object-fit:contain;box-sizing:border-box;background:#fff;padding:1.6cqmin;border-radius:2cqmin;border:.6cqmin solid #e4d9bf;box-shadow:0 1.4cqmin 0 rgba(20,40,100,.3);transform:rotate(1.2deg)}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-6cqmin;width:2cqmin;height:3.2cqmin;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112cqmin) rotate(540deg)}}
.endpic img.pix{image-rendering:crisp-edges;image-rendering:pixelated} /* 小さい絵は拡大しても画素をくっきり */

/* =====================================================================
   第2期：タイトル・難しさ・地図えらび・せってい・結果を おなじデザインに そろえる
   ぜんぶ「白ふち＋ふっくらした影＋つやのある色」。押せる物は 画面の短いほう(=100cqmin)の 8% 以上
   ===================================================================== */
.head{background:linear-gradient(#fff,#fff3c4);color:#12327a;font-size:6.2cqmin;border:.7cqmin solid #fff;box-shadow:0 1cqmin 0 rgba(20,40,100,.28),0 0 0 .5cqmin #ffd23f;padding:1.2cqmin 7cqmin}
.backbtn{height:12cqmin;border:.7cqmin solid #fff;background:linear-gradient(#fff,#e6f1ff);box-shadow:0 1cqmin 0 rgba(20,40,100,.3)}

/* ---- タイトル：主ボタン「はじめる」だけ大きく・はずむ ---- */
body[data-state=title] #nav{gap:2.6cqmin 3cqmin;padding:0 4cqmin;bottom:3.6cqmin}
.nbtn small{display:block;font-size:3.2cqmin;font-weight:800;opacity:.85;letter-spacing:.04em}
.nbtn.hero{display:grid;grid-template-columns:11cqmin auto;grid-template-rows:auto auto;column-gap:2.4cqmin;row-gap:.4cqmin;align-content:center;justify-content:center;
  width:96cqmin;height:20cqmin;border-radius:10cqmin;font-size:9.6cqmin;text-align:left;border-width:1cqmin;box-shadow:0 1.6cqmin 0 rgba(150,80,0,.45),0 0 0 .6cqmin #ffb703}
.nbtn.hero i{grid-row:1/3;width:11cqmin;height:11cqmin;align-self:center}
.nbtn.hero span{grid-column:2;align-self:end;line-height:1}
.nbtn.hero small{grid-column:2;align-self:start;font-size:3.4cqmin}
.nbtn.sub{width:auto;height:12.4cqmin;padding:0 4.4cqmin;gap:1.8cqmin;font-size:4.7cqmin;border-radius:6.4cqmin;border-width:.7cqmin;box-shadow:0 1cqmin 0 rgba(10,40,120,.4)}
.nbtn.sub i{width:6.2cqmin;height:6.2cqmin}
.nbtn.secondary{background:linear-gradient(#a6dcff,#3b8df0 60%,#2f78dc)}
.recchip{position:absolute;left:3cqmin;top:3cqmin;display:flex;align-items:center;gap:1.4cqmin;background:rgba(255,255,255,.94);border:.5cqmin solid #fff;box-shadow:0 .7cqmin 0 rgba(20,40,100,.25);border-radius:5cqmin;padding:.6cqmin 2.6cqmin .6cqmin 1.2cqmin;font-size:3.4cqmin;color:#12327a;white-space:nowrap}
.recchip b,.endrec b{font-size:3.6cqmin;background:#ffd23f;border-radius:3cqmin;padding:.2cqmin 1.6cqmin}
.rc-ico{display:block;width:5.6cqmin;height:5.6cqmin}.rc-ico svg{width:100%;height:100%}
.rc-n{font-weight:900}

/* ---- ペインの高さ（下に進行ボタンが無い画面は 下まで使う） ---- */
#setting[data-sub=level] .pane,#setting[data-sub=opts] .pane{bottom:6cqmin}
#setting[data-sub=level] .sub-level{display:flex}
#setting[data-sub=opts] .sub-opts{display:grid}

/* ---- 難しさえらび ---- */
.sub-level{align-items:center;justify-content:center;gap:5cqmin}
.lvcard{flex:1;max-width:50cqmin;height:68cqmin;border-radius:5cqmin;background:linear-gradient(#fff,#eef6ff);border:.9cqmin solid #fff;box-shadow:0 1.4cqmin 0 rgba(20,40,100,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqmin;color:#12327a}
.lvcard .lvpic{display:block;width:26cqmin;height:26cqmin;border-radius:50%;background:#fff6cf;border:.7cqmin solid #fff;box-shadow:inset 0 0 0 .5cqmin #ffe58a;padding:2.4cqmin}
.lvcard .lvpic svg{width:100%;height:100%}
.lvcard b{font-size:8cqmin;line-height:1.1;font-weight:900}
.lvcard small{font-size:3.4cqmin;color:#4a6aa8;font-weight:800}
.lvcard em{font-style:normal;font-size:3.8cqmin;background:#e8f1ff;border-radius:3cqmin;padding:.6cqmin 2.4cqmin;margin-top:.6cqmin;color:#12327a}
.lvcard.on{background:linear-gradient(#fff9c4,#ffe45e);border-color:#fff;box-shadow:0 1.4cqmin 0 rgba(255,140,0,.55),0 0 0 .8cqmin #ff9f1c}
.lvcard.on em{background:#fff}

/* ---- せってい ---- */
.sub-opts{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4cqmin}
.setcard{border-radius:4.6cqmin;background:linear-gradient(#fff,#f1f7ff);border:.9cqmin solid #fff;box-shadow:0 1.3cqmin 0 rgba(20,40,100,.28);padding:2.4cqmin 3.4cqmin;display:flex;flex-direction:column;justify-content:space-between;gap:1.2cqmin;min-height:0;color:#12327a}
.sc-head{display:flex;align-items:center;gap:2cqmin;font-size:5.2cqmin;line-height:1.1;font-weight:900;white-space:nowrap}
.sc-ico{display:block;width:8.4cqmin;height:8.4cqmin;flex:none}.sc-ico svg{width:100%;height:100%}
.seg{display:flex;gap:2cqmin}
.seg button{flex:1;height:11.6cqmin;border-radius:6cqmin;background:#fff;border:.6cqmin solid #c9d9f2;box-shadow:0 .8cqmin 0 rgba(20,40,100,.22);font-size:4.8cqmin;color:#4a6aa8;display:flex;align-items:center;justify-content:center;gap:1cqmin}
.seg button.on{background:linear-gradient(#ffe86b,#ffb703);border-color:#fff;color:#3d2800;box-shadow:0 .8cqmin 0 rgba(150,80,0,.4),0 0 0 .6cqmin #ff9f1c}
.seg button.on::before{content:"";width:2.2cqmin;height:3.8cqmin;border:solid #3d2800;border-width:0 .8cqmin .8cqmin 0;transform:rotate(45deg) translate(-.3cqmin,-.5cqmin);margin-right:.8cqmin}
.seg button.danger{background:linear-gradient(#ffd0d8,#ff8fa6);border-color:#fff;color:#7a1230;box-shadow:0 .8cqmin 0 rgba(120,20,50,.35)}
.sc-hint{font-size:3.3cqmin;color:#4a6aa8;line-height:1.2;min-height:3.6cqmin;white-space:nowrap}

/* ---- 地図えらび：よじじゅくご／イラスト ---- */
.sub-pick{gap:3.4cqmin}
.maps{flex:3;display:flex;flex-direction:column;gap:1.6cqmin;min-width:0}
.grp{flex:1;display:flex;flex-direction:column;gap:.8cqmin;min-height:0}
.gl{font-size:3.8cqmin;line-height:1;color:#12327a;align-self:flex-start;background:rgba(255,255,255,.9);border-radius:3cqmin;padding:.7cqmin 2.6cqmin;border:.4cqmin solid #fff;box-shadow:0 .5cqmin 0 rgba(20,40,100,.2)}
.grp.yoji .gl{background:#222;color:#fff}.grp.illust .gl{background:#ff9f1c;color:#fff}
.grp .row{flex:1;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:1.8cqmin;min-height:0}
.card{padding:0 .4cqmin}
.card .ic{display:block;width:9cqmin;height:9cqmin}.card .ic svg,.card .ic img{width:100%;height:100%;object-fit:contain;display:block}
.card.illust{background:linear-gradient(#fff,#fffdf3)}
.card.yoji .kan{font-size:5.2cqmin;letter-spacing:0;white-space:nowrap}
.card.illust .kan{font-size:4.8cqmin;white-space:nowrap}
.maps.dense .card.yoji .kan{font-size:4.3cqmin}.maps.dense .card.illust .kan{font-size:3.8cqmin}.maps.dense .card .ic{width:8cqmin;height:8cqmin}
.card .yomi{font-size:2.2cqmin;letter-spacing:-.02em;white-space:nowrap}
.card.file{flex:none;height:10.4cqmin;flex-direction:row;gap:1.6cqmin;border-radius:5.2cqmin;background:linear-gradient(#fff,#d8ecff);padding:0 2cqmin}
.card.file .ic{width:6.4cqmin;height:6.4cqmin}
.card.file .kan{width:auto;font-size:4.6cqmin;color:#1f5fd9}
.card.file .bw{font-size:3cqmin;background:#222;color:#fff;border-radius:2cqmin;padding:.3cqmin 1.4cqmin}
.card.on{border-color:#fff;box-shadow:0 1.1cqmin 0 rgba(255,140,0,.55),0 0 0 .7cqmin #ff9f1c}
.preview{flex:1;padding:1.6cqmin;gap:1cqmin}
.preview img{max-height:30cqmin}
.preview .pt{font-size:5.8cqmin}.preview .py{font-size:3.2cqmin}.preview .hint{font-size:4.6cqmin}

/* ---- プレイ：スワイプ ---- */
#swipe{position:absolute;inset:0;background:transparent}
#tip{position:absolute;left:50%;bottom:3cqmin;transform:translateX(-50%);display:none;align-items:center;gap:2cqmin;background:rgba(255,255,255,.93);border:.5cqmin solid #fff;border-radius:6cqmin;padding:1cqmin 3.6cqmin 1cqmin 2.4cqmin;font-size:3.4cqmin;color:#12327a;white-space:nowrap;pointer-events:none;box-shadow:0 .7cqmin 0 rgba(20,40,100,.28)}
#tip.on{display:flex;animation:tipin .4s ease-out}#tip svg{width:9cqmin;height:4.5cqmin}
@keyframes tipin{from{opacity:0;transform:translateX(-50%) translateY(2cqmin)}to{opacity:1;transform:translateX(-50%)}}
#flash{position:absolute;top:50%;width:20cqmin;height:20cqmin;margin-top:-10cqmin;border-radius:50%;background:rgba(31,95,217,.55);border:.8cqmin solid rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;pointer-events:none}
#flash svg{width:12cqmin;height:12cqmin}
#flash.l{left:14cqmin}#flash.r{right:14cqmin}#flash.r svg{transform:scaleX(-1)}
#flash.on{display:flex;animation:fl .5s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
/* やじるしボタンを消すと「まえ」だけ のこる（ひとつだけ大きく・おしつづけで すすむ） */
body.noarrows #dpad{grid-template-columns:24cqmin;grid-template-rows:24cqmin}
body.noarrows #dpad .ctl:not([data-act=fwd]){display:none}
body.noarrows #dpad [data-act=fwd]{grid-column:1;grid-row:1;border-radius:50%}
body.noarrows #dpad .ctl svg{width:10cqmin;height:10cqmin}body.noarrows #dpad .ctl span{font-size:4.6cqmin}

/* ---- 結果：かち！／まけ… ---- */
.endrec{display:flex;align-items:center;gap:1.4cqmin;background:rgba(255,255,255,.94);border:.5cqmin solid #fff;box-shadow:0 .7cqmin 0 rgba(20,40,100,.25);border-radius:5cqmin;padding:.8cqmin 3cqmin .8cqmin 1.4cqmin;font-size:4.6cqmin;color:#12327a}
.endrec .rc-ico{width:7cqmin;height:7cqmin}.endrec b{font-size:4.4cqmin}
#ending[data-res=win] .found{color:#ff6a00}
#ending[data-res=lose] .found{color:#3b6fd9;text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*2) calc(var(--e)*2) #fff,calc(var(--e)*-2) calc(var(--e)*-2) #fff,calc(var(--e)*-2) calc(var(--e)*2) #fff,calc(var(--e)*2) calc(var(--e)*-2) #fff,0 1.4cqmin 0 #123a8a;animation:none}
#ending[data-res=lose] #confetti{opacity:.25}
.mbtns .nbtn{width:50cqmin}
.mtitle{font-size:7.6cqmin;text-align:center}
/* 結果：左の列をすっきり（文は1行、読みがなは進行ボタンに かからない） */
.endleft{top:6cqmin;width:76cqmin;gap:2cqmin}
.found{font-size:16cqmin}
.who{font-size:4.4cqmin;white-space:nowrap;padding:1cqmin 4cqmin 1cqmin 2cqmin}
.endtitle{font-size:9.6cqmin;margin-top:.6cqmin}
.endyomi{font-size:3.8cqmin;margin-top:-1cqmin}
.endpic{left:86cqmin}

</style>

<body data-state="boot">

          <svg viewBox="0 0 64 64"><path d="M32 6 6 30h8v26h36V30h8z" fill="#ffd23f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M32 22l3.5 7.5 8 1-6 5.5 1.7 8L32 39.800 24.800 44l1.700-8-6-5.500 8-1z" fill="#ff5d8f"/></svg>
          <span>へやを つくる</span>
        </button>
        <button type="button" class="bigcard" id="c-join" tabindex="-1">
          <svg viewBox="0 0 64 64"><rect x="14" y="8" width="36" height="50" rx="4" fill="#7cc4ff" stroke="#fff" stroke-width="3"/><rect x="20" y="14" width="24" height="38" rx="2" fill="#3b8df0"/><circle cx="39" cy="34" r="3" fill="#ffd23f"/><path d="M2 34h14m-5-6 6 6-6 6" stroke="#ff5d8f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

    s.lineTo(x0 + iw, y0 + ih - cr); s.quadraticCurveTo(x0 + iw, y0 + ih, x0 + iw - cr, y0 + ih);
    s.lineTo(x0 + cr, y0 + ih); s.quadraticCurveTo(x0, y0 + ih, x0, y0 + ih - cr);
    s.lineTo(x0, y0 + cr); s.quadraticCurveTo(x0, y0, x0 + cr, y0);
    var geo = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 4 });

  }

    // 俯瞰のための大きな目じるし（光の輪）
    var far = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.star, color: 0xff3fa8, transparent: true, depthWrite: false, depthTest: false }));
    far.renderOrder = 9; far.visible = false; g.add(far);
    // 目じるしの星：壁のむこうでも見える（おいかけ・1人称のとき、柱の上のほうで光る）
    var beacon = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.star, color: 0xff3fa8, transparent: true, depthWrite: false, depthTest: false }));
    beacon.renderOrder = 9; beacon.position.y = 4.2; g.add(beacon);
    var beaconGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.soft, color: 0xffffff, transparent: true, depthWrite: false, depthTest: false, opacity: 0.9 }));
    beaconGlow.renderOrder = 8; beaconGlow.position.y = 4.2; g.add(beaconGlow);
    add(g);
    S.treasure = { group: g, gem: gem, glow: glow, sparks: sparks, far: far, beacon: beacon, beaconGlow: beaconGlow, beam: beam, x: t.x, z: t.z, celebrate: 0 };
    S.gemLight.position.set(t.x + 0.5, g.position.y + 1.4, t.z + 0.5);
    S.gemLight.intensity = 2.2;
    L.dispose.push(gemGeo, gemMat, glowMat, beamGeo, beamMat, beam2Geo, beam2Mat, starMat, far.material, beacon.material, beaconGlow.material);
  }

  function updateTreasure(dt) {
    var tr = S.treasure; if (!tr) return;
    var t = S.time;
    tr.gem.rotation.y += dt * 1.6;
    var c = tr.celebrate; if (c > 0) tr.celebrate = Math.max(0, c - dt);
    tr.gem.position.y = GEM_Y + Math.sin(t * 2.4) * 0.14 + (c > 0 ? Math.sin((1.5 - c) * 6) * 0.5 + 0.4 : 0);
    var pulse = 3.6 + Math.sin(t * 4) * 0.45 + (c > 0 ? 2.5 : 0);
    tr.glow.position.y = tr.gem.position.y;
    tr.glow.scale.set(pulse, pulse, 1);
    S.gemLight.intensity = 1.6 + Math.sin(t * 4) * 0.4;
    for (var i = 0; i < tr.sparks.length; i++) {
      var a = t * 1.3 + i / tr.sparks.length * Math.PI * 2;
      var r = 1.0 + (c > 0 ? 0.8 : 0);
      tr.sparks[i].position.set(Math.cos(a) * r, GEM_Y + Math.sin(t * 3 + i) * 0.6, Math.sin(a) * r);
      var ss = 0.3 + 0.22 * Math.abs(Math.sin(t * 5 + i * 1.7));
      tr.sparks[i].scale.set(ss, ss, 1);
    }
    // 遠くからでも見える光（カメラが高いほど大きく）
    var camH = S.camera.position.y;
    // 目じるしの星：遠いほど大きく（画面の上でいつも同じくらいの大きさ）。近くに来たら消える
    var gp = tr.group.position, dcam = Math.hypot(S.camera.position.x - gp.x, S.camera.position.z - gp.z);
    var bv = camH <= 7 && dcam > 5;
    tr.beacon.visible = tr.beaconGlow.visible = bv;
    if (bv) {
      var bs = clamp(dcam * 0.055, 0.8, 3.2) * (1 + 0.12 * Math.sin(t * 5)), bo = clamp((dcam - 5) / 3, 0, 1);
      tr.beacon.scale.set(bs, bs, 1); tr.beacon.material.rotation = Math.sin(t * 2) * 0.3; tr.beacon.material.opacity = bo;
      tr.beaconGlow.scale.set(bs * 1.5, bs * 1.5, 1); tr.beaconGlow.material.opacity = 0.8 * bo;
      tr.beacon.position.y = tr.beaconGlow.position.y = 3.6 + clamp(dcam * 0.04, 0, 2) + Math.sin(t * 2.4) * 0.15;
    }
    tr.far.visible = camH > 7;
    if (tr.far.visible) { var fs = camH * 0.11 * (1 + 0.12 * Math.sin(t * 5)); tr.far.material.rotation = Math.sin(t * 2) * 0.3; tr.far.scale.set(fs, fs, 1); tr.far.position.y = 0.8; tr.far.material.opacity = clamp((camH - 7) / 6, 0, 1); }
  }

  // ---------- 破壊 ----------
  function destroyCells(cells, withFx) {
    var L = S.level; if (!L) return [];
    var done = [], zero = new THREE.Matrix4().makeScale(0, 0, 0), c = new THREE.Color(), changed = false;
    var cx = 0, cz = 0, cy = 0, cnt = 0;
    for (var k = 0; k < cells.length; k++) {
      var x = cells[k][0] | 0, z = cells[k][1] | 0;
      if (!inMap(x, z)) continue;
      var i = idx(x, z), hh = S.heights[i];
      if (hh > 0) done.push([x, z]); // 実際に壊したマスだけ
      cx += x + 0.5; cz += z + 0.5; cy = Math.max(cy, vis(hh)); cnt++;
      if (withFx) {
        cellColor(i, c);
        if (hh > 0) {
          blockColor(c, hh); // 積み木と同じ色の破片
          spawnDebris(x + 0.5, vis(hh) * 0.5, z + 0.5, c, Math.min(110, 34 + hh * 8), 1);
          spawnStars(x + 0.5, Math.max(0.4, vis(hh)), z + 0.5, 8);
          for (var p = 0; p < 3; p++) spawnPuff(x + 0.5 + rand(-0.4, 0.4), vis(hh) * rand(0.2, 0.9) + 0.1, z + 0.5 + rand(-0.4, 0.4), { color: 0xdedad2, vx: rand(-1, 1), vy: rand(0.8, 2), vz: rand(-1, 1), s0: 0.6, s1: 2.4, life: 1.4, a: 0.85 });
        } else {
          spawnDebris(x + 0.5, 0.05, z + 0.5, c.lerp(new THREE.Color(0x9a9080), 0.2), 8, 0.6);
          spawnPuff(x + 0.5, 0.3, z + 0.5, { color: 0xe8e2d6, vy: 1, s0: 0.5, s1: 1.8, life: 1 });
        }
      }
      if (hh > 0) {
        S.heights[i] = 0; S.destroyed[i] = 1; changed = true;
        var inst = L.cellToInst[i];
        if (inst >= 0) L.terrain.setMatrixAt(inst, zero); // そのマスの行列だけ更新
      }
    }
    if (changed) { L.terrain.instanceMatrix.needsUpdate = true; paintFloor(); S.mapVer++; }
    if (withFx && cnt) {
      cx /= cnt; cz /= cnt;
      spawnBurst(cx, Math.max(0.3, cy * 0.5), cz, true);
      S.boomLight.position.set(cx, cy + 1.5, cz); S.boomLight.intensity = 4;
      // 画面ゆれ（近いほど強い）
      var me = S.me ? S.me.tank : null;
      var dist = me ? Math.hypot(me.x + 0.5 - cx, me.z + 0.5 - cz) : 4;
      S.shake = Math.max(S.shake, clamp(0.55 - dist * 0.03, 0.18, 0.55));
      sfx('boom');
    }
    return done;
  }

  // ---------- 戦車の動き（自分もCPUも同じ） ----------
  // actor: {idx, tank, cx, cz, dir, move, turn, bump, bumpCd, fireCd, fireAnim, shots}
  function makeActor(tk, st, i) {
    var a = { idx: i, tank: tk, cx: st.x, cz: st.z, dir: ((st.dir | 0) % 4 + 4) % 4, move: null, turn: null, bump: null, bumpCd: 0, fireCd: 0, fireAnim: 0, shots: 0 };
    tk.x = st.x; tk.z = st.z; tk.y = vis(hAt(st.x, st.z)); tk.heading = dirToHeading(a.dir);
    return a;
  }
  function actorFree(a) { return !a.move && !a.turn && !a.bump; }

  function press(action, isDown) {
    if (['fwd', 'back', 'left', 'right', 'fire'].indexOf(action) < 0) return;
    if (!isDown) { S.held[action] = false; return; }
    if (S.paused) return;
    // ひだり・みぎ：押しつづけても回りつづけない（1回押すと90度だけ）。押したままの重ね押しは数えない
    if ((action === 'left' || action === 'right') && S.held[action]) return;
    S.held[action] = true;
    S.tapQ[action] = true;
  }
  function want(a) { return S.held[a] || S.tapQ[a]; }

  // 進行中の動き（移動・回転・ぶつかり）を進める
  function stepActor(a, dt) {
    var tk = a.tank;
    a.fireCd = Math.max(0, a.fireCd - dt);
    a.fireAnim = Math.max(0, a.fireAnim - dt);
    a.bumpCd = Math.max(0, a.bumpCd - dt);
    tk.tilt *= Math.exp(-dt * 10);
    if (a.move) {
      var mv = a.move; mv.t += dt;
      var u = clamp(mv.t / mv.dur, 0, 1);
      tk.x = mv.fx + (mv.tx - mv.fx) * u;
      tk.z = mv.fz + (mv.tz - mv.fz) * u;
      var drop = mv.fy - mv.ty;
      if (drop > 0.25) {
        // 高い所から降りる：ふちまで進み、前へ少し傾きながら（重力のように）すとんと落ちる
        var fu = clamp((u - 0.38) / 0.62, 0, 1);
        tk.y = mv.fy - drop * fu * fu;
        tk.tilt = -0.32 * Math.sin(fu * Math.PI);
      } else {
        // 小さな段差：前半は平らに進み、ふちで滑らかに上り下り
        var su = clamp((u - 0.25) / 0.5, 0, 1);
        tk.y = mv.fy + (mv.ty - mv.fy) * ease(su);
      }
      if (u >= 1) {
        a.move = null; a.cx = mv.tx; a.cz = mv.tz; tk.x = mv.tx; tk.z = mv.tz; tk.y = mv.ty;
        if (drop > 0.25) {
          tk.wobble = Math.min(1, 0.4 + drop * 0.35); tk.tilt = 0.12;
          for (var k = 0; k < 4; k++) spawnPuff(tk.x + 0.5 + rand(-0.4, 0.4), tk.y + 0.08, tk.z + 0.5 + rand(-0.4, 0.4), { color: 0xf3eee4, vx: rand(-1, 1), vy: 0.4, vz: rand(-1, 1), s0: 0.3, s1: 0.9, life: 0.6, a: 0.65 });
          if (a === S.me) S.shake = Math.max(S.shake, clamp(drop * 0.08, 0.04, 0.14));
        }
        checkFound(a);
      }
    } else if (a.turn) {
      var tn = a.turn; tn.t += dt;
      var v = clamp(tn.t / TURN_DUR, 0, 1);
      tk.heading = tn.from + (tn.to - tn.from) * ease(v);
      if (v >= 1) { a.turn = null; tk.heading = tn.to; }
    } else if (a.bump) {
      var bp = a.bump; bp.t += dt;
      var w = clamp(bp.t / BUMP_DUR, 0, 1);
      var off = Math.sin(w * Math.PI) * 0.16 * (w < 0.5 ? 1 : 0.6);
      tk.bump.position.set(0, 0, -off * bp.sign);
      if (w >= 1) { a.bump = null; tk.bump.position.set(0, 0, 0); a.bumpCd = 0.18; }
    }
    if (actorFree(a)) {
      var groundY = vis(hAt(a.cx, a.cz));
      tk.y += (groundY - tk.y) * Math.min(1, dt * 12); // 足元が壊れたら下りる
    }
    tk.moving = !!a.move;
  }

  function updateMe(dt) {
    var me = S.me; if (!me) return;
    stepActor(me, dt);
    if (S.found) { S.tapQ = {}; return; } // どちらかが見つけたら止める
    // 大砲（いつでも撃てる。間隔0.8秒）
    if (want('fire')) {
      S.tapQ.fire = false;
      if (me.fireCd <= 0) fire(me);
    }
    if (actorFree(me)) {
      if (want('fwd')) { S.tapQ.fwd = false; tryMove(me, 1); }
      else if (want('back')) { S.tapQ.back = false; tryMove(me, -1); }
      else if (S.tapQ.left) { S.tapQ.left = false; startTurn(me, -1); }   // 回転は押した回数だけ（押しっぱなしでは続けない）
      else if (S.tapQ.right) { S.tapQ.right = false; startTurn(me, 1); }
    }
  }

  // 進めるか：登りは1段まで、降りは何段でも
  function canStep(fromH, toH) { return toH - fromH <= 1; }
  function tryMove(a, sign) {
    var tk = a.tank;
    var tx = a.cx + DX[a.dir] * sign, tz = a.cz + DZ[a.dir] * sign;
    var cur = hAt(a.cx, a.cz);
    if (!inMap(tx, tz) || !canStep(cur, hAt(tx, tz))) {
      if (a.bumpCd > 0) return false;
      a.bump = { t: 0, sign: sign };
      tk.wobble = 1;
      if (a === S.me) sfx('bump');
      return false;
    }
    var ty = vis(hAt(tx, tz)), drop = tk.y - ty;
    a.move = { fx: a.cx, fz: a.cz, tx: tx, tz: tz, fy: tk.y, ty: ty, t: 0, dur: MOVE_DUR + (drop > 0.25 ? Math.min(0.12, drop * 0.07) : 0) };
    // 走るときのほこり
    spawnPuff(tk.x + 0.5 - DX[a.dir] * 0.4 * sign, tk.y + 0.1, tk.z + 0.5 - DZ[a.dir] * 0.4 * sign, { color: 0xf3eee4, vy: 0.3, s0: 0.25, s1: 0.75, life: 0.6, a: 0.6 });
    if (a === S.me) sfx('move');
    return true;
  }
  function startTurn(a, s) {
    var tk = a.tank;
    a.dir = (a.dir + s + 4) % 4;
    a.turn = { from: tk.heading, to: tk.heading - s * Math.PI / 2, t: 0 };
    if (a === S.me) sfx('turn');
  }
  function checkFound(a) {
    if (S.found || !S.treasure) return;
    if (a.cx === S.treasure.x && a.cz === S.treasure.z) {
      S.found = true;
      S.treasure.celebrate = 1.5;
      a.tank.hop = 1.6;
      sfx('found');
      emit('found', a.idx);
    }
  }

  // 大砲のねらい：向いている方向の1マス先→2マス先の順に見て、最初の高さ1以上のマス。どちらも0なら2マス先（何も壊さない）
  function aimFrom(cx, cz, d) {
    for (var k = 1; k <= 2; k++) {
      var x = cx + DX[d] * k, z = cz + DZ[d] * k;
      if (inMap(x, z) && S.heights[idx(x, z)] >= 1) return { x: x, z: z, hit: true };
    }
    return { x: cx + DX[d] * 2, z: cz + DZ[d] * 2, hit: false };
  }
  function fire(a) {
    var tk = a.tank;
    a.fireCd = FIRE_CD; a.fireAnim = 0.35;
    tk.recoil = 1;
    var bx = Math.round(tk.x), bz = Math.round(tk.z), d = a.dir;
    var aim = aimFrom(bx, bz, d);
    var cells = aim.hit ? [[aim.x, aim.z]] : [];
    shootBall(tk.x, tk.z, tk.y, d, [aim.x, aim.z], cells, a !== S.me, a);
    if (a === S.me) {
      sfx('fire');
      // 発射のしらせ（通信のときは、これを相手へ1回だけ送る）。CPUの発射は知らせない
      emit('fire', { cells: cells, from: { x: Math.round(tk.x * 100) / 100, z: Math.round(tk.z * 100) / 100, dir: d } });
    } else sfx('fire');
  }
  // 弾を飛ばす。px,pz は撃つ戦車の位置（マス単位の小数）、target は着弾のマス、cells は壊すマス（0か1個）。
  function shootBall(px, pz, py, d, target, cells, remote, owner) {
    var fwdx = DX[d], fwdz = DZ[d];
    var tx = target[0], tz = target[1];
    var from = new THREE.Vector3(px + 0.5 + fwdx * 0.5, py + 0.55, pz + 0.5 + fwdz * 0.5);
    var to = new THREE.Vector3(tx + 0.5, groundTopAt(tx + 0.5, tz + 0.5), tz + 0.5);
    var apex = Math.max(from.y, to.y) + 1.3;
    var ball = S.fx.balls.find(function (b) { return !b.visible; }) || S.fx.balls[0];
    ball.visible = true; ball.position.copy(from);
    if (owner) owner.shots++;
    S.projectiles.push({ ball: ball, from: from, to: to, arc: apex - (from.y + to.y) / 2, t: 0, cells: cells || [], trail: 0, remote: !!remote, owner: owner || null });
    // 発射のけむり
    spawnPuff(from.x, from.y, from.z, { color: 0xffffff, vx: fwdx * 1.5, vy: 0.6, vz: fwdz * 1.5, s0: 0.3, s1: 1.1, life: 0.6, a: 0.9 });
    spawnPuff(from.x, from.y, from.z, { color: 0xffe08a, vx: fwdx * 0.5, vy: 0.2, vz: fwdz * 0.5, s0: 0.35, s1: 0.6, life: 0.18, a: 1 });
    if (remote && !owner) sfx('fire');
  }

  function updateProjectiles(dt) {
    for (var i = S.projectiles.length - 1; i >= 0; i--) {
      var pr = S.projectiles[i];
      pr.t += dt;
      var u = clamp(pr.t / BALL_DUR, 0, 1);
      pr.ball.position.lerpVectors(pr.from, pr.to, u);
      pr.ball.position.y += 4 * pr.arc * u * (1 - u);
      pr.trail -= dt;
      if (pr.trail <= 0) { pr.trail = 0.05; spawnPuff(pr.ball.position.x, pr.ball.position.y, pr.ball.position.z, { color: 0xe6e6e6, vy: 0.1, s0: 0.12, s1: 0.4, life: 0.5, a: 0.55 }); }
      if (u >= 1) {
        pr.ball.visible = false;
        S.projectiles.splice(i, 1);
        if (pr.owner) pr.owner.shots = Math.max(0, pr.owner.shots - 1);
        var done = destroyCells(pr.cells, true);
        if (!done.length) {
          // 何も壊さなかった：床に落ちて小さな土ぼこり
          spawnPuff(pr.to.x, pr.to.y + 0.15, pr.to.z, { color: 0xe8e2d6, vy: 0.8, s0: 0.4, s1: 1.4, life: 0.8, a: 0.8 });
          spawnDebris(pr.to.x, pr.to.y + 0.05, pr.to.z, tmpC.set(0x9a9080), 6, 0.4);
          sfx('bump');
        }
        emit('boom', done, pr.remote);
      }
    }
  }

  // ---------- ねらいの印（自分の戦車の弾が落ちるマス） ----------
  function buildAim(L, add, colorStr) {
    var c = makeCanvas(128, 128), g = c.getContext('2d');
    g.lineCap = 'round'; g.lineJoin = 'round';
    function corners(lw, col) {
      g.strokeStyle = col; g.lineWidth = lw;
      [[14, 14, 1, 1], [114, 14, -1, 1], [14, 114, 1, -1], [114, 114, -1, -1]].forEach(function (q) {
        g.beginPath(); g.moveTo(q[0], q[1] + q[3] * 30); g.lineTo(q[0], q[1]); g.lineTo(q[0] + q[2] * 30, q[1]); g.stroke();
      });
    }
    corners(18, 'rgba(255,255,255,0.95)'); corners(9, '#ffffff');
    var tex = new THREE.CanvasTexture(c);
    var geo = new THREE.PlaneGeometry(1, 1); geo.rotateX(-Math.PI / 2);
    var mat = new THREE.MeshBasicMaterial({ map: tex, color: new THREE.Color(colorStr || '#e53935'), transparent: true, depthWrite: false, opacity: 0.95 });
    var mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 3; mesh.visible = false;
    add(mesh);
    L.dispose.push(tex, geo, mat);
    S.aim = { mesh: mesh, mat: mat, base: new THREE.Color(colorStr || '#e53935') };
  }
  function updateAim() {
    var A = S.aim, me = S.me; if (!A || !me) return;
    var show = S.camMode !== 2 && !S.intro && !S.found && !me.move;
    A.mesh.visible = show;
    if (!show) return;
    var aim = aimFrom(me.cx, me.cz, me.dir);
    var top = inMap(aim.x, aim.z) ? vis(S.heights[idx(aim.x, aim.z)]) : 0;
    var pulse = 1 + Math.sin(S.time * 6) * 0.05;
    A.mesh.position.set(aim.x + 0.5, top + 0.03, aim.z + 0.5);
    A.mesh.scale.set(0.96 * pulse, 1, 0.96 * pulse);
    // 壊せるブロックをねらっているときは自分の色、何もないときは白くうすく
    if (aim.hit) { A.mat.color.copy(A.base); A.mat.opacity = 0.95; } else { A.mat.color.set(0xffffff); A.mat.opacity = 0.55; }
  }

  // ---------- CPU ----------
  // 道さがし：状態＝(マス, 向き, いまのマスを壊して入ったか)。手＝左回り・右回り・前へ（1）、壊して前へ（1+BREAK_COST）。
  // 登りは1段・降りは自由。前のマスが登れない高さなら、大砲で壊して（高さ0にして）入る。いちばん手数の少ない道を選ぶ。
  var heap = null;
  function planPath(a) {
    var w = S.w, h = S.h, N = w * h * 8, H = S.heights, T0 = S.treasure;
    if (!T0) return null;
    var dist = new Float32Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1), act = new Uint8Array(N);
    heap = { k: [], v: [] };
    function push(st, d) {
      var hk = heap.k, hv = heap.v, i = hk.length; hk.push(d); hv.push(st);
      while (i > 0) { var p = (i - 1) >> 1; if (hk[p] <= hk[i]) break; var t = hk[p]; hk[p] = hk[i]; hk[i] = t; t = hv[p]; hv[p] = hv[i]; hv[i] = t; i = p; }
    }
    function pop() {
      var hk = heap.k, hv = heap.v, top = hv[0], last = hk.length - 1;
      hk[0] = hk[last]; hv[0] = hv[last]; hk.pop(); hv.pop();
      var i = 0, n = hk.length;
      for (;;) { var l = i * 2 + 1, r = l + 1, m = i; if (l < n && hk[l] < hk[m]) m = l; if (r < n && hk[r] < hk[m]) m = r; if (m === i) break; var t = hk[m]; hk[m] = hk[i]; hk[i] = t; t = hv[m]; hv[m] = hv[i]; hv[i] = t; i = m; }
      return top;
    }
    var s0 = ((a.cz * w + a.cx) * 4 + a.dir) * 2;
    dist[s0] = 0; push(s0, 0);

      stopEv(e); var was = armed; armed = false; el.classList.remove('down');
      if (was) { sfx('tap'); fn(e); }
    });
    function off(e) { stopEv(e); armed = false; el.classList.remove('down'); }
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('click', stopEv);
    el.addEventListener('contextmenu', stopEv);
  }
  function setBtnDown(act, on) {
    var list = doc.querySelectorAll('[data-act="' + act + '"]');
    for (var i = 0; i < list.length; i++) list[i].classList.toggle('down', on);
  }
  function press(act, on) {
    if (!!pressed[act] === on) return;
    pressed[act] = on;
    setBtnDown(act, on);
    call('World', 'press', act, on);
  }
  function releaseAll() { Object.keys(pressed).forEach(function (a) { if (pressed[a]) press(a, false); }); }
  function hold(el, act) {
    el.addEventListener('pointerdown', function (e) { stopEv(e); unlock(); if (!modalOpen) press(act, true); });
    function up(e) { stopEv(e); press(act, false); }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('click', stopEv);
    el.addEventListener('contextmenu', stopEv);
  }

  // ---------------- ロゴ ----------------
  function logoHTML() {
    return '<div class="logo"><div class="logo-top">見つめて見つけて</div><div class="logo-main">' +
      '<div class="star"><i class="s1"></i><i class="s2"></i><i class="s3"></i><b>ほ</b></div>' +
      '<div class="logo-name">シーカー</div></div><div class="logo-en">SEE-CAR</div></div>';

  function buildLogos() {
    var list = doc.querySelectorAll('[data-logo]');

      list[i].firstChild.style.setProperty('--k', list[i].getAttribute('data-logo'));

  // ---------------- 進行ボタン #nav ----------------
  function navItems() {
    if (state === 'title') return [
      { label: 'はじめる', icon: 'play', kind: 'primary hero', cap: 'コンピューターと たいけつ', fn: startCpu },
      { brk: true },
      { label: 'ひとりで れんしゅう', icon: 'solo', kind: 'secondary sub', fn: startSolo },
      { label: 'つうしんで あそぶ', icon: 'net', kind: 'secondary sub', fn: startOnline },
      { label: 'せってい', icon: 'gear', kind: 'secondary sub', fn: openSettings }];
