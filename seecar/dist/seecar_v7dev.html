<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>見つけて！PixSee</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* 見つけて！PixSee style.css  寸法は #stage（16:9）を基準に cqmin で指定
   色は山田さんのデザイン画：橙・クリーム・水色と黄色のしましま・ピンクの星・緑の目・黒いふち線 */
:root{--ink:#2b2118;--orange:#e08524;--orange2:#f5a64a;--cream:#fff4d6;--cream2:#f6dfa8;--cyan:#19c8f5;--cyan2:#8be6ff;--yellow:#ffe400;--pink:#d97eb8;--green:#22dd99;--mute:#7a5a3a}
*{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:100vh;height:100dvh;width:100%;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP","IPAGothic",system-ui,sans-serif;font-weight:800;color:var(--ink)}
#app{position:fixed;inset:0;height:100vh;height:100dvh;background:#000}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;outline:none}
svg{display:block}

#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.7778vh);height:min(100vh,56.25vw);
  width:min(100vw,177.7778dvh);height:min(100dvh,56.25vw);
  container-type:size;overflow:hidden;background:var(--cream)}

/* ---------- 背景（クレヨンと紙） ---------- */
#bg{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 30% 40% at 8% 88%,rgba(224,133,36,.40),transparent 70%),
    radial-gradient(ellipse 28% 36% at 95% 85%,rgba(255,228,0,.40),transparent 70%),
    radial-gradient(ellipse 26% 30% at 70% 98%,rgba(34,221,153,.30),transparent 70%),
    radial-gradient(ellipse 24% 30% at 4% 12%,rgba(217,126,184,.32),transparent 70%),
    repeating-linear-gradient(112deg,rgba(255,255,255,0) 0 .9cqmin,rgba(255,255,255,.22) .9cqmin 1.1cqmin),
    linear-gradient(#a6e7ff 0%,#d4f2ff 38%,#fff4d6 76%,#fbe5b0 100%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .45 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.blk{position:absolute;display:block;border:.7cqmin solid var(--ink);border-radius:.8cqmin;box-shadow:.8cqmin 1cqmin 0 rgba(43,33,24,.2)}
.b1{left:-4cqmin;bottom:-4cqmin;width:34cqmin;height:20cqmin;transform:rotate(-8deg);
  background:repeating-linear-gradient(60deg,#e08524 0 1.2cqmin,#f5a64a 1.2cqmin 2.2cqmin)}
.b2{right:-5cqmin;bottom:-3cqmin;width:38cqmin;height:22cqmin;transform:rotate(6deg);
  background:repeating-linear-gradient(-55deg,#19c8f5 0 1.2cqmin,#8be6ff 1.2cqmin 2.2cqmin)}
.b3{left:58cqmin;bottom:-9cqmin;width:30cqmin;height:16cqmin;transform:rotate(-3deg);
  background:repeating-linear-gradient(80deg,#ffe400 0 1.2cqmin,#fff08a 1.2cqmin 2.2cqmin)}
.tw{position:absolute;display:block;width:4cqmin;height:4cqmin;background:var(--pink);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle 2.4s ease-in-out infinite}
.t1{left:6cqmin;top:10cqmin}.t2{right:8cqmin;top:8cqmin;width:3cqmin;height:3cqmin;animation-delay:.5s;background:var(--yellow)}
.t3{left:24cqmin;top:58cqmin;width:3cqmin;height:3cqmin;animation-delay:1s;background:var(--green)}
.t4{right:20cqmin;top:52cqmin;animation-delay:1.4s;background:var(--cyan)}.t5{left:70cqmin;top:6cqmin;width:2.4cqmin;height:2.4cqmin;animation-delay:.9s;background:var(--orange2)}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(18deg)}}
body[data-state=play] #bg{display:none}

#worldbox{position:absolute;inset:0;background:#a6e7ff;visibility:hidden}
#worldbox canvas{display:block;width:100%;height:100%}
body[data-state=play] #worldbox{visibility:visible}

/* ---------- 画面の切り替え ---------- */
.screen{position:absolute;inset:0;display:none}
body[data-state=boot] #boot,body[data-state=title] #title,body[data-state=setting] #setting,
body[data-state=play] #play,body[data-state=ending] #ending,body[data-state=quit] #quit{display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}

/* ---------- ロゴ「見つけて！PixSee」 ---------- */
[data-logo]{width:calc(var(--k,1)*100cqmin);max-width:96%}
.logo{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 1cqmin 0 rgba(43,33,24,.22));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-1.2cqmin) rotate(1deg)}}
.titlelogo{position:absolute;left:0;right:0;top:2cqmin;margin:0 auto}
.mascot{position:absolute;width:36cqmin;filter:drop-shadow(0 1cqmin 0 rgba(43,33,24,.2));animation:bob 2.6s ease-in-out infinite}
.mascot.m-l{left:6cqmin;top:40cqmin;transform:rotate(-4deg)}
.mascot.m-r{right:6cqmin;top:40cqmin;transform:scaleX(-1);animation-delay:.6s}

/* ---------- Boot / Quit ---------- */
.touchme{position:relative;font-size:7.4cqmin;color:var(--ink);background:var(--cream);padding:2cqmin 7cqmin;border-radius:9cqmin;border:.7cqmin solid var(--ink);box-shadow:0 1cqmin 0 rgba(43,33,24,.3);animation:blink 1.4s ease-in-out infinite}
.touchme .ring{position:absolute;right:-5cqmin;bottom:-6cqmin;width:11cqmin;height:11cqmin;border-radius:50%;background:rgba(217,126,184,.85);border:.8cqmin solid #fff;animation:pulse 1.4s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.bye{font-size:12cqmin;font-weight:900;color:var(--orange);background:var(--cream);padding:2cqmin 8cqmin;border-radius:10cqmin;border:.8cqmin solid var(--ink);box-shadow:0 1.2cqmin 0 rgba(43,33,24,.3);-webkit-text-stroke:.2cqmin var(--ink)}
body[data-state=quit] #quit .center{padding-bottom:14cqmin}

/* ---------- 進行ボタン #nav（全画面で同じ大きさ・同じホップ） ---------- */
#nav{position:absolute;left:0;right:0;bottom:4cqmin;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:5cqmin;z-index:50;pointer-events:none}
.brk{flex-basis:100%;height:0}
.nbtn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:2cqmin;width:64cqmin;height:16cqmin;border-radius:8cqmin;
  font-size:6.4cqmin;line-height:1;white-space:nowrap;border:.8cqmin solid #fff;box-shadow:0 0 0 .6cqmin var(--ink),0 1.5cqmin 0 .6cqmin rgba(43,33,24,.35);animation:hop 1.15s ease-in-out infinite}
.nbtn i{display:block;width:8cqmin;height:8cqmin;flex:none}
.nbtn i svg{width:100%;height:100%;fill:currentColor}
.nbtn.primary{background:linear-gradient(#ffd27a,#f5a64a 45%,#e08524);color:#2b1700}
.nbtn.secondary{background:linear-gradient(#b9f0ff,#19c8f5);color:var(--ink);animation:none} /* 跳ねるのは次に押す1つ（primary）だけ */
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2cqmin)}60%{transform:translateY(0)}}
.nbtn.down,.ctl.down,.card.down,.bigcard.down,.howcard.down,.lvcard.down,.key.down,.backbtn.down,#home.down,#cam.down,.seg button.down{animation:none;transform:translateY(.7cqmin) scale(.95);filter:brightness(.92)}

/* ---------- ホーム（最前面） ---------- */
#home{position:absolute;z-index:100;top:max(2cqmin,env(safe-area-inset-top));right:max(2.4cqmin,env(safe-area-inset-right));
  width:12cqmin;height:12cqmin;border-radius:50%;background:#fff;box-shadow:0 0 0 .5cqmin var(--ink),0 1cqmin 0 .5cqmin rgba(43,33,24,.3);border:0;display:flex;align-items:center;justify-content:center}
#home svg{width:7.4cqmin;height:7.4cqmin;fill:var(--orange);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}

/* ---------- モーダル ---------- */
#modal{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(43,33,24,.62)}
#modal.on{display:flex}
.mcard{background:var(--cream);border-radius:5cqmin;padding:6cqmin 6cqmin 7cqmin;display:flex;flex-direction:column;align-items:center;gap:6cqmin;border:.9cqmin solid var(--ink);box-shadow:0 2cqmin 0 rgba(0,0,0,.25)}
.mtitle{font-size:7.6cqmin;color:var(--ink);font-weight:900;text-align:center}
.mbtns{display:flex;gap:5cqmin}
.mbtns .nbtn{width:50cqmin}
#m-no{background:linear-gradient(#b8f5d4,#22dd99);color:#053b26}
#m-yes{animation:none;background:linear-gradient(#e8dcc6,#c4b090);color:var(--ink)}

/* ---------- 縦持ち警告 ---------- */
#portrait{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8vmin;background:var(--ink);color:#fff}
.phone{width:18vmin;height:30vmin;border:1.6vmin solid #fff;border-radius:3vmin;background:var(--orange);animation:rot 2.4s ease-in-out infinite}
.ptext{font-size:7.6vmin;font-weight:900;text-align:center;line-height:1.4;padding:0 6vmin}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media screen and (orientation: portrait){#portrait{display:flex}}

/* ---------- タイトル ---------- */
body[data-state=title] #nav{gap:2.6cqmin 3cqmin;padding:0 4cqmin;bottom:3.6cqmin}
.nbtn.hero{display:grid;grid-template-columns:11cqmin auto;column-gap:2.4cqmin;align-content:center;justify-content:center;
  width:96cqmin;height:20cqmin;border-radius:10cqmin;font-size:10cqmin;text-align:left;border-width:1cqmin}
.nbtn.hero i{width:11cqmin;height:11cqmin;align-self:center}
.nbtn.hero span{align-self:center;line-height:1}
.nbtn.sub{width:auto;height:12.4cqmin;padding:0 4.4cqmin;gap:1.8cqmin;font-size:4.7cqmin;border-radius:6.4cqmin;border-width:.7cqmin}
.nbtn.sub i{width:6.2cqmin;height:6.2cqmin}
.recchip{position:absolute;left:3cqmin;bottom:3cqmin;display:flex;align-items:center;gap:1.4cqmin;background:var(--cream);border:.5cqmin solid var(--ink);box-shadow:0 .7cqmin 0 rgba(43,33,24,.25);border-radius:5cqmin;padding:.6cqmin 2.6cqmin .6cqmin 1.2cqmin;font-size:3.2cqmin;color:var(--ink);white-space:nowrap}
.recchip b,.endrec b{font-size:3.4cqmin;background:var(--yellow);border-radius:3cqmin;padding:.2cqmin 1.6cqmin;border:.3cqmin solid var(--ink)}
.rc-ico{display:block;width:5.6cqmin;height:5.6cqmin;flex:none}.rc-ico svg{width:100%;height:100%}
.rc-n{font-weight:900}

/* ---------- Setting ---------- */
.head{position:absolute;top:3cqmin;left:50%;transform:translateX(-50%);font-size:6.2cqmin;white-space:nowrap;background:linear-gradient(#fff,var(--cream));color:var(--ink);
  padding:1.2cqmin 7cqmin;border-radius:8cqmin;border:.6cqmin solid var(--ink);box-shadow:0 1cqmin 0 rgba(43,33,24,.28)}
.backbtn{position:absolute;left:3cqmin;top:3cqmin;height:12cqmin;min-width:25cqmin;padding:0 3cqmin;display:flex;align-items:center;justify-content:center;gap:1.4cqmin;
  background:#fff;border-radius:6cqmin;font-size:4.8cqmin;color:var(--ink);border:0;box-shadow:0 0 0 .5cqmin var(--ink),0 1cqmin 0 .5cqmin rgba(43,33,24,.3)}
.backbtn i{width:0;height:0;border-top:2.4cqmin solid transparent;border-bottom:2.4cqmin solid transparent;border-right:3.6cqmin solid var(--orange)}
.pane{position:absolute;left:6cqmin;right:6cqmin;top:19cqmin;bottom:23cqmin;display:none}
#setting[data-sub=how] .pane,#setting[data-sub=who] .pane,#setting[data-sub=level] .pane,#setting[data-sub=opts] .pane{bottom:6cqmin}
#setting[data-sub=how] .sub-how,#setting[data-sub=who] .sub-who,#setting[data-sub=level] .sub-level,
#setting[data-sub=choice] .sub-choice,#setting[data-sub=code] .sub-code,#setting[data-sub=pick] .sub-pick,
#setting[data-sub=keypad] .sub-keypad,#setting[data-sub=msg] .sub-msg,#setting[data-sub=error] .sub-msg{display:flex}
#setting[data-sub=opts] .sub-opts{display:grid}

/* 共通のカード：クリームの面 ＋ 黒いふち線 ＋ ふっくらした影 */
.howcard,.lvcard,.bigcard,.card,.setcard,.preview,.key{border:0;box-shadow:0 0 0 .6cqmin var(--ink),0 1.4cqmin 0 .6cqmin rgba(43,33,24,.3)}

/* あそびかた */
.sub-how{align-items:center;justify-content:center;gap:4cqmin}
.howcard{flex:1;max-width:54cqmin;height:70cqmin;border-radius:5cqmin;background:linear-gradient(#fff,var(--cream));padding:2cqmin 2cqmin 2.4cqmin;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1cqmin;color:var(--ink)}
.howcard .hpic{display:block;width:100%;height:30cqmin;border-radius:3.4cqmin;background:var(--cyan2);padding:1.4cqmin;border:.5cqmin solid var(--ink)}
.howcard[data-kind=count] .hpic{background:var(--cream2)}.howcard[data-kind=solo] .hpic{background:#ffd9ee}
.howcard .hpic svg{width:100%;height:100%}
.howcard b{font-size:4.9cqmin;line-height:1.1;font-weight:900;white-space:nowrap}
.howcard small{font-size:3.3cqmin;line-height:1.35;color:var(--mute);font-weight:800;text-align:center}

/* だれと？ */
.sub-who{align-items:center;justify-content:center;gap:9cqmin}
.bigcard{width:62cqmin;height:56cqmin;border-radius:5cqmin;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqmin;font-size:7.4cqmin;color:var(--ink)}
.bigcard svg{width:24cqmin;height:24cqmin}
.sub-who .bigcard{width:74cqmin;font-size:5.8cqmin}
.sub-who .wpic{display:block;width:60cqmin;height:34cqmin}.sub-who .wpic svg{width:100%;height:100%}
.sub-who [data-who=cpu]{background:linear-gradient(#fff,var(--cyan2))}.sub-who [data-who=net]{background:linear-gradient(#fff,#ffe9b0)}
#c-host{background:linear-gradient(#fff,#fff0a8)}#c-join{background:linear-gradient(#fff,var(--cyan2))}
.sub-choice{align-items:center;justify-content:center;gap:9cqmin}

.sub-code{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.digits{display:flex;gap:3cqmin;justify-content:center}
.digits b{width:23cqmin;height:30cqmin;border-radius:3cqmin;background:#fff;border:.8cqmin solid var(--orange);box-shadow:0 0 0 .5cqmin var(--ink),0 1cqmin 0 .5cqmin rgba(43,33,24,.25);display:flex;align-items:center;justify-content:center;font-size:21cqmin;line-height:1;color:var(--ink)}
.digits.grid2{display:grid;grid-template-columns:repeat(2,23cqmin);gap:3cqmin;align-content:center}
.digits.grid2 b{height:23cqmin;font-size:17cqmin}
.waiting{font-size:6.4cqmin;background:var(--cream);padding:1.4cqmin 6cqmin;border-radius:8cqmin;border:.5cqmin solid var(--ink)}
.dots i{font-style:normal;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}

/* ちずえらび：よじじゅくご／イラスト */
.sub-pick{gap:3.4cqmin;align-items:stretch}
.card{position:relative;border-radius:4cqmin;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqmin;overflow:hidden;color:var(--ink);text-align:center;padding:0 .4cqmin}
.card .kan{font-size:8.4cqmin;line-height:1.1;font-weight:900;letter-spacing:.04em;color:var(--ink)}
.card .yomi{font-size:2.2cqmin;letter-spacing:-.02em;white-space:nowrap;color:var(--mute)}
.card.on{background:linear-gradient(#fff9c4,var(--yellow));box-shadow:0 0 0 .6cqmin var(--ink),0 0 0 1.5cqmin var(--orange),0 1.4cqmin 0 1.5cqmin rgba(43,33,24,.3)}
.card input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.preview{flex:1;border-radius:4cqmin;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqmin;padding:1.6cqmin;min-width:0;overflow:hidden}
.preview img{max-width:100%;max-height:30cqmin;object-fit:contain;border-radius:1.6cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(43,33,24,.25);background:#fff}
.preview .pt{font-size:5.8cqmin;line-height:1.1;color:var(--ink);font-weight:900}
.preview .py{font-size:3.2cqmin;color:var(--mute)}
.preview .hint{font-size:4.6cqmin;color:var(--mute);text-align:center;line-height:1.4}
.spin{width:10cqmin;height:10cqmin;border-radius:50%;border:1.4cqmin solid #f1e2bf;border-top-color:var(--orange);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.maps{flex:3;display:flex;flex-direction:column;gap:1.6cqmin;min-width:0}
.grp{flex:1;display:flex;flex-direction:column;gap:.8cqmin;min-height:0}
.gl{font-size:3.8cqmin;line-height:1;color:var(--ink);align-self:flex-start;background:var(--cream);border-radius:3cqmin;padding:.7cqmin 2.6cqmin;border:.4cqmin solid var(--ink)}
.grp.yoji .gl{background:var(--ink);color:#fff}.grp.illust .gl{background:var(--orange);color:#fff}
.grp .row{flex:1;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:1.8cqmin;min-height:0;padding:0 .8cqmin 1.2cqmin}
.card .ic{display:block;width:9cqmin;height:9cqmin}.card .ic svg,.card .ic img{width:100%;height:100%;object-fit:contain;display:block}
.card.illust{background:linear-gradient(#fff,#fffdf3)}
.card.yoji .kan{font-size:5.2cqmin;letter-spacing:0;white-space:nowrap}
.card.illust .kan{font-size:4.8cqmin;white-space:nowrap}
.maps.dense .card.yoji .kan{font-size:4.3cqmin}.maps.dense .card.illust .kan{font-size:3.8cqmin}.maps.dense .card .ic{width:8cqmin;height:8cqmin}
.card.file{flex:none;height:11.6cqmin;flex-direction:row;gap:1.6cqmin;border-radius:5.8cqmin;background:linear-gradient(#fff,var(--cyan2));padding:0 2cqmin;margin:0 .8cqmin}
.card.file .ic{width:6.4cqmin;height:6.4cqmin}
.card.file .kan{width:auto;font-size:4.6cqmin;color:var(--ink);white-space:nowrap}
.card.file .bw{font-size:3cqmin;background:#222;color:#fff;border-radius:2cqmin;padding:.3cqmin 1.4cqmin}

.sub-keypad{gap:8cqmin;align-items:center;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(3,18cqmin);grid-auto-rows:13.4cqmin;gap:1.8cqmin}
.key{border-radius:3cqmin;background:#fff;font-size:8cqmin;color:var(--ink);font-weight:900;display:flex;align-items:center;justify-content:center}
.key.del{background:linear-gradient(#ffd0e6,var(--pink));font-size:4.8cqmin}
.key.nul{visibility:hidden}
.sub-msg{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.msgtext{font-size:6.6cqmin;line-height:1.5;text-align:center;background:var(--cream);padding:2.4cqmin 7cqmin;border-radius:6cqmin;max-width:150cqmin;border:.5cqmin solid var(--ink)}
.msgface svg{width:20cqmin;height:20cqmin}

/* ---- 難しさえらび ---- */
.sub-level{align-items:center;justify-content:center;gap:5cqmin}
.lvcard{flex:1;max-width:50cqmin;height:68cqmin;border-radius:5cqmin;background:linear-gradient(#fff,var(--cream));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqmin;color:var(--ink)}
.lvcard .lvpic{display:block;width:26cqmin;height:26cqmin;border-radius:50%;background:var(--cream2);border:.5cqmin solid var(--ink);padding:2.4cqmin}
.lvcard .lvpic svg{width:100%;height:100%}
.lvcard b{font-size:8cqmin;line-height:1.1;font-weight:900}
.lvcard small{font-size:3.4cqmin;color:var(--mute);font-weight:800}
.lvcard em{font-style:normal;font-size:3.3cqmin;line-height:1.3;background:#fff;border-radius:3cqmin;padding:.6cqmin 2.4cqmin;margin-top:.6cqmin;color:var(--ink);text-align:center;border:.3cqmin solid #e4d3ad;min-height:9.2cqmin;display:flex;align-items:center}
.lvcard.on{background:linear-gradient(#fff9c4,var(--yellow));box-shadow:0 0 0 .6cqmin var(--ink),0 0 0 1.5cqmin var(--orange),0 1.4cqmin 0 1.5cqmin rgba(43,33,24,.3)}

/* ---- せってい ---- */
.sub-opts{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4.4cqmin}
.setcard{border-radius:4.6cqmin;background:linear-gradient(#fff,var(--cream));padding:2.4cqmin 3.4cqmin;display:flex;flex-direction:column;justify-content:space-between;gap:1.2cqmin;min-height:0;color:var(--ink)}
.setcard.wide{grid-column:1/3;flex-direction:row;align-items:center;gap:3cqmin}
.setcard.wide .sc-head{flex:none}.setcard.wide .sc-hint{flex:1;font-size:3.6cqmin;white-space:normal;line-height:1.3}
.setcard.wide .seg{flex:none;width:48cqmin}
.sc-head{display:flex;align-items:center;gap:2cqmin;font-size:5.2cqmin;line-height:1.1;font-weight:900;white-space:nowrap}
.sc-ico{display:block;width:8.4cqmin;height:8.4cqmin;flex:none}.sc-ico svg{width:100%;height:100%}
.seg{display:flex;gap:2cqmin}
.seg button{flex:1;height:11.6cqmin;border-radius:6cqmin;background:#fff;border:.6cqmin solid #d9c8a0;box-shadow:0 .8cqmin 0 rgba(43,33,24,.2);font-size:4.8cqmin;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:1cqmin}
.seg button.on{background:linear-gradient(#ffd27a,var(--orange2));border-color:var(--ink);color:#2b1700;box-shadow:0 .8cqmin 0 rgba(43,33,24,.35)}
.seg button.on::before{content:"";width:2.2cqmin;height:3.8cqmin;border:solid var(--ink);border-width:0 .8cqmin .8cqmin 0;transform:rotate(45deg) translate(-.3cqmin,-.5cqmin);margin-right:.8cqmin}
.seg button.danger{background:linear-gradient(#ffd0e6,var(--pink));border-color:var(--ink);color:var(--ink)}
.sc-hint{font-size:3.3cqmin;color:var(--mute);line-height:1.2;min-height:3.6cqmin;white-space:nowrap}

/* ---------- Play ---------- */
#play{pointer-events:none}
#play>*{pointer-events:auto}
#swipe{position:absolute;inset:0;background:transparent}
#sonar,#hud,#maptag,#notice,#pop,#tip{pointer-events:none}
#sonar{position:absolute;left:max(2cqmin,env(safe-area-inset-left));top:max(2.6cqmin,env(safe-area-inset-top));width:30cqmin;height:30cqmin;filter:drop-shadow(0 .8cqmin 0 rgba(43,33,24,.3))}
#sonar canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:50%;top:2cqmin;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:1cqmin}
body[data-mode=count] #hud{display:flex}
#timer{display:flex;align-items:center;gap:1.6cqmin;background:var(--cream);border:.6cqmin solid var(--ink);border-radius:6cqmin;padding:.4cqmin 4cqmin .4cqmin 1.8cqmin;box-shadow:0 .8cqmin 0 rgba(43,33,24,.3)}
#timer i{display:block;width:7cqmin;height:7cqmin}#timer i svg{width:100%;height:100%}
#timer b{font-size:8.4cqmin;line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
#timer.low b{color:#d8321a}
#scorebar{display:flex;gap:1.6cqmin}
.sb{display:flex;align-items:center;gap:1cqmin;font-size:4.2cqmin;line-height:1;background:#fff;border:.5cqmin solid var(--ink);border-radius:5cqmin;padding:.7cqmin 2.4cqmin .7cqmin 1.2cqmin;box-shadow:0 .6cqmin 0 rgba(43,33,24,.25)}
.sb i{display:block;width:5cqmin;height:5cqmin}.sb i svg{width:100%;height:100%}
.sb b{font-size:5.4cqmin;font-variant-numeric:tabular-nums}
.sb.me{background:#ffe3b8}.sb.op{background:#d6f3ff}
#maptag{position:absolute;bottom:2cqmin;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:1.4cqmin;background:rgba(255,244,214,.88);border-radius:4cqmin;padding:.4cqmin 3cqmin;border:.4cqmin solid var(--ink);white-space:nowrap;transition:opacity .4s}
#maptag b{font-size:3.8cqmin;color:var(--ink);font-weight:900}#maptag small{font-size:2.4cqmin;color:var(--mute)}
body.camtop #maptag{opacity:0}
#notice{position:absolute;top:26cqmin;left:50%;transform:translateX(-50%);display:none;font-size:3.6cqmin;background:#fff5d6;color:#7a3b00;border:.5cqmin solid var(--orange);border-radius:4cqmin;padding:.7cqmin 3cqmin;white-space:nowrap;transition:all .5s}
#notice.on{display:block;animation:pop3 .35s ease-out}
#notice.big{top:34cqmin;font-size:6.4cqmin;font-weight:900;padding:2cqmin 5cqmin;border-width:.8cqmin;border-radius:6cqmin;box-shadow:0 1cqmin 0 rgba(122,59,0,.25);text-align:center;line-height:1.35;white-space:normal;width:max-content;max-width:84cqmin}
@keyframes pop3{0%{opacity:0;margin-top:2cqmin}100%{opacity:1;margin-top:0}}
#pop{position:absolute;left:50%;top:40cqmin;display:none;font-size:11cqmin;font-weight:900;white-space:nowrap;color:#fff;-webkit-text-stroke:1.4cqmin var(--ink);paint-order:stroke fill;text-shadow:0 1.2cqmin 0 rgba(43,33,24,.4)}
#pop.mine{color:var(--yellow)}
#pop.on{display:block;animation:pop4 1.4s ease-out forwards}
@keyframes pop4{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.2);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}

/* 操作ボタン：左下に大きい「すすむ」。右下に「ジャンプ」「ドリルアタック」「ドリルジャンプ」 */
.ctl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqmin;color:var(--ink);border:.9cqmin solid #fff;box-shadow:0 0 0 .6cqmin var(--ink),0 1.4cqmin 0 .6cqmin rgba(43,33,24,.4);line-height:1.05}
.ctl i{display:block;flex:none}.ctl i svg{width:100%;height:100%}
.ctl span{font-weight:900;text-align:center}
#fwd{left:max(3cqmin,env(safe-area-inset-left));bottom:3.6cqmin;width:36cqmin;height:36cqmin;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffd88a,var(--orange2) 45%,var(--orange))}
#fwd i{width:15cqmin;height:17cqmin}#fwd span{font-size:7.4cqmin;color:#fff;-webkit-text-stroke:1.1cqmin var(--ink);paint-order:stroke fill}
.ctl.act{width:26cqmin;height:26cqmin;border-radius:5.6cqmin}
.ctl.act i{width:12.4cqmin;height:12.4cqmin}.ctl.act span{font-size:4cqmin}
#b-jump{right:max(3cqmin,env(safe-area-inset-right));bottom:3.6cqmin;background:linear-gradient(#fff6a8,var(--yellow))}
#b-attack{right:calc(max(3cqmin,env(safe-area-inset-right)) + 28.6cqmin);bottom:3.6cqmin;background:linear-gradient(#d7f6ff,var(--cyan))}
#b-dj{right:calc(max(3cqmin,env(safe-area-inset-right)) + 14.3cqmin);bottom:32.2cqmin;background:linear-gradient(#ffd9ee,var(--pink))}
.ctl.down{filter:brightness(1.08) saturate(1.1);transform:translateY(.8cqmin) scale(.95);animation:none}
#fwd.down{background:radial-gradient(circle at 35% 28%,#fff0c0,#ffc067 45%,#f09a2e)}
#cam{position:absolute;right:max(2.4cqmin,env(safe-area-inset-right));top:calc(max(2cqmin,env(safe-area-inset-top)) + 14.4cqmin);width:15cqmin;height:14cqmin;border-radius:4cqmin;background:rgba(255,255,255,.94);border:0;box-shadow:0 0 0 .5cqmin var(--ink),0 .9cqmin 0 .5cqmin rgba(43,33,24,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqmin;color:var(--ink)}
#cam i{display:block;width:8cqmin;height:7.4cqmin;flex:none}
#cam i svg{width:100%;height:100%}
#cam span#cam-label{font-size:3cqmin;line-height:1;font-weight:900;white-space:nowrap}
#tip{position:absolute;left:50%;bottom:9cqmin;transform:translateX(-50%);display:none;align-items:center;gap:2cqmin;background:rgba(255,255,255,.94);border:.5cqmin solid var(--ink);border-radius:6cqmin;padding:1cqmin 3.6cqmin 1cqmin 2.4cqmin;font-size:3.4cqmin;color:var(--ink);white-space:nowrap;box-shadow:0 .7cqmin 0 rgba(43,33,24,.28)}
#tip.on{display:flex;animation:tipin .4s ease-out}#tip svg{width:9cqmin;height:4.5cqmin}
@keyframes tipin{from{opacity:0;margin-bottom:-2cqmin}to{opacity:1;margin-bottom:0}}

/* ---------- Ending（争いの言葉なし。くらべっこの けっか） ---------- */
.endleft{position:absolute;left:5cqmin;top:5cqmin;width:78cqmin;display:flex;flex-direction:column;align-items:center;gap:2cqmin;text-align:center}
.found{font-size:11.6cqmin;font-weight:900;line-height:1.12;color:var(--orange);--e:.5cqmin;
  -webkit-text-stroke:1.5cqmin var(--ink);paint-order:stroke fill;text-shadow:0 1.2cqmin 0 rgba(43,33,24,.3);animation:bob 2.4s ease-in-out infinite}
.found{word-break:keep-all;text-wrap:balance}
.found.long{font-size:8.6cqmin}
#ending[data-res=opp] .found{color:var(--cyan)}
#ending[data-res=same] .found{color:var(--pink)}
.who{display:flex;align-items:center;justify-content:center;gap:1.8cqmin;background:#fff;border:.5cqmin solid var(--ink);padding:1cqmin 4cqmin 1cqmin 2cqmin;border-radius:7cqmin;font-size:4.4cqmin;line-height:1.25;box-shadow:0 .7cqmin 0 rgba(43,33,24,.25);max-width:100%}
.who .gemi{display:block;width:7cqmin;height:7cqmin;flex:none}.who .gemi svg{width:100%;height:100%}
.endrec{display:flex;align-items:center;gap:1.4cqmin;background:var(--cream);border:.5cqmin solid var(--ink);box-shadow:0 .7cqmin 0 rgba(43,33,24,.25);border-radius:5cqmin;padding:.8cqmin 3cqmin .8cqmin 1.4cqmin;font-size:3.4cqmin;color:var(--ink);text-align:left;max-width:100%}
.endrec .rc-ico{width:7cqmin;height:7cqmin}.endrec .rc-col{display:flex;flex-direction:column;align-items:flex-start;gap:.5cqmin}
.endrec b{font-size:3.3cqmin;font-weight:900;white-space:nowrap}
.endrec .rc-n{display:flex;flex-wrap:wrap;gap:0 2.4cqmin}.endrec .rl{white-space:nowrap}
.endtitle{font-size:9cqmin;font-weight:900;color:var(--ink);line-height:1.1;margin-top:.6cqmin;background:rgba(255,255,255,.9);padding:1cqmin 4cqmin;border-radius:4cqmin;border:.5cqmin solid var(--ink)}
.endyomi{font-size:3.8cqmin;color:var(--mute);margin-top:-1cqmin}
.endpic{position:absolute;left:86cqmin;right:6cqmin;top:7cqmin;bottom:25cqmin;display:flex;align-items:center;justify-content:center}
.endpic img{max-width:100%;max-height:100%;object-fit:contain;box-sizing:border-box;background:#fff;padding:1.6cqmin;border-radius:2cqmin;border:.6cqmin solid var(--ink);box-shadow:0 1.4cqmin 0 rgba(43,33,24,.3);transform:rotate(1.2deg)}
.endpic img.pix{image-rendering:crisp-edges;image-rendering:pixelated}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-6cqmin;width:2cqmin;height:3.2cqmin;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112cqmin) rotate(540deg)}}

</style>
</head>
<body data-state="boot" data-mode="solo">
<div id="app">
  <div id="stage">
    <div id="bg" aria-hidden="true">
      <i class="blk b1"></i><i class="blk b2"></i><i class="blk b3"></i>
      <i class="tw t1"></i><i class="tw t2"></i><i class="tw t3"></i><i class="tw t4"></i><i class="tw t5"></i>
    </div>
    <div id="worldbox"></div>

    <!-- 1 Boot -->
    <section id="boot" class="screen">
      <div class="center">
        <div data-logo="0.95"></div>
        <div class="touchme"><span class="ring"></span>がめんを さわってね</div>
      </div>
    </section>

    <!-- 2 Title -->
    <section id="title" class="screen">
      <div class="titlelogo" data-logo="0.86"></div>
      <div class="mascot m-l" data-mascot="#e08524"></div>
      <div class="mascot m-r" data-mascot="#2f8be0"></div>
      <div id="recchip" class="recchip"></div>
    </section>

    <!-- 3 Setting -->
    <section id="setting" class="screen" data-sub="how">
      <button type="button" id="back" class="backbtn" tabindex="-1"><i></i><span>もどる</span></button>
      <div id="sethead" class="head">あそびかたを えらんでね</div>

      <div class="pane sub-how">
        <button type="button" class="howcard" data-kind="race" tabindex="-1"><i class="hpic" data-art="race"></i><b>どっちが はやい？</b><small>たからは ひとつ。<br>さきに みつけよう！</small></button>
        <button type="button" class="howcard" data-kind="count" tabindex="-1"><i class="hpic" data-art="count"></i><b>どっちが おおい？</b><small>10この たから。10ぷんで<br>たくさん あつめよう！</small></button>
        <button type="button" class="howcard" data-kind="solo" tabindex="-1"><i class="hpic" data-art="solo"></i><b>ひとりで れんしゅう</b><small>ひとりで ゆっくり<br>ためしてみよう</small></button>
      </div>

      <div class="pane sub-who">
        <button type="button" class="bigcard" data-who="cpu" tabindex="-1"><i class="wpic" data-art="cpu"></i><span>コンピューターと あそぶ</span></button>
        <button type="button" class="bigcard" data-who="net" tabindex="-1"><i class="wpic" data-art="friends"></i><span>ともだちと あそぶ</span></button>
      </div>

      <div class="pane sub-level">
        <button type="button" class="lvcard" data-level="easy" tabindex="-1"><i class="lvpic"></i><b>やさしい</b><small>ゆっくり うごくよ</small><em></em></button>
        <button type="button" class="lvcard" data-level="normal" tabindex="-1"><i class="lvpic"></i><b>ふつう</b><small>ふつうの はやさだよ</small><em></em></button>
        <button type="button" class="lvcard" data-level="hard" tabindex="-1"><i class="lvpic"></i><b>むずかしい</b><small>とっても はやいよ</small><em></em></button>
      </div>

      <div class="pane sub-opts">
        <div class="setcard" data-card="swipeRev">
          <div class="sc-head"><i class="sc-ico" data-ico="swipe"></i><span>スワイプの むき</span></div>
          <div class="seg"><button type="button" data-set="swipeRev" data-val="0" tabindex="-1">ふつう</button><button type="button" data-set="swipeRev" data-val="1" tabindex="-1">はんたい</button></div>
          <div class="sc-hint" id="hint-swipeRev"></div>
        </div>
        <div class="setcard" data-card="binary">
          <div class="sc-head"><i class="sc-ico" data-ico="bw"></i><span>えを しろくろに する</span></div>
          <div class="seg"><button type="button" data-set="binary" data-val="1" tabindex="-1">する</button><button type="button" data-set="binary" data-val="0" tabindex="-1">しない</button></div>
          <div class="sc-hint" id="hint-binary"></div>
        </div>
        <div class="setcard wide" data-card="record">
          <div class="sc-head"><i class="sc-ico" data-ico="trophy"></i><span>くらべっこの きろく</span></div>
          <div class="sc-hint" id="hint-record"></div>
          <div class="seg one"><button type="button" id="reset-rec" class="danger" tabindex="-1">きろくを けす</button></div>
        </div>
      </div>

      <div class="pane sub-choice">
        <button type="button" class="bigcard" id="c-host" tabindex="-1">
          <svg viewBox="0 0 64 64"><path d="M32 6 6 30h8v26h36V30h8z" fill="#ffe400" stroke="#2b2118" stroke-width="3.500" stroke-linejoin="round"/><path d="M32 22l3.500 7.500 8 1-6 5.500 1.700 8L32 39.800 24.800 44l1.700-8-6-5.500 8-1z" fill="#d97eb8" stroke="#2b2118" stroke-width="2"/></svg>
          <span>へやを つくる</span>
        </button>
        <button type="button" class="bigcard" id="c-join" tabindex="-1">
          <svg viewBox="0 0 64 64"><rect x="14" y="8" width="36" height="50" rx="4" fill="#8be6ff" stroke="#2b2118" stroke-width="3.500"/><rect x="20" y="14" width="24" height="38" rx="2" fill="#19c8f5" stroke="#2b2118" stroke-width="2"/><circle cx="39" cy="34" r="3" fill="#ffe400" stroke="#2b2118" stroke-width="1.500"/><path d="M2 34h14m-5-6 6 6-6 6" stroke="#e08524" stroke-width="5.500" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>へやに はいる</span>
        </button>
      </div>

      <div class="pane sub-code">
        <div class="digits" id="codeshow"></div>
        <div class="waiting">あいてを まっているよ<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
      </div>

      <div class="pane sub-pick">
        <div class="maps" id="cards"></div>
        <div class="preview" id="preview"></div>
      </div>

      <div class="pane sub-keypad">
        <div class="digits grid2" id="codein"></div>
        <div class="keypad" id="keypad"></div>
      </div>

      <div class="pane sub-msg">
        <div class="msgface" id="msgface"></div>
        <div class="msgtext" id="msgtext"></div>
      </div>
    </section>

    <!-- 4 Play -->
    <section id="play" class="screen">
      <div id="swipe"></div>
      <div id="sonar"><canvas id="sonar-cv" width="288" height="288"></canvas></div>
      <div id="hud">
        <div id="timer"><i data-ico="clock"></i><b id="t-val">10:00</b></div>
        <div id="scorebar"><span class="sb me"><i data-ico="gem"></i>きみ <b id="s-me">0</b>こ</span><span class="sb op"><i data-ico="gem"></i>あいて <b id="s-op">0</b>こ</span></div>
      </div>
      <div id="maptag"><b id="pt-title"></b><small id="pt-yomi"></small></div>
      <div id="notice"></div>
      <div id="pop"></div>
      <div id="tip"><svg viewBox="0 0 64 32"><path d="M4 16h56M12 8 4 16l8 8M52 8l8 8-8 8" fill="none" stroke="#2b2118" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ゆびを よこに うごかすと むきが かわるよ</span></div>
      <button type="button" id="fwd" class="ctl" data-act="fwd" tabindex="-1"><i data-ico="fwd"></i><span>すすむ</span></button>
      <button type="button" id="b-jump" class="ctl act" data-act="jump" tabindex="-1"><i data-ico="jump"></i><span>ジャンプ</span></button>
      <button type="button" id="b-attack" class="ctl act" data-act="drillAttack" tabindex="-1"><i data-ico="attack"></i><span>ドリル<br>アタック</span></button>
      <button type="button" id="b-dj" class="ctl act" data-act="drillJump" tabindex="-1"><i data-ico="drilljump"></i><span>ドリル<br>ジャンプ</span></button>
      <button type="button" id="cam" tabindex="-1"><i id="cam-ico"></i><span id="cam-label">おいかけ</span></button>
    </section>

    <!-- 5 Ending -->
    <section id="ending" class="screen">
      <div id="confetti"></div>
      <div class="endleft">
        <div class="found" id="end-found">みつけた！</div>
        <div class="who" id="end-who"></div>
        <div class="endrec" id="end-rec"></div>
        <div class="endtitle" id="end-title"></div>
        <div class="endyomi" id="end-yomi"></div>
      </div>
      <div class="endpic"><img id="end-pic" alt=""></div>
    </section>

    <!-- 6 Quit -->
    <section id="quit" class="screen">
      <div class="center">
        <div data-logo="0.7"></div>
        <div class="bye">おしまい またね！</div>
      </div>
    </section>

    <div id="nav"></div>
    <button type="button" id="home" aria-label="ホーム" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 3 1.500 12.500H5V21h5.500v-6h3v6H19v-8.500h3.500z"/></svg></button>

    <div id="modal">
      <div class="mcard">
        <div class="mtitle" id="m-title">おわりにしますか？</div>
        <div class="mbtns">
          <button type="button" id="m-no" class="nbtn primary" tabindex="-1"><span id="m-no-t">いいえ</span></button>
          <button type="button" id="m-yes" class="nbtn secondary" tabindex="-1"><span id="m-yes-t">はい</span></button>
        </div>
      </div>
    </div>
  </div>

/* ============================================================
   seeker.js : 主人公シーカーの3Dモデル部品（見つけて！PixSee）
   山田さんの ref_pixsee/seeker3d.html の createSeeker を THREE r128（グローバル）に移植。
   公開は window.SeekerModel だけ。
     SeekerModel.create({color}) -> {root, flipPivot, rig, hatPivot, pole, eyes, tracks,
                                     stripeTex, setColor(c), update(dt, state), ...}
   座標：root の原点 = 足元中央（履帯の下端が y=0）/ +Y=上 / +Z=正面（目のある側）
   大きさ：幅・奥行きとも 1 マス（1.0）以内。
   ============================================================ */
(function () {
  'use strict';
  var T = window.THREE;

  /* ---- 寸法（山田さんの元の比率のまま作り、最後に SCALE で縮める） ---- */
  var SCALE = 0.75;          // 全体を縮める割合（元の幅1.2 → 約0.9、奥行き1.24 → 約0.93）
  var R = 0.62;              // ロールケーキ（円柱）の半径
  var LEN = 0.7;             // 円柱の長さ（X方向）
  var CY = 0.74;             // ボディ中心の高さ（元の座標）
  var TRK_W = 0.22;          // キャタピラの幅
  var TRK_X = LEN / 2 + TRK_W / 2 - 0.02;
  var TRK_S = 0.94;          // キャタピラ直線部の長さ
  var HAT_H = 0.95, HAT_R = 0.43;
  var HAT_Z = -0.15;         // 帽子の根元（ボディの上）の前後位置
  var BODY_BASE = CY - R;    // ボディの下端（つぶれるときの固定点）
  var SPEED_REF = 3.2;       // move=1 のときの進む速さ（元の単位/秒）＝ world の 2.4 マス/秒 ÷ SCALE
  var HAT_REST = -0.5;       // 帽子のふだんの傾き（後ろへ）

  var COL = { tan: 0xf0c46e, eye: 0x22e0a0, star: 0xd77fb8,
              frame: 0x3b434c, plate: 0x6d7a88, cleat: 0x6f7c89, wheel: 0xa7b3be, hub: 0x2b2f35 };

  /* ---- トゥーン調（段々の陰影）と黒い輪郭線 ---- */
  var grad = new T.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, T.LuminanceFormat);
  grad.minFilter = grad.magFilter = T.NearestFilter;
  grad.needsUpdate = true;
  function toon(c, extra) {
    var o = { color: c, gradientMap: grad };
    if (extra) for (var k in extra) o[k] = extra[k];
    return new T.MeshToonMaterial(o);
  }
  var inkBasic = new T.MeshBasicMaterial({ color: 0x000000 });
  var inkCache = {};
  function inkMaterial(t) {
    var key = String(t);
    if (!inkCache[key]) {
      inkCache[key] = new T.ShaderMaterial({
        uniforms: { t: { value: t } },
        vertexShader: 'uniform float t; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * t, 1.0); }',
        fragmentShader: 'void main(){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); }',
        side: T.BackSide
      });
    }
    return inkCache[key];
  }

  /* 同じ位置の頂点をひとつにまとめる（r128 には mergeVertices が無いので自前） */
  function weld(geo) {
    var pos = geo.attributes.position, idx = geo.index;
    var map = {}, out = [], remap = new Array(pos.count), i, key;
    for (i = 0; i < pos.count; i++) {
      var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      key = Math.round(x * 1e4) + ',' + Math.round(y * 1e4) + ',' + Math.round(z * 1e4);
      if (map[key] === undefined) { map[key] = out.length / 3; out.push(x, y, z); }
      remap[i] = map[key];
    }
    var tri = [];
    if (idx) { for (i = 0; i < idx.count; i++) tri.push(remap[idx.getX(i)]); }
    else tri = remap.slice();
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(out, 3));
    g.setIndex(tri);
    g.computeVertexNormals();
    return g;
  }
  /* 反転法線の輪郭線（元の方式） */
  function withInk(mesh, t) {
    var o = new T.Mesh(weld(mesh.geometry), inkMaterial(t === undefined ? 0.015 : t));
    o.userData.ink = true;
    mesh.add(o);
    return mesh;
  }

  /* 複数の形をひとつのジオメトリにまとめる */
  function mergeGeos(list) {
    var P = [], N = [];
    list.forEach(function (g) {
      var n = g.toNonIndexed();
      for (var i = 0; i < n.attributes.position.array.length; i++) {
        P.push(n.attributes.position.array[i]); N.push(n.attributes.normal.array[i]);
      }
    });
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(P, 3));
    g.setAttribute('normal', new T.Float32BufferAttribute(N, 3));
    return g;
  }

  function starShape(ro, ri) {
    var s = new T.Shape();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? ri : ro, a = Math.PI / 2 + i * Math.PI / 5;
      var x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i) s.lineTo(x, y); else s.moveTo(x, y);
    }
    s.closePath();
    return s;
  }

  /* 帽子（ドリル）のしましま。offset を動かすとらせん状に回って見える */
  var stripeCanvas = null;
  function makeStripeTexture() {
    if (!stripeCanvas) {
      var c = stripeCanvas = document.createElement('canvas');
      c.width = c.height = 256;
      var g = c.getContext('2d');
      g.fillStyle = '#00d4ff'; g.fillRect(0, 0, 256, 256);
      g.fillStyle = '#ffee00';
      for (var k = 0; k <= 8; k++) {
        g.beginPath();
        g.moveTo(k * 64, 0); g.lineTo(k * 64 + 18, 0);
        g.lineTo(k * 64 + 18 - 256, 256); g.lineTo(k * 64 - 256, 256);
        g.closePath(); g.fill();
      }
    }
    var t = new T.CanvasTexture(stripeCanvas);
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  }

  /* 円柱の端面（クリーム色の輪＋白い穴＋ピンクの星） */
  function makeEnd(sign) {
    var g = new T.Group();
    g.position.set(sign * LEN / 2, CY, 0);
    g.rotation.y = sign * Math.PI / 2;          // ローカル +Z が外向き
    var rim = new T.Mesh(new T.TorusGeometry(R * 0.985, 0.012, 8, 72), inkBasic);
    var line = new T.Mesh(new T.TorusGeometry(R * 0.84, 0.004, 6, 72), new T.MeshBasicMaterial({ color: 0x8a7a5a }));
    line.position.z = 0.002;
    var hole = new T.Mesh(new T.CircleGeometry(R * 0.6, 48), toon(0xffffff));
    hole.position.z = 0.004;
    var holeRim = new T.Mesh(new T.TorusGeometry(R * 0.6, 0.013, 8, 48), inkBasic);
    holeRim.position.z = 0.004;
    var sInk = new T.Mesh(new T.ExtrudeGeometry(starShape(0.245, 0.118), { depth: 0.01, bevelEnabled: false }), inkBasic);
    sInk.position.set(0, -0.02, 0.006);
    var sPink = new T.Mesh(new T.ExtrudeGeometry(starShape(0.215, 0.095),
      { depth: 0.012, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2 }), toon(COL.star));
    sPink.position.set(0, -0.02, 0.014);
    g.add(rim, line, hole, holeRim, sInk, sPink);
    return g;
  }

  /* ---- 硬いキャタピラ：角のある金属の板が、すき間をあけて並んで回る ---- */
  var TREAD_N = 26, TREAD_RP = 0.16, PLATE_T = 0.04, CLEAT = 0.012;
  var TRK_CY = TREAD_RP + PLATE_T / 2 + CLEAT;      // 板のでっぱりの下端がちょうど y=0 になる高さ
  var TREAD_PM = 2 * TRK_S + 2 * Math.PI * TREAD_RP;
  var _d = new T.Object3D();
  function layoutTreads(inst, off) {
    var S = TRK_S, rp = TREAD_RP, cy = TRK_CY;
    for (var i = 0; i < TREAD_N; i++) {
      var s = (((i * TREAD_PM / TREAD_N + off) % TREAD_PM) + TREAD_PM) % TREAD_PM;
      var y, z, dy, dz;
      if (s < S) { y = cy + rp; z = -S / 2 + s; dy = 0; dz = 1; }
      else if (s < S + Math.PI * rp) {
        var th = (s - S) / rp; z = S / 2 + rp * Math.sin(th); y = cy + rp * Math.cos(th); dz = Math.cos(th); dy = -Math.sin(th);
      } else if (s < 2 * S + Math.PI * rp) {
        var u = s - S - Math.PI * rp; z = S / 2 - u; y = cy - rp; dy = 0; dz = -1;
      } else {
        var th2 = (s - 2 * S - Math.PI * rp) / rp; z = -S / 2 - rp * Math.sin(th2); y = cy - rp * Math.cos(th2); dz = -Math.cos(th2); dy = Math.sin(th2);
      }
      _d.position.set(0, y, z); _d.rotation.set(Math.atan2(-dy, dz), 0, 0); _d.updateMatrix();
      inst.setMatrixAt(i, _d.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  }
  var plateGeo = null, trackBodyGeo = null;
  function getPlateGeo() {
    if (!plateGeo) {
      var w = TRK_W * 0.96;
      var base = new T.BoxGeometry(w, PLATE_T, 0.09);
      var cleat = new T.BoxGeometry(w, CLEAT, 0.03);          // 外側のでっぱり（すべり止め）
      cleat.translate(0, PLATE_T / 2 + CLEAT / 2, 0);
      plateGeo = mergeGeos([base, cleat]);
    }
    return plateGeo;
  }
  function makeTrack(sign) {
    var group = new T.Group(); group.position.x = sign * TRK_X;
    var rb = 0.14, cy = TRK_CY, S = TRK_S;
    if (!trackBodyGeo) {
      var sh = new T.Shape();
      sh.moveTo(-S / 2, cy - rb); sh.lineTo(S / 2, cy - rb);
      sh.absarc(S / 2, cy, rb, -Math.PI / 2, Math.PI / 2, false);
      sh.lineTo(-S / 2, cy + rb);
      sh.absarc(-S / 2, cy, rb, Math.PI / 2, Math.PI * 1.5, false);
      trackBodyGeo = new T.ExtrudeGeometry(sh, { depth: TRK_W * 0.9, bevelEnabled: false, curveSegments: 16 });
      trackBodyGeo.rotateY(Math.PI / 2); trackBodyGeo.translate(-TRK_W * 0.45, 0, 0);
    }
    var bodyMesh = new T.Mesh(trackBodyGeo, toon(COL.frame));
    group.add(bodyMesh);

    var inst = new T.InstancedMesh(getPlateGeo(), toon(COL.plate), TREAD_N);
    inst.frustumCulled = false; layoutTreads(inst, 0);
    group.add(inst);

    var wheels = [];
    [-0.33, 0, 0.33].forEach(function (z) {
      var w = new T.Group(); w.position.set(sign * (TRK_W / 2 + 0.014), cy, z);
      var disc = new T.Mesh(new T.CylinderGeometry(0.1, 0.1, 0.03, 20).rotateZ(Math.PI / 2), toon(COL.wheel));
      var hub = new T.Mesh(new T.CylinderGeometry(0.035, 0.035, 0.045, 10).rotateZ(Math.PI / 2), toon(COL.hub));
      var ring = new T.Mesh(new T.TorusGeometry(0.1, 0.009, 6, 20).rotateY(Math.PI / 2), inkBasic);
      w.add(disc, hub, ring); group.add(w); wheels.push(w);
    });
    return { group: group, inst: inst, wheels: wheels, phase: 0 };
  }

  /* 帽子の傾き th に対して、帽子がボディにめり込まない最短の棒の長さ（元の単位） */
  function poleLength(th) {
    var need = 0;
    if (th < -0.35) need = (-0.35 - th) * 0.28;
    else if (th > -0.12) need = (th + 0.12) * 0.28;
    return Math.max(0.075, need + 0.035);
  }

  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };

  function create(opts) {
    opts = opts || {};
    var color = opts.color !== undefined ? opts.color : 0xe08524;
    var root = new T.Group(); root.name = 'seeker';
    var flipPivot = new T.Group(); flipPivot.name = 'flipPivot';
    flipPivot.scale.setScalar(SCALE);
    flipPivot.position.y = CY * SCALE;
    root.add(flipPivot);
    var rig = new T.Group(); rig.position.y = -CY; flipPivot.add(rig);

    // 凹む部分（ボディ・端面・目）。ボディの下端を固定点にして縦につぶす
    var bodyGroup = new T.Group(); bodyGroup.position.y = BODY_BASE;
    var inner = new T.Group(); inner.position.y = -BODY_BASE; bodyGroup.add(inner);
    rig.add(bodyGroup);

    var bodyMat = toon(color);
    var body = new T.Mesh(new T.CylinderGeometry(R, R, LEN, 48).rotateZ(Math.PI / 2), [bodyMat, toon(COL.tan), toon(COL.tan)]);
    body.position.y = CY; withInk(body, 0.016);
    inner.add(body, makeEnd(1), makeEnd(-1));

    // バイザーと緑の目（正面 +Z）
    var visor = new T.Mesh(new T.SphereGeometry(1, 24, 12), inkBasic);
    visor.scale.set(0.3, 0.17, 0.06); visor.position.set(0, CY, R - 0.005);
    var eyeMat = new T.MeshBasicMaterial({ color: COL.eye });
    var eyeGeo = new T.SphereGeometry(1, 16, 12);
    var eyeL = new T.Mesh(eyeGeo, eyeMat), eyeR = new T.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.1, CY, R + 0.03); eyeR.position.set(0.1, CY, R + 0.03);
    eyeL.scale.set(0.065, 0.105, 0.025); eyeR.scale.set(0.065, 0.105, 0.025);
    inner.add(visor, eyeL, eyeR);

    // ドリルになる帽子＋短い黒い棒（傘の柄）。根元 hatPivot はボディの上に乗る
    var stripeTex = makeStripeTexture();
    var hatPivot = new T.Group(); hatPivot.name = 'hat';
    var pole = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 1, 10), inkBasic);   // 高さ1 を伸縮して長さにする
    pole.name = 'pole';
    var cone = new T.Mesh(new T.ConeGeometry(HAT_R, HAT_H, 40, 1, false), toon(0xffffff, { map: stripeTex }));
    withInk(cone, 0.016);
    hatPivot.add(pole, cone);
    rig.add(hatPivot);

    // キャタピラ（左右）
    var tracks = [makeTrack(1), makeTrack(-1)];   // [0]=+X側, [1]=-X側
    tracks.forEach(function (t) { rig.add(t.group); });

    var st = { hatA: HAT_REST, hatV: 0, blinkT: 2, prevSquash: 0, stripe: 0 };
    var api = {
      root: root, flipPivot: flipPivot, rig: rig, hatPivot: hatPivot, pole: pole,
      eyes: [eyeL, eyeR], tracks: tracks, stripeTex: stripeTex, bodyGroup: bodyGroup,
      setColor: function (c) { bodyMat.color.set(c); },
      update: function (dt, s) {
        s = s || {};
        dt = Math.min(dt || 0, 0.05);
        var move = s.move || 0, turn = s.turn || 0;
        var squash = clamp(s.squash || 0, 0, 1), flip = clamp(s.flip || 0, 0, 1);
        var fwdK = clamp(s.hatForward || 0, 0, 1);
        var spin = s.spin === undefined ? 0.15 : s.spin;

        // キャタピラ：左右の履帯と車輪を別々に回す（その場旋回もそれらしく）
        var fwd = move * SPEED_REF;
        tracks[0].phase += (fwd - turn * TRK_X) * dt;
        tracks[1].phase += (fwd + turn * TRK_X) * dt;
        tracks.forEach(function (t) {
          layoutTreads(t.inst, t.phase);
          t.wheels.forEach(function (w) { w.rotation.x = t.phase / 0.1; });
        });

        // 凹み：縦につぶれて横にふくらむ
        var sy = 1 - 0.32 * squash, sxz = 1 + 0.06 * squash;
        bodyGroup.scale.set(sxz, sy, sxz);

        // 逆さ
        flipPivot.rotation.x = flip * Math.PI;

        // 帽子：ばねでぷるぷる。ドリル中（逆さ・高速回転）はまっすぐ立つ
        var drilling = flip > 0.02 || spin >= 1;
        var target = drilling ? 0 : -(0.45 + 0.12 * Math.min(1, Math.abs(move)));
        st.hatV += (st.prevSquash - squash) * -6;      // 凹み・戻りでぴょこっと揺れる
        st.prevSquash = squash;
        st.hatV += (target - st.hatA) * 180 * dt; st.hatV *= Math.exp(-9 * dt); st.hatA += st.hatV * dt;
        st.hatA = clamp(st.hatA, -0.85, 0.3);

        // 根元の位置：ふだんはボディの上。hatForward で円周に沿って正面へ回り込む
        var a0 = Math.asin(HAT_Z / R);                 // 約 -14 度
        var alpha = lerp(a0, Math.PI / 2, fwdK);
        var rot = lerp(st.hatA, Math.PI / 2, fwdK);
        var yc = BODY_BASE + R * sy;                   // つぶれたあとのボディ中心
        var L = poleLength(st.hatA);
        L = lerp(L, 0.1, fwdK) + 0.14 * fwdK * (1 - fwdK);
        hatPivot.position.set(0, yc + R * sy * Math.cos(alpha), R * sxz * Math.sin(alpha));
        hatPivot.rotation.x = rot;
        hatPivot.rotation.z = clamp(-turn * 0.03, -0.15, 0.15) * (1 - fwdK);
        pole.scale.y = L + 0.04;                       // 少しだけボディの中まで入れる（すき間を作らない）
        pole.position.y = (L - 0.04) / 2;
        cone.position.y = L + HAT_H / 2;

        // しましまの回転
        st.stripe += spin * dt;
        stripeTex.offset.x = st.stripe;

        // まばたき（blink が指定されなければ自動）
        var closed;
        if (s.blink === undefined) {
          st.blinkT -= dt; if (st.blinkT < -0.12) st.blinkT = 1.5 + Math.random() * 3;
          closed = st.blinkT < 0;
        } else closed = !!s.blink;
        var ey = closed ? 0.015 : 0.105;
        eyeL.scale.y = ey; eyeR.scale.y = ey;
      }
    };
    api.tipDepth = (yPivotTop() + poleLength(0) + HAT_H - CY) * SCALE;
    api.update(0, {});
    return api;
  }
  function yPivotTop() { return CY + Math.sqrt(R * R - HAT_Z * HAT_Z); }

  window.SeekerModel = { create: create, SCALE: SCALE };
})();

// ===== world.js =====
/* world.js — 3Dの世界（地形・シーカー・操作・カメラ・掘る演出・宝・CPU）
   「見つけて！PixSee」第3期。公開するのは window.World だけ。THREE は r128 のグローバルを使う。
   シーカーの3Dモデルは seeker.js の window.SeekerModel（無いときは箱で代用して止まらない）。 */
(function () {
  'use strict';

  // 見た目の高さ：1段 = STEP_H。高さ0と1は「紙に塗った色」（平ら）、2〜10が積み木。壁（10）は 9段 = 1.8 の高さ（約2マス分）。
  var STEP_H = 0.2;
  function vis(h) { return h <= 1 ? 0 : (h - 1) * STEP_H; }
  var FLOOR_SAT = 1.9; // 床の色の鮮やかさ（1で元の色）
  var DX = [0, 1, 0, -1];
  var DZ = [-1, 0, 1, 0];

  // ---- 動き（単位：マス・秒）----
  var SPEED = 2.4;        // 「すすむ」の速さ（マス/秒）
  var AIR_SPEED = 2.4;    // 空中で前へ進む速さ（CPUがゆっくりでも、前方ジャンプは届くように）
  var KEY_TURN = 2.6;     // ひだり・みぎ（キーボード）で回る速さ（ラジアン/秒）
  var SWIPE_GAIN = Math.PI; // 画面の幅いっぱいスワイプすると半回転
  var RAD = 0.3;          // 当たりの大きさ（中心から四角の半分）。1マスの通路を通れる
  var GRAV = 22;          // ジャンプの重さ（見た目の高さ/秒²）
  var JUMP_UP = 5;        // ジャンプで乗れる段数
  var JUMP_EXTRA = 0.08;  // 頂点は 足元+5段 の見た目より少し上
  var CROUCH = 0.13;      // 跳ぶ前に凹む時間
  var DA = { wind: 0.2, hit: 0.3, end: 0.62 };  // ドリルアタック：構える→当たる→もどる
  var DJ = { g: 14, rise: 0.95, flip: 0.42, hang: 0.22, bore: 0.55, popVy: 4.4, unflip: 0.45 }; // ドリルジャンプ
  // CPU：速さ（マス/秒）・回る速さ・動作のあとの間（秒）・まよう割合
  var CPU_LV = {
    easy: { speed: 0.9, turn: 2.4, pause: 0.6, doubt: 0.12 },
    normal: { speed: 1.6, turn: 4.2, pause: 0.25, doubt: 0.03 },
    hard: { speed: 2.4, turn: 7.5, pause: 0.06, doubt: 0 }
  };
  var CPU_WAIT0 = 0.4;   // 開始演出のあと、CPUが動き出すまでの間
  var NL = 11;           // 道さがしの段の数（0〜10）
  var PITCH_MAX = 1;     // 視点の上下（-1〜+1）
  var INTRO_HOLD = 2.0, INTRO_MOVE = 1.8; // 開始演出：真上から2秒見せて、斜め後ろへ寄せる
  var CAM_BLEND = 0.9;
  var DEBRIS_MAX = 600, PUFF_MAX = 64;
  var GEM_R = 0.42, GEM_Y = 0.95; // 宝石の大きさと高さ
  var SOIL = [0.851, 0.725, 0.549]; // 土の山の色 #d9b98c（淡いクレヨンの茶色）
  var SOIL_DUG = [196, 162, 116];   // 掘ったあとの地面の色

  // ---------- 小さな道具 ----------
  function sfx(name) { try { if (window.Sfx && window.Sfx.play) window.Sfx.play(name); } catch (e) { /* 音が無くても続ける */ } }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

// net.js : PeerJS 通信（window.Net だけ公開）。CONTRACT.md の window.Net を参照。
// 補足: host/join の失敗は「Promiseのreject」と「'error'イベント」の両方で知らせる（UIはどちらか一方で扱えばよい）。
//       reject する Error には .code（'unavailable-id' など）と、子ども向けの .message が付く。
(function () {

    noRoom: 'その ばんごうの へやが みつからないよ。ばんごうを たしかめてね',
    server: 'つうしんの じゅんびが できなかったよ。すこし まってから もういちど やってみてね',

  }

  function on(name, fn) {

      if (sub === 'error') return [{ label: 'もういちど', icon: 'again', kind: 'primary', fn: retry }];
      return [];

    if (state === 'ending') return [
      { label: 'もういちど', icon: 'again', kind: 'primary', fn: again },
      { label: 'おわる', icon: 'stop', kind: 'secondary', fn: function () { go('quit'); } }];

    var a = ((t || 0) / 1800) % 1 * Math.PI * 2;
    var sg = g.createConicGradient ? g.createConicGradient(a - Math.PI / 2, c, c) : null;
    if (sg) { sg.addColorStop(0, 'rgba(139,230,255,0)'); sg.addColorStop(0.9, 'rgba(139,230,255,0)'); sg.addColorStop(1, 'rgba(139,230,255,.35)'); g.fillStyle = sg; g.fillRect(0, 0, W, W); }
    // 宝
    var items = s.items || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i]; if (!it) continue;
      var dx = +it.dx || 0, dz = +it.dz || 0;
      var sx = (dx * -fz + dz * fx), sy = -(dx * fx + dz * fz); // 上が いま向いている方向
      var d = Math.hypot(sx, sy); if (d > SONAR_R) { sx *= SONAR_R / d; sy *= SONAR_R / d; }
      var px = c + sx * R / SONAR_R, py = c + sy * R / SONAR_R;
      var depth = Math.max(0, +it.depth || 0), al = Math.max(0.28, 1 - depth * 0.2);
      var pulse = 1 + 0.18 * Math.sin((t || 0) / 220 + i);
      var rad = (depth <= 0 ? 12 : 9) * pulse;
      var gl = g.createRadialGradient(px, py, 0, px, py, rad * 2.4);
      gl.addColorStop(0, 'rgba(255,228,0,' + (al * 0.9).toFixed(2) + ')'); gl.addColorStop(1, 'rgba(255,228,0,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(px, py, rad * 2.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(px, py, rad * 0.62, 0, Math.PI * 2); g.fillStyle = 'rgba(255,248,190,' + al.toFixed(2) + ')'; g.fill();
      g.lineWidth = 2.5; g.strokeStyle = 'rgba(43,33,24,' + al.toFixed(2) + ')'; g.stroke();
    }
    g.restore();
    // 自分（中央の矢印。上むき）
    g.save(); g.translate(c, c);
    g.beginPath(); g.moveTo(0, -17); g.lineTo(12, 13); g.lineTo(0, 7); g.lineTo(-12, 13); g.closePath();
    g.fillStyle = '#e08524'; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke();
    g.restore();
    // ふち（クリーム色とこい線）と 12時の しるし
    g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.lineWidth = 8; g.strokeStyle = '#fff4d6'; g.stroke();
    g.beginPath(); g.arc(c, c, R + 4, 0, Math.PI * 2); g.lineWidth = 3.500; g.strokeStyle = INK; g.stroke();
    g.beginPath(); g.moveTo(c, c - R + 2); g.lineTo(c - 9, c - R - 8); g.lineTo(c + 9, c - R - 8); g.closePath(); g.fillStyle = '#ffe400'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
  }

  // ---------------- Ending（争いの言葉は使わない） ----------------
  var END_BOX_W = 84, END_BOX_H = 62; // .endpic の中に入る大きさ（cqmin。枠の太さぶん小さめ）
  function showEndPic(src) {
    var img = els.endPic;
    img.onload = function () {
      var nw = img.naturalWidth || 1, nh = img.naturalHeight || 1, k = Math.min(END_BOX_W / nw, END_BOX_H / nh);
      img.style.width = (nw * k).toFixed(2) + 'cqmin';
      img.style.height = (nh * k).toFixed(2) + 'cqmin';
      img.classList.toggle('pix', Math.max(nw, nh) < 256);
    };
    img.src = src;
  }
  function fillEnding(r) {
    r = r || {};
    var m = map || {}, who = OPP_NAME[opp] || 'あいて';
    var head = '', line = '', res = 'solo', kind = gameMode, rr = null;
    if (kind === 'race') {
      var meWon = (r.winner === myIndex);
      res = meWon ? 'me' : 'opp';
      head = meWon ? 'きみが はやかった！' : who + 'が はやかった';
      line = meWon ? 'たからを さきに みつけたよ！' : 'たからを さきに みつけられたよ';
      if (!recorded) { recorded = true; rr = recOf('race', opp, curLevel); rr[meWon ? 'me' : 'opp']++; saveRecord(); }
    } else if (kind === 'count') {
      var s = r.scores || scores, a = num(s[0]), b = num(s[1]);
      res = a > b ? 'me' : (a < b ? 'opp' : 'same');
      head = res === 'me' ? 'きみの ほうが おおかった！' : (res === 'opp' ? who + 'の ほうが おおかった' : 'おなじ！');
      line = 'きみは ' + a + 'こ、' + who + 'は ' + b + 'こ みつけたよ';
      if (!recorded) { recorded = true; rr = recOf('count', opp, curLevel); rr[res]++; saveRecord(); }
    } else {
      head = 'みつけた！';
      line = 'たからを ほりだしたよ！';
      if (!recorded) { recorded = true; record.solo.n++; saveRecord(); }
      rr = record.solo;
    }
    els.ending.setAttribute('data-res', res);
    els.ending.setAttribute('data-kind', kind);
    els.endFound.textContent = head;
    els.endFound.classList.toggle('long', head.length > 9);
    els.endWho.innerHTML = '<i class="gemi">' + gemSvg(kind === 'solo' ? '#ffe400' : '#19c8f5') + '</i><span></span>';
    els.endWho.querySelector('span').textContent = line;
    // 記録（モード × あいて × むずかしさ）
    var lab = KIND_NAME[kind] + (opp === 'cpu' ? '・' + OPP_NAME.cpu + '・' + LEVEL_NAME[curLevel] : (opp === 'net' ? '・' + OPP_NAME.net : ''));
    els.endRec.innerHTML = '<span class="rc-ico">' + SETICO.trophy + '</span><span class="rc-col"><b></b><span class="rc-n"></span></span>';
    els.endRec.querySelector('b').textContent = lab;
    els.endRec.querySelector('.rc-n').innerHTML = recLines(kind, rr || record.solo).map(function (t) { return '<span class="rl">' + t + '</span>'; }).join('');
    els.endTitle.textContent = m.title || '';
    els.endTitle.style.display = m.title ? '' : 'none';
    els.endYomi.textContent = (m.reading && m.reading !== m.title) ? m.reading : '';
    els.endYomi.style.display = els.endYomi.textContent ? '' : 'none';
    if (m.picture) { showEndPic(m.picture); els.endPic.style.display = ''; } else els.endPic.style.display = 'none';
    var c = els.confetti; c.innerHTML = '';
    var cols = ['#d97eb8', '#ffe400', '#19c8f5', '#22dd99', '#f5a64a', '#e08524'];
    for (var i = 0; i < 26; i++) {
      var sp = doc.createElement('i');
      sp.style.left = (i * 3.9 + Math.random() * 3) + '%';
      sp.style.background = cols[i % cols.length];
      sp.style.animationDuration = (3 + Math.random() * 3) + 's';
      sp.style.animationDelay = (-Math.random() * 5) + 's';
      c.appendChild(sp);
    }
  }

  // ---------------- スワイプ（プレイ中の画面なぞり） ----------------
  // 左右：なぞった分だけ なめらかに向きが変わる（World.swipeTurn(画面はば比)）。上下：視点を少し上下。
  // ボタンの上から始めた操作は #swipe に届かない。ボタンを押している指とは 別の指で なぞれる。
  function newWorld() { return hasFn('World', 'sonar'); } // 新しい World なら 連続の swipeTurn、古いなら 90度ずつの代用
  function turnLegacy(d) {
    var act = d < 0 ? 'left' : 'right';
    call('World', 'press', act, true);
    setTimeout(function () { call('World', 'press', act, false); }, 40);
  }
  function unitPx() { var r = els.stage.getBoundingClientRect(); return Math.max(1, Math.min(r.width, r.height) / 100); }
  function swipeDown(e) {
    stopEv(e); unlock();
    if (state !== 'play' || modalOpen || sw) return;
    sw = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, axis: '', acc: 0 };
    try { els.swipe.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function swipeMove(e) {
    if (!sw || e.pointerId !== sw.id) return;
    stopEv(e);
    var u = unitPx(), dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.axis) {
      if (Math.hypot(dx, dy) < 1.6 * u) return;
      sw.axis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v'; sw.lx = sw.x; sw.ly = sw.y;
    }
    if (sw.axis === 'h') {
      var mx = e.clientX - sw.lx; sw.lx = e.clientX;
      if (!mx) return;
      hideTip();
      var rw = els.stage.getBoundingClientRect().width || 1;
      var d = mx / rw * (settings.swipeRev ? -1 : 1);
      if (newWorld() && hasFn('World', 'swipeTurn')) call('World', 'swipeTurn', d);
      else { // 古い World：一定いどう なぞるごとに 1回だけ向きを変える
        sw.acc += d; if (Math.abs(sw.acc) >= 0.12) { turnLegacy(sw.acc); sw.acc = 0; }
      }
    } else {
      var dd = e.clientY - sw.ly; sw.ly = e.clientY;
      if (dd) { hideTip(); call('World', 'nudgePitch', Math.max(-1, Math.min(1, -dd / (30 * u)))); } // 指を上へ＝視点が上へ
    }
  }
  function swipeUp(e) {
    if (!sw || e.pointerId !== sw.id) return;
    stopEv(e); sw = null;
  }
  function showTip() {
    clearTimeout(tipTimer); els.tip.classList.add('on');
    tipTimer = setTimeout(hideTip, 6500);
  }
  function hideTip() { clearTimeout(tipTimer); if (els.tip) els.tip.classList.remove('on'); }

  // ---------------- ホームとモーダル ----------------
  function openModal(kind) {
    if (modalOpen) return;
    modalKind = kind === 'reset' ? 'reset' : 'quit';
    $('m-title').textContent = modalKind === 'reset' ? 'きろくを ぜんぶ けしますか？' : 'おわりにしますか？';
    $('m-no-t').textContent = modalKind === 'reset' ? 'やめる' : 'いいえ';
    $('m-yes-t').textContent = modalKind === 'reset' ? 'けす' : 'はい';
    modalOpen = true; els.modal.classList.add('on'); sw = null;
    releaseAll();
    if (state === 'play') call('World', 'setPaused', true);
  }
  function closeModal() {
    if (!modalOpen) return;
    modalOpen = false; els.modal.classList.remove('on');
    if (state === 'play') applyPortraitPause();
  }
  function quitYes() {
    modalOpen = false; els.modal.classList.remove('on');
    if (modalKind === 'reset') { resetRecord(); return; }
    stopGame(); closeNet();
    go('quit');
  }
  function applyPortraitPause() {
    if (state !== 'play') return;
    call('World', 'setPaused', modalOpen || isPortrait());
  }

  // ---------------- キーボード（確認用） ----------------
  var KEYS = { ArrowUp: 'fwd', w: 'fwd', W: 'fwd', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
    ' ': 'jump', z: 'drillAttack', Z: 'drillAttack', x: 'drillJump', X: 'drillJump' };
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (state === 'boot') { e.preventDefault(); if (!e.repeat) leaveBoot(); return; }
    if (modalOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
      return;
    }
    if (state === 'play') {
      var act = KEYS[e.key];
      if (act) { e.preventDefault(); if (!e.repeat) press(act, true); return; }
      if (e.key === 'c' || e.key === 'C') { e.preventDefault(); if (!e.repeat) cycleCam(); return; }
      if (e.key === 'Escape') { e.preventDefault(); openModal(); }
      return;
    }
    if (state === 'setting' && sub === 'keypad') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keyIn(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); keyIn('del'); return; }
    }
    if (e.key === 'Enter') {
      var b = els.nav.querySelector('.nbtn');
      if (b) { e.preventDefault(); sfx('tap'); var it = navItems()[0]; if (it) it.fn(); }
    }
  }
  function onKeyUp(e) {
    var act = KEYS[e.key];
    if (act && state === 'play') { e.preventDefault(); press(act, false); }
  }

  function leaveBoot() {
    if (state !== 'boot') return;
    unlock(); sfx('tap');
    go('title');
  }

  // ---------------- 初期化 ----------------
  function init() {
    ['stage', 'nav', 'home', 'modal', 'setting', 'sethead', 'cards', 'preview', 'keypad', 'codein', 'codeshow', 'msgface', 'msgtext',
      'cam', 'notice', 'pop', 'confetti', 'swipe', 'tip', 'recchip', 'ending', 'timer'].forEach(function (id) { els[id] = $(id); });
    els.endFound = $('end-found'); els.endRec = $('end-rec');
    els.ptTitle = $('pt-title'); els.ptYomi = $('pt-yomi');
    els.camIco = $('cam-ico'); els.camLabel = $('cam-label');
    els.endWho = $('end-who'); els.endTitle = $('end-title'); els.endYomi = $('end-yomi'); els.endPic = $('end-pic');
    els.sonarCv = $('sonar-cv'); els.tVal = $('t-val'); els.sMe = $('s-me'); els.sOp = $('s-op');

    doc.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(function (n) { doc.addEventListener(n, function (e) { e.preventDefault(); }); });
    doc.addEventListener('keydown', onKeyDown);
    doc.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', releaseAll);
    if (window.matchMedia) {
      var mq = window.matchMedia('(orientation: portrait)');
      var h = function () { applyPortraitPause(); };
      if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
    }

    settings = loadSettings(); record = loadRecord();
    buildLogos();
    buildKeypad();
    var icos = doc.querySelectorAll('[data-ico]');
    for (var ii = 0; ii < icos.length; ii++) icos[ii].innerHTML = SETICO[icos[ii].getAttribute('data-ico')] || '';
    var arts = doc.querySelectorAll('[data-art]');
    for (var aa = 0; aa < arts.length; aa++) { var f0 = ART[arts[aa].getAttribute('data-art')]; arts[aa].innerHTML = f0 ? f0() : ''; }
    renderCards(); renderPreview();
    renderLevels(); renderSettings(); renderRecChip();
    updateCam();

    // Boot：画面のどこでも
    tap($('boot'), leaveBoot);
    tap(els.home, function () { openModal('quit'); });
    tap($('m-no'), closeModal);
    tap($('m-yes'), quitYes);
    els.modal.addEventListener('pointerdown', stopEv);
    els.modal.addEventListener('pointerup', stopEv);
    els.modal.addEventListener('click', stopEv);
    tap($('back'), backFromSetting);
    tap($('c-host'), startHost);
    tap($('c-join'), startJoin);
    tap(els.cam, cycleCam);
    tap($('reset-rec'), function () { openModal('reset'); });
    var segs = doc.querySelectorAll('.seg button[data-set]');
    for (var j = 0; j < segs.length; j++) (function (b) {
      tap(b, function () { setOpt(b.getAttribute('data-set'), b.getAttribute('data-val') === '1'); });
    })(segs[j]);
    var lvs = doc.querySelectorAll('.lvcard');
    for (var q = 0; q < lvs.length; q++) (function (b) { tap(b, function () { chooseLevel(b.getAttribute('data-level')); }); })(lvs[q]);
    var hows = doc.querySelectorAll('.howcard');
    for (var hh = 0; hh < hows.length; hh++) (function (b) { tap(b, function () { chooseKind(b.getAttribute('data-kind')); }); })(hows[hh]);
    var whos = doc.querySelectorAll('[data-who]');
    for (var ww = 0; ww < whos.length; ww++) (function (b) { tap(b, function () { chooseWho(b.getAttribute('data-who')); }); })(whos[ww]);
    // スワイプ受け口（ボタンより下の層。ボタンの上から始めた操作はここへ来ない）
    els.swipe.addEventListener('pointerdown', swipeDown);
    els.swipe.addEventListener('pointermove', swipeMove);
    els.swipe.addEventListener('pointerup', swipeUp);
    els.swipe.addEventListener('pointercancel', swipeUp);
    els.swipe.addEventListener('lostpointercapture', function (e) { if (sw && e.pointerId === sw.id) sw = null; });
    els.swipe.addEventListener('click', stopEv);
    els.swipe.addEventListener('contextmenu', stopEv);
    ['touchstart', 'touchmove'].forEach(function (n) { els.swipe.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
    var ctls = doc.querySelectorAll('.ctl[data-act]');
    for (var i = 0; i < ctls.length; i++) hold(ctls[i], ctls[i].getAttribute('data-act'));

    call('World', 'init', $('worldbox'));
    call('World', 'on', 'collect', onCollect);
    call('World', 'on', 'found', onFound);
    call('World', 'on', 'terrain', onTerrain);
    call('World', 'on', 'action', onAction);
    call('World', 'on', 'cam', function (top) { doc.body.classList.toggle('camtop', !!top); });
    call('World', 'on', 'state', onState);
    call('Net', 'on', 'open', onNetOpen);
    call('Net', 'on', 'data', onNetData);
    call('Net', 'on', 'close', onNetClose);

    state = 'boot'; doc.body.setAttribute('data-state', 'boot');
    renderNav();
    if (window.requestAnimationFrame) rafId = window.requestAnimationFrame(frame);
  }

  window.App = {
    // 確認用の手がかり（ゲームの進行には使わない）
    _found: function (idx) { if (gameMode === 'count') endCount(false); else endRace(idx === 1 ? 1 : 0); },
    _setTime: function (sec) { timeLeft = Math.max(0, +sec || 0); shownSec = -1; updateTimer(); }, // どっちが おおい？ の のこり時間を みじかくする
    _finish: function () { endCount(false); },
    _collect: function (idx, ti, sc) { onCollect(idx, ti, sc); }, // 宝を拾ったときと同じ処理（確認用）
    _info: function () { return { mode: gameMode, opp: opp, level: curLevel, left: timeLeft, scores: scores.slice(), total: totalTreasure, ended: ended }; },
    go: function (name) { if (['boot', 'title', 'setting', 'play', 'ending', 'quit'].indexOf(name) >= 0) go(name); },
    get state() { return state; }
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
