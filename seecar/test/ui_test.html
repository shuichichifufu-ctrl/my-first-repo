<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>見つめて見つけてほシーカー（SEE-CAR）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* 見つめて見つけてほシーカー style.css  寸法は #stage（16:9）を基準に cqmin で指定 */
*{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:100vh;height:100dvh;width:100%;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP","IPAGothic",system-ui,sans-serif;font-weight:800;color:#12327a}
#app{position:fixed;inset:0;height:100vh;height:100dvh;background:#000}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;outline:none}
svg{display:block}

#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.7778vh);height:min(100vh,56.25vw);
  width:min(100vw,177.7778dvh);height:min(100dvh,56.25vw);
  container-type:size;overflow:hidden;background:#bfe6ff}

/* ---------- 背景（クレヨンと紙） ---------- */
#bg{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 30% 40% at 8% 88%,rgba(255,120,150,.40),transparent 70%),
    radial-gradient(ellipse 28% 36% at 95% 85%,rgba(255,200,60,.45),transparent 70%),
    radial-gradient(ellipse 26% 30% at 70% 98%,rgba(120,210,140,.40),transparent 70%),
    radial-gradient(ellipse 24% 30% at 4% 12%,rgba(190,150,255,.35),transparent 70%),
    repeating-linear-gradient(112deg,rgba(255,255,255,0) 0 .9cqmin,rgba(255,255,255,.22) .9cqmin 1.1cqmin),
    linear-gradient(#8fd3ff 0%,#c9ecff 45%,#fffaf0 78%,#fff3d6 100%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .45 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.blk{position:absolute;display:block;border:.6cqmin solid rgba(40,40,60,.55);border-radius:.8cqmin;box-shadow:.8cqmin 1cqmin 0 rgba(40,40,60,.18)}
.b1{left:-4cqmin;bottom:-4cqmin;width:34cqmin;height:20cqmin;transform:rotate(-8deg);
  background:repeating-linear-gradient(60deg,#ff6b6b 0 1.2cqmin,#ff8f8f 1.2cqmin 2.2cqmin)}
.b2{right:-5cqmin;bottom:-3cqmin;width:38cqmin;height:22cqmin;transform:rotate(6deg);
  background:repeating-linear-gradient(-55deg,#4d9bff 0 1.2cqmin,#7fb8ff 1.2cqmin 2.2cqmin)}
.b3{left:58cqmin;bottom:-9cqmin;width:30cqmin;height:16cqmin;transform:rotate(-3deg);
  background:repeating-linear-gradient(80deg,#ffd23f 0 1.2cqmin,#ffe58a 1.2cqmin 2.2cqmin)}
.tw{position:absolute;display:block;width:4cqmin;height:4cqmin;background:#ffd23f;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle 2.4s ease-in-out infinite}
.t1{left:6cqmin;top:10cqmin}.t2{right:8cqmin;top:8cqmin;width:3cqmin;height:3cqmin;animation-delay:.5s;background:#ff8fb8}
.t3{left:24cqmin;top:58cqmin;width:3cqmin;height:3cqmin;animation-delay:1s;background:#8ee0a5}
.t4{right:20cqmin;top:52cqmin;animation-delay:1.4s}.t5{left:70cqmin;top:6cqmin;width:2.4cqmin;height:2.4cqmin;animation-delay:.9s;background:#b79cff}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(18deg)}}
body[data-state=play] #bg{display:none}

#worldbox{position:absolute;inset:0;background:#6fc2ff;visibility:hidden}
#worldbox canvas{display:block;width:100%;height:100%}
body[data-state=play] #worldbox{visibility:visible}

/* ---------- 画面の切り替え ---------- */
.screen{position:absolute;inset:0;display:none}
body[data-state=boot] #boot,body[data-state=title] #title,body[data-state=setting] #setting,
body[data-state=play] #play,body[data-state=ending] #ending,body[data-state=quit] #quit{display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}

/* ---------- ロゴ ---------- */
.logo{--k:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*.6cqmin);
  filter:drop-shadow(0 calc(var(--k)*1cqmin) 0 rgba(20,40,100,.28))}
.outl{color:#1f5fd9;text-shadow:
  -.5em 0 0 #fff,.5em 0 0 #fff,0 -.5em 0 #fff,0 .5em 0 #fff,
  -.36em -.36em 0 #fff,.36em -.36em 0 #fff,-.36em .36em 0 #fff,.36em .36em 0 #fff,
  -.5em -.2em 0 #fff,.5em -.2em 0 #fff,-.5em .2em 0 #fff,.5em .2em 0 #fff,
  -.2em -.5em 0 #fff,.2em -.5em 0 #fff,-.2em .5em 0 #fff,.2em .5em 0 #fff}
.logo-top{font-size:calc(var(--k)*6.6cqmin);letter-spacing:.04em;line-height:1.1;--e:calc(var(--k)*.28cqmin);color:#1f5fd9;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff,
  calc(var(--e)*2) 0 #fff,calc(var(--e)*-2) 0 #fff,0 calc(var(--e)*2) #fff,0 calc(var(--e)*-2) #fff}
.logo-main{display:flex;align-items:center;gap:calc(var(--k)*1cqmin)}
.logo-name{font-size:calc(var(--k)*17cqmin);line-height:1;letter-spacing:.02em;font-weight:900;--e:calc(var(--k)*.55cqmin);color:#1f66e8;
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff,
  calc(var(--e)*2) 0 #fff,calc(var(--e)*-2) 0 #fff,0 calc(var(--e)*2) #fff,0 calc(var(--e)*-2) #fff,calc(var(--e)*2) calc(var(--e)*2) #fff,calc(var(--e)*-2) calc(var(--e)*2) #fff,calc(var(--e)*2) calc(var(--e)*-2) #fff,calc(var(--e)*-2) calc(var(--e)*-2) #fff,
  0 calc(var(--e)*3.4) 0 #0e2f7a}
.logo-en{font-size:calc(var(--k)*5.6cqmin);letter-spacing:.14em;line-height:1;padding:calc(var(--k)*.8cqmin) calc(var(--k)*5cqmin);border-radius:calc(var(--k)*5cqmin);
  background:linear-gradient(#2a5fd0,#143c9c);color:#ffe45e;border:calc(var(--k)*.6cqmin) solid #fff}
.star{position:relative;width:calc(var(--k)*29cqmin);height:calc(var(--k)*29cqmin);flex:none;animation:bob 2.6s ease-in-out infinite}
.star i{position:absolute;inset:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star .s1{background:#fff}
.star .s2{transform:scale(.93);background:conic-gradient(#ff5d8f,#ffb703,#8ecae6,#7bd389,#b388ff,#ff5d8f)}
.star .s3{transform:scale(.8);background:radial-gradient(circle at 40% 30%,#fff6a8,#ffd23f 55%,#ffae00)}
.star b{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);text-align:center;font-size:calc(var(--k)*14cqmin);line-height:1;font-weight:900;color:#1f5fd9;--e:calc(var(--k)*.4cqmin);
  text-shadow:calc(var(--e)*-1) 0 #fff,var(--e) 0 #fff,0 calc(var(--e)*-1) #fff,0 var(--e) #fff,calc(var(--e)*-1) calc(var(--e)*-1) #fff,var(--e) calc(var(--e)*-1) #fff,calc(var(--e)*-1) var(--e) #fff,var(--e) var(--e) #fff}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-1.4cqmin) rotate(3deg)}}
.titlelogo{position:absolute;left:0;right:0;top:9cqmin;display:flex;justify-content:center}

/* ---------- Boot / Quit ---------- */
.touchme{position:relative;font-size:7.4cqmin;color:#12327a;background:rgba(255,255,255,.9);padding:2cqmin 7cqmin;border-radius:9cqmin;border:.7cqmin solid #fff;box-shadow:0 1cqmin 0 rgba(20,40,100,.25);animation:blink 1.4s ease-in-out infinite}
.touchme .ring{position:absolute;right:-5cqmin;bottom:-6cqmin;width:11cqmin;height:11cqmin;border-radius:50%;background:rgba(255,93,143,.85);border:.8cqmin solid #fff;animation:pulse 1.4s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.bye{font-size:12cqmin;font-weight:900;color:#1f5fd9;background:rgba(255,255,255,.92);padding:2cqmin 8cqmin;border-radius:10cqmin;border:.8cqmin solid #fff;box-shadow:0 1.2cqmin 0 rgba(20,40,100,.25)}
body[data-state=quit] #quit .center{padding-bottom:14cqmin}

/* ---------- 進行ボタン #nav（全画面で同じ大きさ・同じホップ） ---------- */
#nav{position:absolute;left:0;right:0;bottom:4cqmin;display:flex;justify-content:center;align-items:flex-end;gap:5cqmin;z-index:50;pointer-events:none}
.nbtn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:2cqmin;width:64cqmin;height:16cqmin;border-radius:8cqmin;
  font-size:6.4cqmin;line-height:1;white-space:nowrap;border:.8cqmin solid #fff;box-shadow:0 1.3cqmin 0 rgba(20,40,100,.3);animation:hop 1.15s ease-in-out infinite}
.nbtn i{display:block;width:8cqmin;height:8cqmin;flex:none}
.nbtn i svg{width:100%;height:100%;fill:currentColor}
.nbtn.primary{background:linear-gradient(#ffe86b,#ffb703);color:#3d2800}
.nbtn.secondary{background:linear-gradient(#8fd0ff,#3b8df0);color:#fff;text-shadow:0 .3cqmin 0 rgba(0,40,120,.5);animation-delay:.25s}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2cqmin)}60%{transform:translateY(0)}}
.nbtn.down,.ctl.down,.card.down,.bigcard.down,.key.down,.backbtn.down,#home.down,#cam.down{animation:none;transform:translateY(.7cqmin) scale(.95);filter:brightness(.92)}

/* ---------- ホーム（最前面） ---------- */
#home{position:absolute;z-index:100;top:max(2cqmin,env(safe-area-inset-top));right:max(2.4cqmin,env(safe-area-inset-right));
  width:12cqmin;height:12cqmin;border-radius:50%;background:#fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.3);border:.5cqmin solid #d7e3f7;display:none;align-items:center;justify-content:center}
#home svg{width:7.4cqmin;height:7.4cqmin;fill:#1f5fd9}
body:not([data-state=boot]) #home{display:flex}

/* ---------- モーダル ---------- */
#modal{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,30,70,.6)}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:5cqmin;padding:6cqmin 6cqmin 7cqmin;display:flex;flex-direction:column;align-items:center;gap:6cqmin;border:.9cqmin solid #ffd23f;box-shadow:0 2cqmin 0 rgba(0,0,0,.25)}
.mtitle{font-size:9cqmin;color:#12327a;font-weight:900}
.mbtns{display:flex;gap:5cqmin}
.mbtns .nbtn{width:44cqmin}
#m-no{background:linear-gradient(#9af0a8,#2fbf5a);color:#07431c}
#m-yes{animation:none;background:linear-gradient(#c9d6ea,#8fa4c8);color:#fff}

/* ---------- 縦持ち警告 ---------- */
#portrait{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8vmin;background:#12327a;color:#fff}
.phone{width:18vmin;height:30vmin;border:1.6vmin solid #fff;border-radius:3vmin;background:#ffd23f;animation:rot 2.4s ease-in-out infinite}
.ptext{font-size:7.6vmin;font-weight:900;text-align:center;line-height:1.4;padding:0 6vmin}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media screen and (orientation: portrait){#portrait{display:flex}}

/* ---------- Setting ---------- */
.head{position:absolute;top:3cqmin;left:50%;transform:translateX(-50%);font-size:6.4cqmin;white-space:nowrap;background:rgba(255,255,255,.92);color:#12327a;
  padding:1.4cqmin 6cqmin;border-radius:8cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.2)}
.backbtn{position:absolute;left:3cqmin;top:3cqmin;height:12cqmin;min-width:25cqmin;padding:0 3cqmin;display:flex;align-items:center;justify-content:center;gap:1.4cqmin;
  background:#fff;border-radius:6cqmin;font-size:4.8cqmin;color:#1f5fd9;border:.5cqmin solid #d7e3f7;box-shadow:0 .8cqmin 0 rgba(20,40,100,.25)}
.backbtn i{width:0;height:0;border-top:2.4cqmin solid transparent;border-bottom:2.4cqmin solid transparent;border-right:3.6cqmin solid #1f5fd9}
.pane{position:absolute;left:6cqmin;right:6cqmin;top:19cqmin;bottom:23cqmin;display:none}
#setting[data-sub=choice] .sub-choice,#setting[data-sub=code] .sub-code,#setting[data-sub=pick] .sub-pick,
#setting[data-sub=keypad] .sub-keypad,#setting[data-sub=msg] .sub-msg,#setting[data-sub=error] .sub-msg{display:flex}
.sub-choice{align-items:center;justify-content:center;gap:9cqmin}
.bigcard{width:62cqmin;height:50cqmin;border-radius:5cqmin;background:#fff;border:.9cqmin solid #fff;box-shadow:0 1.4cqmin 0 rgba(20,40,100,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqmin;font-size:7.4cqmin;color:#1f5fd9}
.bigcard svg{width:24cqmin;height:24cqmin}
#c-host{background:linear-gradient(#fff,#fff3b8)}#c-join{background:linear-gradient(#fff,#d6ecff)}

.sub-code{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.digits{display:flex;gap:3cqmin;justify-content:center}
.digits b{width:23cqmin;height:30cqmin;border-radius:3cqmin;background:#fff;border:.8cqmin solid #ffb703;box-shadow:0 1cqmin 0 rgba(20,40,100,.25);display:flex;align-items:center;justify-content:center;font-size:21cqmin;line-height:1;color:#1f5fd9}
.digits.grid2{display:grid;grid-template-columns:repeat(2,23cqmin);gap:3cqmin;align-content:center}
.digits.grid2 b{height:23cqmin;font-size:17cqmin}
.waiting{font-size:6.4cqmin;background:rgba(255,255,255,.92);padding:1.4cqmin 6cqmin;border-radius:8cqmin}
.dots i{font-style:normal;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}

.sub-pick{gap:4cqmin;align-items:stretch}
.pickgrid{flex:1.25;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);grid-auto-rows:1fr;gap:3cqmin;min-width:0}
.card{position:relative;border-radius:4cqmin;background:#fff;border:.8cqmin solid #fff;box-shadow:0 1.1cqmin 0 rgba(20,40,100,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqmin;overflow:hidden;color:#1f5fd9}
.card .kan{font-size:8.4cqmin;line-height:1.1;font-weight:900;letter-spacing:.04em;color:#12327a}
.card .yomi{font-size:3.5cqmin;color:#4a6aa8}
.pickgrid.c3 .kan{font-size:6cqmin}.pickgrid.c3 .yomi{font-size:2.8cqmin}
.card.on{background:linear-gradient(#fff9c4,#ffe45e);border-color:#ff9f1c;box-shadow:0 1.1cqmin 0 rgba(255,140,0,.5)}
.card.file{background:linear-gradient(#fff,#e3f3ff)}
.card.file svg{width:11cqmin;height:11cqmin}
.card.file .kan{font-size:5.4cqmin}
.card input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.preview{flex:1;border-radius:4cqmin;background:rgba(255,255,255,.88);border:.8cqmin dashed #8fb4e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqmin;padding:2cqmin;min-width:0;overflow:hidden}
.preview img{max-width:100%;max-height:38cqmin;object-fit:contain;border-radius:1.6cqmin;border:.6cqmin solid #fff;box-shadow:0 .8cqmin 0 rgba(20,40,100,.25);background:#fff}
.preview .pt{font-size:7cqmin;line-height:1.1;color:#12327a;font-weight:900}
.preview .py{font-size:3.6cqmin;color:#4a6aa8}
.preview .hint{font-size:6cqmin;color:#4a6aa8;text-align:center;line-height:1.4}
.spin{width:10cqmin;height:10cqmin;border-radius:50%;border:1.4cqmin solid #cfe0f7;border-top-color:#ff9f1c;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sub-keypad{gap:8cqmin;align-items:center;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(3,18cqmin);grid-auto-rows:13.4cqmin;gap:1.4cqmin}
.key{border-radius:3cqmin;background:#fff;border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.28);font-size:8cqmin;color:#1f5fd9;font-weight:900;display:flex;align-items:center;justify-content:center}
.key.del{background:linear-gradient(#ffd0d8,#ff8fa6);color:#7a1230;font-size:4.8cqmin}
.key.nul{visibility:hidden}

.sub-msg{flex-direction:column;align-items:center;justify-content:center;gap:5cqmin}
.msgtext{font-size:6.6cqmin;line-height:1.5;text-align:center;background:rgba(255,255,255,.92);padding:2.4cqmin 7cqmin;border-radius:6cqmin;max-width:150cqmin}
.msgface svg{width:20cqmin;height:20cqmin}

/* ---------- Play ---------- */
#play{pointer-events:none}
#play>*{pointer-events:auto}
#maptag{position:absolute;top:2cqmin;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:2cqmin;background:rgba(255,255,255,.88);border-radius:6cqmin;padding:.8cqmin 5cqmin;border:.5cqmin solid #fff;box-shadow:0 .6cqmin 0 rgba(20,40,100,.25);white-space:nowrap;pointer-events:none}
#maptag b{font-size:6.4cqmin;color:#12327a;font-weight:900}#maptag small{font-size:3cqmin;color:#4a6aa8}
#notice{position:absolute;top:15cqmin;left:50%;transform:translateX(-50%);display:none;font-size:5.4cqmin;background:#fff5d6;color:#7a3b00;border:.7cqmin solid #ffb703;border-radius:6cqmin;padding:1.4cqmin 6cqmin;white-space:nowrap;pointer-events:none}
#notice.on{display:block;animation:pop .35s ease-out}
.ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqmin;color:#12327a}
#dpad{position:absolute;left:max(3cqmin,env(safe-area-inset-left));bottom:3cqmin;display:grid;grid-template-columns:repeat(3,15cqmin);grid-template-rows:repeat(3,15cqmin);gap:1cqmin;pointer-events:none}
#dpad .ctl{pointer-events:auto;border-radius:3.4cqmin;background:rgba(255,255,255,.86);border:.6cqmin solid #fff;box-shadow:0 .9cqmin 0 rgba(20,40,100,.35)}
#dpad .ctl svg{width:6.6cqmin;height:6.6cqmin;fill:#1f5fd9}
#dpad .ctl span{font-size:3.2cqmin;line-height:1}
#dpad [data-act=fwd]{grid-column:2;grid-row:1}#dpad [data-act=left]{grid-column:1;grid-row:2}
#dpad [data-act=right]{grid-column:3;grid-row:2}#dpad [data-act=back]{grid-column:2;grid-row:3}
#dpad .ctl.down{background:#ffe45e}
#fire{position:absolute;right:max(3cqmin,env(safe-area-inset-right));bottom:3cqmin;width:31cqmin;height:31cqmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a6b,#f0451c 70%);border:.9cqmin solid #fff;box-shadow:0 1.4cqmin 0 rgba(120,20,0,.45);color:#fff}
#fire svg{width:16cqmin;height:16cqmin}
#fire span{font-size:5.6cqmin;line-height:1;text-shadow:0 .3cqmin 0 rgba(100,20,0,.6)}
#fire.down{background:radial-gradient(circle at 35% 30%,#ffc09a,#ff6b3d 70%)}

<script>

  function pic(t){var c=document.createElement('canvas');c.width=512;c.height=320;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,512,320);
    g.fillStyle='#ffe9a8';g.fillRect(20,230,200,70);g.fillStyle='#bfe3ff';g.fillRect(300,20,180,60);

// 仮のNet: 同じブラウザの別タブ同士を BroadcastChannel でつなぐ
(function(){
  var bc=new BroadcastChannel('seecar-stub'),id=Math.random().toString(36).slice(2),H={open:[],data:[],close:[],error:[]},role=null,code=null,peer=null;
  function emit(n,a){H[n].forEach(function(f){f(a)});}
  var N={isHost:false,connected:false,makeCode:function(){return '4821'},
    host:function(c){role='host';code=c;N.isHost=true;return Promise.resolve();},
    join:function(c){role='join';code=c;return new Promise(function(res,rej){
      var t=setTimeout(function(){var e=new Error('その ばんごうの へやが みつからないよ。ばんごうを たしかめてね');e.code='peer-unavailable';rej(e);},1500);
      bc.postMessage({k:'join',code:c,from:id});
      N._ok=function(){clearTimeout(t);N.connected=true;res();emit('open');};});},
    send:function(o){if(!N.connected)return false;bc.postMessage({k:'d',to:peer,from:id,o:JSON.parse(JSON.stringify(o))});return true;},
    on:function(n,f){H[n].push(f)},close:function(){if(N.connected)bc.postMessage({k:'bye',to:peer,from:id});N.connected=false;role=null;}};
  bc.onmessage=function(ev){var m=ev.data;if(m.from===id)return;
    if(m.k==='join'&&role==='host'&&m.code===code&&!N.connected){peer=m.from;N.connected=true;bc.postMessage({k:'ok',to:m.from,from:id});emit('open');}
    else if(m.k==='ok'&&m.to===id){peer=m.from;N._ok&&N._ok();}
    else if(m.k==='d'&&m.to===id)emit('data',m.o);
    else if(m.k==='bye'&&m.to===id){N.connected=false;emit('close');}};
  window.Net=N;
})();

    if (state === 'setting') {
      if (sub === 'pick' && sel && !loading) return [{ label: 'しゅっぱつ！', icon: 'go', kind: 'primary', fn: depart }];
      if (sub === 'keypad' && code.length === 4) return [{ label: 'つなぐ！', icon: 'link', kind: 'primary', fn: doJoin }];
      if (sub === 'error') return [{ label: 'もういちど', icon: 'again', kind: 'primary', fn: retry }];
      return [];
    }
    if (state === 'ending') return [
      { label: 'もういちど', icon: 'again', kind: 'primary', fn: function () { go('title'); } },
      { label: 'おわる', icon: 'stop', kind: 'secondary', fn: function () { go('quit'); } }];
    if (state === 'quit') return [{ label: 'はじめから', icon: 'home', kind: 'primary', fn: function () { go('title'); } }];
    return [];
  }
  function renderNav() {
    var items = navItems();
    var key = state + '|' + sub + '|' + items.map(function (i) { return i.label; }).join('/');
    if (key === navKey) return;
    navKey = key;
    els.nav.innerHTML = '';
    items.forEach(function (it) {
      var b = doc.createElement('button');
      b.type = 'button'; b.tabIndex = -1; b.className = 'nbtn ' + it.kind;
      b.innerHTML = '<i>' + ICON[it.icon] + '</i><span>' + it.label + '</span>';
      b.setAttribute('data-nav', it.label);
      tap(b, it.fn);
      els.nav.appendChild(b);
    });
  }

  // ---------------- 画面遷移 ----------------
  function go(name) {
    var from = state;
    if (from === 'play' && name !== 'play') releaseAll();
    if (name === 'title' || name === 'quit') { stopGame(); closeNet(); mode = 'solo'; sel = null; loading = false; hideNotice(); }
    if (name === 'ending') stopGame();
    state = name;
    doc.body.setAttribute('data-state', name);
    if (name !== 'setting') sub = 'pick';
    if (name === 'ending') fillEnding.apply(null, [].slice.call(arguments, 1));
    renderNav();
  }

  function setSub(s, headText) {
    sub = s;
    els.setting.setAttribute('data-sub', s);
    var heads = { choice: 'どちらに する？', code: 'この ばんごうを ともだちに おしえてね', keypad: 'ばんごうを いれてね', msg: 'ちょっと まってね', error: 'あれれ？', pick: 'ちずを えらんでね' };
    els.sethead.textContent = headText || heads[s] || '';
    renderNav();
  }
  function enterSetting(s, head) { go('setting'); setSub(s, head); }

  function startSolo() { mode = 'solo'; sel = null; loading = false; renderCards(); renderPreview(); enterSetting('pick'); }
  function startOnline() { mode = 'net'; sel = null; netRole = ''; enterSetting('choice'); }
  function backFromSetting() {
    if (mode === 'net' && sub !== 'choice') { closeNet(); sel = null; loading = false; setSub('choice'); return; }
    go('title');
  }

  // ---------------- 地図えらび ----------------
  function renderCards() {
    var presets = prop('MapGen', 'presets') || [];
    var grid = els.cards;
    grid.innerHTML = '';
    var total = presets.length + 1;
    grid.style.setProperty('--cols', total > 4 ? 3 : 2);
    grid.className = 'pickgrid' + (total > 4 ? ' c3' : '');
    presets.forEach(function (p) {
      var c = doc.createElement('button');
      c.type = 'button'; c.tabIndex = -1; c.className = 'card'; c.setAttribute('data-id', p.id);
      c.innerHTML = '<span class="kan"></span><span class="yomi"></span>';
      c.firstChild.textContent = p.title; c.lastChild.textContent = p.reading || '';
      tap(c, function () { choosePreset(p); });
      grid.appendChild(c);
    });
    var f = doc.createElement('div');
    f.className = 'card file'; f.setAttribute('data-id', 'file');
    f.innerHTML = ICON.pic + '<span class="kan">えを よみこむ</span><input type="file" accept="image/*" aria-label="えを よみこむ">';
    var inp = f.querySelector('input');
    // ファイル選択欄だけは既定動作を止めない（止めると選択画面が開かない）。ただし他へ伝わらないよう止める。
    ['pointerdown', 'pointerup'].forEach(function (n) { inp.addEventListener(n, function (e) { e.stopPropagation(); unlock(); }); });
    inp.addEventListener('change', function () {
      var file = inp.files && inp.files[0];
      inp.value = '';
      if (file) chooseFile(file);
    });
    grid.appendChild(f);
    markCards();
  }
  function markCards() {
    var list = els.cards.children;
    for (var i = 0; i < list.length; i++) {
      list[i].classList.toggle('on', !!(sel && sel.id === list[i].getAttribute('data-id')));
    }
  }
  function renderPreview(msg) {
    var p = els.preview, h = '';
    if (loading) h = '<div class="spin"></div><div class="hint">つくっているよ…</div>';
    else if (msg) h = '<div class="hint">' + msg + '</div>';
    else if (sel && sel.map) {
      h = (sel.map.picture ? '<img alt="">' : '') + '<div class="pt"></div><div class="py"></div>';
    } else h = '<div class="hint">すきな ちずを<br>えらんでね</div>';
    p.innerHTML = h;
    if (!loading && sel && sel.map && !msg) {
      var img = p.querySelector('img'); if (img) img.src = sel.map.picture;
      p.querySelector('.pt').textContent = sel.map.title || '';
      p.querySelector('.py').textContent = sel.map.reading || '';
    }
  }
  function choosePreset(p) {
    if (loading) return;
    loading = true; sel = null; markCards(); renderPreview(); renderNav();
    setTimeout(function () {
      var m = null;
      try { m = call('MapGen', 'fromPreset', p.id); } catch (e) {}
      loading = false;
      if (m) sel = { id: p.id, map: m };
      markCards(); renderPreview(m ? '' : 'うまく つくれなかったよ'); renderNav();
    }, 40);
  }
  function chooseFile(file) {
    if (loading) return;
    loading = true; sel = null; markCards(); renderPreview(); renderNav();
    var pr = call('MapGen', 'fromFile', file);
    function done(m) {
      loading = false;
      if (m) sel = { id: 'file', map: m };
      markCards(); renderPreview(m ? '' : 'えを よみこめなかったよ<br>ほかの えを ためしてね'); renderNav();
    }
    if (pr && pr.then) pr.then(done, function () { done(null); }); else done(null);
  }

  // ---------------- 出発 ----------------
  function depart() {
    if (!sel || !sel.map) return;
    if (mode === 'net') {
      if (!netConnected) return;
      var enc = call('MapGen', 'encode', sel.map);
      call('Net', 'send', { t: 'map', map: enc });
      startGame(sel.map, 0, true);
    } else startGame(sel.map, 0, false);
  }

  // ---------------- 通信：へや ----------------
  function rand4() { return ('0000' + Math.floor(Math.random() * 10000)).slice(-4); }
  function errText(e) {
    var m = typeof e === 'string' ? e : (e && e.message);
    return (m && /[ぁ-ん]/.test(m)) ? m : DEFAULT_ERR;
  }
  function showDigits(el, str, n) {
    var h = '';
    for (var i = 0; i < n; i++) h += '<b>' + (str.charAt(i) || '') + '</b>';
    el.innerHTML = h;
  }
  function failNet(msg) {
    netTok++; closeNet();
    els.msgface.innerHTML = SAD;
    els.msgtext.textContent = msg || DEFAULT_ERR;
    setSub('error');
  }
  function infoNet(text, face) {
    els.msgface.innerHTML = face || '<div class="spin"></div>';
    els.msgtext.textContent = text;
    setSub('msg');
  }
  function closeNet() {
    netTok++;
    var was = netConnected || netOn || netRole;
    netOn = false; netConnected = false; joined = false;
    if (was) call('Net', 'close');
  }

  function startHost() {
    closeNet();
    netRole = 'host';
    var tok = ++netTok;
    code = call('Net', 'makeCode') || rand4();
    showDigits(els.codeshow, code, 4);
    setSub('code');
    var p = call('Net', 'host', code);
    if (!p || !p.then) { failNet('つうしんが つかえないよ'); return; }
    p.then(function () {
      if (tok !== netTok) return;
      if (prop('Net', 'connected')) hostConnected();
    }, function (e) {
      if (tok !== netTok) return;
      if (e && e.code === 'unavailable-id' && hostRetry < 4) { hostRetry++; startHost(); return; }
      failNet(errText(e));
    });
  }
  function hostConnected() {
    if (netConnected) return;
    netConnected = true; hostRetry = 0; sel = null; loading = false;
    call('Net', 'send', { t: 'hello', color: PLAYERS[0].color });
    renderCards(); renderPreview();
    setSub('pick', 'つながったよ！ ちずを えらんでね');
  }

  function startJoin() {
    closeNet();
    netRole = 'join'; code = '';
    updateKeypad(); setSub('keypad');
  }
  function updateKeypad() { showDigits(els.codein, code, 4); renderNav(); }
  function doJoin() {
    if (code.length !== 4) return;
    var tok = ++netTok; joined = false;
    infoNet('さがしているよ…');
    var p = call('Net', 'join', code);
    if (!p || !p.then) { failNet('つうしんが つかえないよ'); return; }
    p.then(function () {
      if (tok !== netTok) return;
      joined = true; netConnected = true;
      call('Net', 'send', { t: 'hello', color: PLAYERS[1].color });
      if (state === 'setting') infoNet('つながったよ！ ちずが くるのを まっているよ…', HAPPY);
    }, function (e) {
      if (tok !== netTok) return;
      failNet(errText(e));
    });
  }
  function retry() { if (netRole === 'host') startHost(); else startJoin(); }

  function buildKeypad() {
    var kp = els.keypad;
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'nul'].forEach(function (k) {
      var b = doc.createElement('button');
      b.type = 'button'; b.tabIndex = -1;
      if (k === 'nul') { b.className = 'key nul'; kp.appendChild(b); return; }
      b.className = 'key' + (k === 'del' ? ' del' : '');
      b.textContent = k === 'del' ? 'けす' : k;
      tap(b, function () { keyIn(k); });
      kp.appendChild(b);
    });
  }
  function keyIn(k) {
    if (sub !== 'keypad') return;
    if (k === 'del') code = code.slice(0, -1);
    else if (code.length < 4) code += k;
    updateKeypad();
  }

  // ---------------- Net の受け口（1回だけ登録） ----------------
  function onNetOpen() {
    if (state === 'setting' && netRole === 'host' && sub === 'code') hostConnected();
  }
  function onNetData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'map') {
      if (state === 'setting' && netRole === 'join') {
        var m = call('MapGen', 'decode', d.map);
        if (m) { netTok++; netOn = true; startGame(m, 1, true); }
        else failNet('ちずが うけとれなかったよ');
      }
      return;
    }
    if (state !== 'play') return;
    var other = 1 - myIndex;
    if (d.t === 'st') call('World', 'applyRemoteState', other, d.s);
    else if (d.t === 'boom') {
      guard = true; try { call('World', 'applyRemoteBoom', d.cells); } finally { guard = false; }
      showBoom();
    } else if (d.t === 'found') {
      guard = true; try { call('World', 'remoteFound', d.idx); } finally { guard = false; }
      go('ending', d.idx);
    }
  }
  function onNetClose() {
    netConnected = false;
    if (state === 'play' && netOn) {
      netOn = false;
      showNotice('あいてが いなくなったよ');
    } else if (state === 'setting' && mode === 'net') {
      failNet('あいてと つながらなくなったよ');
    }
    netOn = false;
  }
  // 'error' は Promise の reject と二重になるので、ここでは何も表示しない

  // ---------------- Play ----------------
  function startGame(m, idx, net) {
    map = m; myIndex = idx; netOn = !!net;
    hideNotice();
    call('World', 'load', m, { myIndex: idx, players: PLAYERS, net: netOn });
    els.ptTitle.textContent = m.title || '';
    els.ptYomi.textContent = m.reading || '';
    camMode = 1; updateCam();
    go('play');
    call('World', 'setCamera', camMode);
    call('World', 'start');
    running = true;
    applyPortraitPause();
  }
  function stopGame() {
    if (running) { running = false; call('World', 'stop'); }
  }
  function updateCam() {
    els.camIco.innerHTML = CAM_ICON[camMode];
    els.camLabel.textContent = CAM_LABEL[camMode];
  }
  function cycleCam() {
    var m = call('World', 'cycleCamera');
    camMode = (typeof m === 'number') ? m : (camMode + 1) % 3;
    updateCam();
  }
  function showBoom() {
    var b = els.boom;
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(boomTimer);
    boomTimer = setTimeout(function () { b.classList.remove('on'); }, 800);
  }
  function showNotice(t) {
    els.notice.textContent = t; els.notice.classList.add('on');
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(hideNotice, 7000);
  }
  function hideNotice() { clearTimeout(noticeTimer); els.notice.classList.remove('on'); }

  function onFound(idx) {
    if (state !== 'play' || guard) return;
    if (netOn) call('Net', 'send', { t: 'found', idx: idx });
    go('ending', idx);
  }
  function onBoom(cells) {
    showBoom();
    if (guard || !netOn || state !== 'play') return;
    call('Net', 'send', { t: 'boom', cells: cells });
  }
  function onState(s) {
    if (guard || !netOn || state !== 'play') return;
    call('Net', 'send', { t: 'st', s: s });
  }

  // ---------------- Ending ----------------
  function fillEnding(idx) {
    idx = (idx === 1) ? 1 : 0;
    var m = map || {};
    els.endDisc.style.background = PLAYERS[idx].color;
    els.endWho.textContent = (mode === 'net' && idx !== myIndex) ? 'あいてが みつけたよ！' : 'きみが みつけたよ！';
    els.endTitle.textContent = m.title || '';
    els.endTitle.style.display = m.title ? '' : 'none';
    els.endYomi.textContent = m.reading || '';
    if (m.picture) { els.endPic.src = m.picture; els.endPic.style.display = ''; } else els.endPic.style.display = 'none';
    var c = els.confetti; c.innerHTML = '';
    var cols = ['#ff5d8f', '#ffd23f', '#4d9bff', '#59d27c', '#b388ff', '#ff9f1c'];
    for (var i = 0; i < 26; i++) {
      var s = doc.createElement('i');
      s.style.left = (i * 3.9 + Math.random() * 3) + '%';
      s.style.background = cols[i % cols.length];
      s.style.animationDuration = (3 + Math.random() * 3) + 's';
      s.style.animationDelay = (-Math.random() * 5) + 's';
      c.appendChild(s);
    }
  }

  // ---------------- ホームとモーダル ----------------
  function openModal() {
    if (modalOpen || state === 'boot') return;
    modalOpen = true; els.modal.classList.add('on');
    releaseAll();
    if (state === 'play') call('World', 'setPaused', true);
  }
  function closeModal() {
    if (!modalOpen) return;
    modalOpen = false; els.modal.classList.remove('on');
    if (state === 'play') applyPortraitPause();
  }
  function quitYes() {
    modalOpen = false; els.modal.classList.remove('on');
    stopGame(); closeNet();
    go('quit');
  }
  function applyPortraitPause() {
    if (state !== 'play') return;
    var portrait = !!(window.matchMedia && window.matchMedia('(orientation: portrait)').matches);
    call('World', 'setPaused', modalOpen || portrait);
  }

  // ---------------- キーボード（確認用） ----------------
  var KEYS = { ArrowUp: 'fwd', w: 'fwd', W: 'fwd', ArrowDown: 'back', s: 'back', S: 'back',
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'fire' };
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (state === 'boot') { e.preventDefault(); if (!e.repeat) leaveBoot(); return; }
    if (modalOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
      return;
    }
    if (state === 'play') {
      var act = KEYS[e.key];
      if (act) { e.preventDefault(); if (!e.repeat) press(act, true); return; }
      if (e.key === 'c' || e.key === 'C') { e.preventDefault(); if (!e.repeat) cycleCam(); return; }
      if (e.key === 'Escape') { e.preventDefault(); openModal(); }
      return;
    }
    if (state === 'setting' && sub === 'keypad') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keyIn(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); keyIn('del'); return; }
    }
    if (e.key === 'Enter') {
      var b = els.nav.querySelector('.nbtn');
      if (b) { e.preventDefault(); sfx('tap'); var it = navItems()[0]; if (it) it.fn(); }
    }
  }
  function onKeyUp(e) {
    var act = KEYS[e.key];
    if (act && state === 'play') { e.preventDefault(); press(act, false); }
  }

  function leaveBoot() {
    if (state !== 'boot') return;
    unlock(); sfx('tap');
    go('title');
  }

  // ---------------- 初期化 ----------------
  function init() {
    ['stage', 'nav', 'home', 'modal', 'setting', 'sethead', 'cards', 'preview', 'keypad', 'codein', 'codeshow', 'msgface', 'msgtext',
      'cam', 'notice', 'boom', 'confetti'].forEach(function (id) { els[id] = $(id); });
    els.ptTitle = $('pt-title'); els.ptYomi = $('pt-yomi');
    els.camIco = $('cam-ico'); els.camLabel = $('cam-label');
    els.endDisc = $('end-disc'); els.endWho = $('end-who'); els.endTitle = $('end-title'); els.endYomi = $('end-yomi'); els.endPic = $('end-pic');

    doc.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(function (n) { doc.addEventListener(n, function (e) { e.preventDefault(); }); });
    doc.addEventListener('keydown', onKeyDown);
    doc.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', releaseAll);
    if (window.matchMedia) {
      var mq = window.matchMedia('(orientation: portrait)');
      var h = function () { applyPortraitPause(); };
      if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
    }

    buildLogos();
    buildKeypad();
    renderCards(); renderPreview();
    updateCam();

    // Boot：画面のどこでも
    tap($('boot'), leaveBoot);
    tap(els.home, openModal);
    tap($('m-no'), closeModal);
    tap($('m-yes'), quitYes);
    els.modal.addEventListener('pointerdown', stopEv);
    els.modal.addEventListener('pointerup', stopEv);
    els.modal.addEventListener('click', stopEv);
    tap($('back'), backFromSetting);
    tap($('c-host'), startHost);
    tap($('c-join'), startJoin);
    tap(els.cam, cycleCam);
    var ctls = doc.querySelectorAll('.ctl[data-act]');
    for (var i = 0; i < ctls.length; i++) hold(ctls[i], ctls[i].getAttribute('data-act'));

    call('World', 'init', $('worldbox'));
    call('World', 'on', 'found', onFound);
    call('World', 'on', 'boom', onBoom);
    call('World', 'on', 'state', onState);
    call('Net', 'on', 'open', onNetOpen);
    call('Net', 'on', 'data', onNetData);
    call('Net', 'on', 'close', onNetClose);

    state = 'boot'; doc.body.setAttribute('data-state', 'boot');
    renderNav();
  }

  window.App = {
    go: function (name) { if (['boot', 'title', 'setting', 'play', 'ending', 'quit'].indexOf(name) >= 0) go(name); },
    get state() { return state; }
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
