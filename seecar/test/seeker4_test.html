<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>seeker4 test</title>
<style>html,body{margin:0;background:#fffaf0;font-family:sans-serif}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../src/seeker.js"></script>
</head><body>
<script>
// 2D の色えらびプレビューを 5x2 のコンタクトシートにする（背景は明るい色と暗い色の半々）
window.sheet = function (size) {
  var P = SeekerModel.PALETTES, c = document.createElement('canvas'), pad = 12, lab = 22;
  c.width = 5 * (size + pad) + pad; c.height = 2 * (size + lab + pad) + pad;
  var g = c.getContext('2d'); g.fillStyle = '#fffaf0'; g.fillRect(0, 0, c.width, c.height);
  var jobs = P.map(function (p, i) {
    return new Promise(function (res) {
      var im = new Image(); im.onload = function () {
        var x = pad + (i % 5) * (size + pad), y = pad + Math.floor(i / 5) * (size + lab + pad);
        g.fillStyle = '#d9f0ff'; g.fillRect(x, y, size, size); g.drawImage(im, x, y);
        g.fillStyle = '#2b2f3a'; g.font = 'bold 15px sans-serif'; g.fillText(i + ' ' + p.name, x + 4, y + size + 16); res();
      }; im.src = SeekerModel.preview(i, size);
    });
  });
  return Promise.all(jobs).then(function () { return c.toDataURL('image/png'); });
};
// 3D：10色を2列で並べて1枚に
window.sheet3d = function () {
  var W = 1500, H = 640;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9f0ff);
  var camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(3, 6, 4); scene.add(sun);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 10).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xcfe9a8 }));
  ground.position.y = -0.002; scene.add(ground);
  var ms = [];
  for (var i = 0; i < 10; i++) {
    var m = SeekerModel.create({ palette: i });
    m.root.position.set((i % 5 - 2) * 1.7, 0, i < 5 ? -1.3 : 1.3); m.root.rotation.y = 0.35;
    for (var k = 0; k < 60; k++) m.update(0.016, { blink: false });
    scene.add(m.root); ms.push(m);
  }
  camera.position.set(0, 4.2, 6.3); camera.lookAt(0, 0.4, 0);
  renderer.render(scene, camera);
  window.ms = ms;
  return renderer.domElement.toDataURL('image/png');
};
// API の確認
window.apiCheck = function () {
  var out = {};
  var a = SeekerModel.create({ palette: 3 });
  var mats = []; a.root.traverse(function (o) { if (o.isMesh && !o.userData.ink && o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (mm) { if (mm.color) mats.push(mm.color.getHexString()); }); });
  out.p3 = mats.slice(0, 12);
  a.setPalette(1);
  var m2 = []; a.root.traverse(function (o) { if (o.isMesh && !o.userData.ink && o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (mm) { if (mm.color) m2.push(mm.color.getHexString()); }); });
  out.p1 = m2.slice(0, 12);
  var b = SeekerModel.create({ color: 0x2f8be0 }); out.colorOnly = b.root.children.length;
  var d = SeekerModel.create({ palette: 0 }); d.update(0.016, { drillHold: 1, spin: 3 });
  out.hatFwd = d.hatPivot.rotation.x.toFixed(2);
  out.pal = SeekerModel.PALETTES.length;
  out.previewType = SeekerModel.preview(2, 120).slice(0, 22);
  out.sizes = [64, 120, 200].map(function (s) { var im = new Image(); return s; });
  return out;
};
</script></body></html>
