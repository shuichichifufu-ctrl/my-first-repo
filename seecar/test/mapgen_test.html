<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>mapgen test</title></head>
<body style="margin:0;background:#888">
<script src="../src/mapgen.js"></script>
<script>
// 確認用の道具（mapgen_test.js から page.evaluate で呼ぶ）
window.T = {
  // 高さを白黒、宝を赤、スタートを青で描く
  render: function (m, scale) {
    var c = document.createElement('canvas'); c.width = m.w * scale; c.height = m.h * scale;
    var g = c.getContext('2d');
    for (var z = 0; z < m.h; z++) for (var x = 0; x < m.w; x++) {
      var v = Math.round(255 * (1 - m.heights[z * m.w + x] / 10));
      g.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; g.fillRect(x * scale, z * scale, scale, scale);
    }
    function dot(p, col) { g.fillStyle = col; g.beginPath(); g.arc((p.x + 0.5) * scale, (p.z + 0.5) * scale, scale * 1.6, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1; g.stroke(); }
    dot(m.treasure, '#e00');
    m.starts.forEach(function (s) { dot(s, '#05f'); });
    return c.toDataURL('image/png');
  },
  // 宝の領域：宝のマスから壁以外を4近傍でたどり、端に触れるか・広さを返す
  region: function (m) {
    var w = m.w, h = m.h, seen = new Uint8Array(w * h), q = [m.treasure.z * w + m.treasure.x], edge = false, n = 0;
    seen[q[0]] = 1;
    while (q.length) {
      var i = q.pop(), x = i % w, z = (i - x) / w; n++;
      if (x === 0 || z === 0 || x === w - 1 || z === h - 1) edge = true;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
        var nx = x + d[0], nz = z + d[1]; if (nx < 0 || nz < 0 || nx >= w || nz >= h) return;
        var j = nz * w + nx; if (!seen[j] && m.heights[j] < 9) { seen[j] = 1; q.push(j); }
      });
    }
    return { cells: n, touchesEdge: edge, treasureHeight: m.heights[m.treasure.z * w + m.treasure.x], seen: seen };
  },
  startsInfo: function (m) {
    var r = T.region(m);
    return m.starts.map(function (s) { var i = s.z * m.w + s.x; return { x: s.x, z: s.z, dir: s.dir, h: m.heights[i], inTreasureRegion: !!r.seen[i] }; });
  },
  // 太い線の四角を並べた塗り絵（単位 u=10px、64x48 単位）
  rects: function (specs, bg) {
    var c = document.createElement('canvas'); c.width = 640; c.height = 480;
    var g = c.getContext('2d'); g.fillStyle = bg || '#fff'; g.fillRect(0, 0, 640, 480); g.fillStyle = '#000';
    specs.forEach(function (r) { // [x0,y0,x1,y1,line] 単位：外枠
      var u = 10, l = r[4];
      g.fillRect(r[0] * u, r[1] * u, (r[2] - r[0]) * u, l * u);
      g.fillRect(r[0] * u, (r[3] - l) * u, (r[2] - r[0]) * u, l * u);
      g.fillRect(r[0] * u, r[1] * u, l * u, (r[3] - r[1]) * u);
      g.fillRect((r[2] - l) * u, r[1] * u, l * u, (r[3] - r[1]) * u);
    });
    return c;
  },
  bigFile: function (W, H) {
    return new Promise(function (res) {
      var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
      var gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#5a8'); gr.addColorStop(1, '#fd9'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
      for (var i = 0; i < 400; i++) { g.fillStyle = 'hsl(' + (i * 47 % 360) + ',60%,' + (20 + i % 60) + '%)'; g.beginPath(); g.arc((i * 7919) % W, (i * 104729) % H, 20 + i % 120, 0, 7); g.fill(); }
      c.toBlob(function (b) { res(new File([b], 'photo.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.9);
    });
  }
};
</script></body></html>
